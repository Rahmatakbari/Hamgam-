<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>سیستم آفلاین فروشگاه هم‌گام</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

    <style>
    /* =========================================================
       Hamgam Clean Design System
       Order: tokens, reset, typography, layout, navigation,
       components, forms, tables, pages, responsive, print.
       UI only: JavaScript, data, ids and events are unchanged.
       ========================================================= */

    /* 1) Design tokens */
    :root{
      color-scheme:light;
      --color-primary:#0F4C5C;
      --color-primary-hover:#0B3D4A;
      --color-primary-soft:#E7F3F5;
      --color-accent:#B4532A;
      --color-accent-soft:#FFF1E8;
      --color-secondary:#2D7C87;
      --color-background:#F2F1EC;
      --color-surface:#FFFFFF;
      --color-surface-soft:#F8F7F2;
      --color-surface-muted:#ECEBE4;
      --color-text:#1F2933;
      --color-text-secondary:#6B7280;
      --color-text-muted:#9CA3AF;
      --color-border:#E1DDD2;
      --color-border-strong:#C9C2B5;
      --color-success:#16803c;
      --color-success-soft:#ecfdf3;
      --color-warning:#b7791f;
      --color-warning-soft:#fffaeb;
      --color-danger:#b42318;
      --color-danger-soft:#fff1f3;
      --color-info:#175cd3;
      --color-info-soft:#eff8ff;
      --radius-xs:8px;
      --radius-sm:12px;
      --radius-md:16px;
      --radius-lg:20px;
      --radius-xl:24px;
      --shadow-xs:0 1px 2px rgba(16,24,40,.04);
      --shadow-sm:0 4px 12px rgba(16,24,40,.05);
      --shadow-md:0 10px 26px rgba(16,24,40,.07);
      --focus-ring:0 0 0 3px rgba(22,78,99,.16);
      --font-sans:"Noto Sans Arabic","Noto Naskh Arabic","Vazirmatn","Segoe UI",Tahoma,Arial,sans-serif;
      --tap:44px;
      --bottom-nav-h:72px;
      --bg:var(--color-background);
      --panel:var(--color-surface);
      --text:var(--color-text);
      --muted:var(--color-text-secondary);
      --line:var(--color-border);
      --primary:var(--color-primary);
      --good:var(--color-success);
      --warn:#d97706;
      --bad:var(--color-danger);
      --radius:var(--radius-md);
      --shadow:var(--shadow-sm);
    }
    html[data-theme="dark"]{
      color-scheme:dark;
      --color-primary:#7DD3E1;
      --color-primary-hover:#A5E7EF;
      --color-primary-soft:rgba(125,211,225,.13);
      --color-accent:#E08A56;
      --color-accent-soft:rgba(224,138,86,.14);
      --color-secondary:#7DD3E1;
      --color-background:#0B1117;
      --color-surface:#121B22;
      --color-surface-soft:#0F171D;
      --color-surface-muted:#1A252D;
      --color-text:#f8fafc;
      --color-text-secondary:#a3adbd;
      --color-text-muted:#7d8a9f;
      --color-border:#2B373E;
      --color-border-strong:#3D4B53;
      --color-success:#34d399;
      --color-success-soft:rgba(52,211,153,.12);
      --color-warning:#fbbf24;
      --color-warning-soft:rgba(251,191,36,.12);
      --color-danger:#fb7185;
      --color-danger-soft:rgba(251,113,133,.12);
      --color-info:#60a5fa;
      --color-info-soft:rgba(96,165,250,.12);
      --shadow-xs:0 1px 2px rgba(0,0,0,.20);
      --shadow-sm:0 8px 18px rgba(0,0,0,.22);
      --shadow-md:0 12px 30px rgba(0,0,0,.26);
    }

    /* 2) Reset */
    *{box-sizing:border-box}
    html{min-height:100%;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
    body{margin:0;min-height:100dvh;background:var(--color-background);color:var(--color-text);font-family:var(--font-sans);line-height:1.6;direction:rtl;overflow-x:hidden}
    button,input,select,textarea{font:inherit;direction:rtl}
    button{cursor:pointer;touch-action:manipulation}
    button:disabled,input:disabled,select:disabled,textarea:disabled{opacity:.55;cursor:not-allowed}
    a{color:inherit}
    ::selection{background:rgba(22,78,99,.16)}


    /* Universal multilingual font stack: Persian, Arabic, English */
    body,input,select,textarea,button,table{font-family:var(--font-sans);font-feature-settings:"kern" 1;font-kerning:normal}

    /* 3) Typography */
    h1,h2,h3,h4,p{margin-top:0}
    .muted{color:var(--color-text-secondary)}
    .small{font-size:12px}
    .ltr{direction:ltr;display:inline-block}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .ui-icon{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.18em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .icon .ui-icon,.nav-svg{width:22px;height:22px}

    /* 4) Layout */
    .app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh;background:transparent}
    .main{min-width:0;width:100%;max-width:1320px;margin:0 auto;padding:20px}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:12px 14px;box-shadow:var(--shadow-xs)}
    .topbar h2{margin:0;font-size:21px;font-weight:850;letter-spacing:-.02em;color:var(--color-text)}
    .topbar .meta{color:var(--color-text-secondary);font-size:12px}
    #view.view-enter{animation:pageIn .14s ease-out}
    @keyframes pageIn{from{opacity:.65;transform:translateY(4px)}to{opacity:1;transform:none}}

    /* 5) Navigation */
    .sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:#0f172a;color:#fff;padding:16px;box-shadow:none}
    .brand{display:flex;align-items:center;gap:10px;padding-bottom:14px;margin-bottom:12px;border-bottom:1px solid rgba(255,255,255,.10)}
    .brand .logo{width:44px;height:44px;border-radius:14px;background:var(--color-primary);display:grid;place-items:center;color:#fff;font-weight:900;flex:0 0 44px}
    .brand h1{margin:0;font-size:16px;font-weight:850;color:#fff;line-height:1.35}
    .brand p{margin:2px 0 0;color:#cbd5e1;font-size:11px}
    .side-note{margin-top:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);color:#cbd5e1;border-radius:var(--radius-md);padding:12px;font-size:12px;line-height:1.75}
    .nav{display:grid;gap:6px}
    .nav button{width:100%;min-height:46px;display:flex;align-items:center;gap:10px;text-align:right;background:transparent;border:1px solid transparent;color:#cbd5e1;border-radius:var(--radius-sm);padding:10px 11px;font-size:13px;font-weight:750;transition:background .15s ease,color .15s ease,transform .1s ease}
    .nav button:hover{background:rgba(255,255,255,.08);color:#fff}
    .nav button.active{background:var(--color-primary);color:#fff}
    .nav button:active{transform:scale(.98)}

    /* 6) Components */
    .panel,.card,.smart-panel,.purchase-card,.purchase-recent details,.inv-action-card,.inv-search-panel,.inv-recent details,.settings-card,.settings-fold,.db-health,.rc-panel,.rc-section,.report-fold,.account-edit-card,.account-menu-box,.profile-simple-card,.customer-payment-box,.account-sale-box,.profile-simple-head,.product-profile-panel,.product-profile-head,.search-box-main,.search-result-card,.inventory-card,.acc-lite-card,.acc-lite-summary,.acc-lite-controls,.simple-invoice,.invoice-card,.journal-card,.payment-row,.product-mini-row,.report-mini-row,.home-mini-panel{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs);color:var(--color-text)}
    .panel,.card,.settings-card,.account-edit-card,.product-profile-panel,.profile-simple-card,.customer-payment-box,.account-sale-box,.rc-panel{padding:14px}
    .panel h3,.settings-card h3,.rc-panel h3,.product-profile-panel h3,.profile-simple-card h3{font-size:16px;font-weight:850;color:var(--color-text);margin:0 0 10px}
    .panel-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
    .panel-title h3{margin:0}
    .empty{background:var(--color-surface-soft);border:1px dashed var(--color-border-strong);border-radius:var(--radius-md);padding:16px;text-align:center;color:var(--color-text-secondary);font-size:13px}
    .advanced-note,.backup-external-guide{background:var(--color-surface-soft);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:11px 12px;color:var(--color-text-secondary);font-size:12.5px;line-height:1.75}
    .backup-external-guide b{color:var(--color-text)}
    .backup-external-guide ul{margin:6px 0 0;padding-right:18px}
    .backup-external-guide .warn{color:var(--color-danger);font-weight:800}
    .badge{display:inline-flex;align-items:center;justify-content:center;gap:5px;border-radius:999px;padding:4px 9px;font-size:11.5px;font-weight:800}
    .badge.good{background:var(--color-success-soft);color:var(--color-success)}
    .badge.bad{background:var(--color-danger-soft);color:var(--color-danger)}
    .badge.warn{background:var(--color-warning-soft);color:var(--color-warning)}
    .badge.info{background:var(--color-info-soft);color:var(--color-info)}
    .badge.gray{background:var(--color-surface-muted);color:var(--color-text-secondary)}
    .toast{position:fixed;left:16px;bottom:16px;z-index:200;display:none;max-width:min(360px,calc(100vw - 32px));background:#111827;color:#fff;border-radius:var(--radius-md);padding:11px 13px;box-shadow:var(--shadow-md);font-size:13px}
    .toast.show{display:block;animation:pageIn .14s ease-out}
    .toast.good{background:#166534}.toast.bad{background:#991b1b}.toast.warn{background:#92400e}

    /* 7) Buttons */
    .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .btn{min-height:40px;border:0;border-radius:var(--radius-sm);padding:9px 13px;background:var(--color-primary);color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;transition:transform .1s ease,filter .15s ease,background .15s ease}
    .btn:hover{filter:brightness(.97)}
    .btn:active{transform:scale(.98)}
    .btn.secondary{background:var(--color-primary-soft);color:var(--color-primary)}
    .btn.ghost{background:var(--color-surface-soft);color:var(--color-text);border:1px solid var(--color-border)}
    .btn.good{background:var(--color-success);color:#fff}
    .btn.warn{background:#d97706;color:#fff}
    .btn.bad{background:var(--color-danger);color:#fff}
    .btn.dark{background:#111827;color:#fff}
    .btn.smallbtn{min-height:34px;border-radius:var(--radius-xs);padding:6px 9px;font-size:12px}

    /* 8) Forms */
    .form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .form-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
    .form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
    .field{display:grid;gap:6px}
    .field label{font-size:12px;font-weight:750;color:var(--color-text-secondary)}
    .field input,.field select,.field textarea,.acc-lite-select,.account-sort-select,.global-search-input input,.inv-search-box input{width:100%;min-height:44px;border:1px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-surface);color:var(--color-text);padding:9px 11px;outline:0;box-shadow:none}
    .field textarea{min-height:72px;resize:vertical}
    .field input:focus,.field select:focus,.field textarea:focus,.acc-lite-select:focus,.global-search-input input:focus,.inv-search-box input:focus{border-color:var(--color-primary);box-shadow:var(--focus-ring)}
    ::placeholder{color:var(--color-text-muted)}

    /* 9) Tables */
    .table-wrap{overflow:auto;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface)}
    table{width:100%;min-width:760px;border-collapse:collapse;background:transparent}
    th,td{padding:10px;border-bottom:1px solid var(--color-border);text-align:right;vertical-align:top;color:var(--color-text)}
    th{background:var(--color-surface-soft);color:var(--color-text-secondary);font-size:12px;font-weight:800;position:sticky;top:0;z-index:1}
    tr:last-child td{border-bottom:0}

    /* 10) Dashboard */
    .home-screen{display:grid;gap:14px}
    .home-modern-header{background:linear-gradient(135deg,#0f172a,#164e63);color:#fff;border-radius:var(--radius-xl);padding:16px;border:1px solid rgba(255,255,255,.10);box-shadow:var(--shadow-sm)}
    .home-modern-brand h2{margin:0;color:#fff;font-size:20px;font-weight:850;line-height:1.35}
    .home-modern-brand p{margin:3px 0 0;color:#dbeafe;font-size:12px}
    .home-modern-title{margin-top:12px;background:rgba(255,255,255,.10);border-radius:var(--radius-md);padding:9px 11px}
    .home-modern-title h3{margin:0;color:#fff;font-size:16px;font-weight:850}
    .home-modern-title small{color:#dbeafe;font-size:11px}
    .sales-glass-card{padding:15px;border-radius:var(--radius-lg);background:var(--color-surface);border:1px solid var(--color-border);box-shadow:var(--shadow-xs)}
    .sales-glass-card .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .sales-glass-card .label{font-size:15px;font-weight:850;color:var(--color-text)}
    .sales-glass-card .sub,.sales-glass-card .mini{font-size:11.5px;color:var(--color-text-secondary)}
    .sales-glass-card .amount{font-size:24px;font-weight:900;color:var(--color-text);margin-top:8px;line-height:1.25}
    .soft-icon-btn{width:38px;height:38px;border-radius:var(--radius-sm);display:grid;place-items:center;background:var(--color-primary-soft);color:var(--color-primary)}
    .home-today{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
    .home-stat{padding:10px;border-radius:var(--radius-md);background:var(--color-surface);border:1px solid var(--color-border)}
    .home-stat span{display:block;color:var(--color-text-secondary);font-size:10.5px}.home-stat b{display:block;margin-top:3px;font-size:14px;font-weight:850;color:var(--color-text)}.home-stat.good b{color:var(--color-success)}.home-stat.warn b{color:var(--color-warning)}.home-stat.bad b{color:var(--color-danger)}
    .quick-heading{display:flex;align-items:center;gap:8px}.quick-heading:before{content:'';width:5px;height:22px;border-radius:999px;background:var(--color-primary)}.quick-heading h3{margin:0;font-size:17px;font-weight:850;color:var(--color-text)}
    .home-action-grid.core-four{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .home-action-card{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:86px;padding:12px;border:1px solid var(--color-border);border-radius:var(--radius-lg);background:var(--color-surface);color:var(--color-text);text-align:right;font-weight:850}
    .home-action-card .txt small{display:block;margin-top:3px;color:var(--color-text-secondary);font-size:10.5px;line-height:1.45}
    .home-action-card .ico{width:40px;height:40px;display:grid;place-items:center;border-radius:var(--radius-sm);background:var(--color-surface-muted);color:var(--color-text-secondary);flex:0 0 40px}.home-action-card.green .ico{background:var(--color-success-soft);color:var(--color-success)}.home-action-card.orange .ico{background:var(--color-warning-soft);color:var(--color-warning)}.home-action-card.blue .ico{background:var(--color-info-soft);color:var(--color-info)}
    .home-mini-panels{display:grid;grid-template-columns:1fr 1fr;gap:10px}.home-mini-panel{padding:12px}.home-mini-panel h3{margin:0 0 8px;font-size:14px;font-weight:850;color:var(--color-text)}.home-mini-list{display:grid;gap:7px}.home-mini-row,.home-recent-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--color-surface-soft);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:8px}.home-mini-row b,.home-recent-main b{display:block;font-size:12px;color:var(--color-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.home-mini-row span,.home-recent-main span{display:block;font-size:10.5px;color:var(--color-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.home-mini-row .amt,.home-recent-side strong{font-size:11.5px;font-weight:850;white-space:nowrap}.home-recent-list{display:grid;gap:7px}.home-recent-side{text-align:left}.home-recent-side small{display:block;font-size:9.5px;color:var(--color-text-secondary)}.home-recent-more{border:0;background:transparent;color:var(--color-primary);font-size:11.5px;font-weight:800;text-align:right;padding:4px 2px;min-height:28px}

    /* 11) Inventory */
    .inventory-v2{display:grid;gap:12px}.inv-hero,.purchase-hero,.settings-hero,.search-hero,.acc-lite-head,.product-profile-head,.account-edit-head{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:14px;box-shadow:var(--shadow-xs);color:var(--color-text)}
    .inv-hero-main,.purchase-hero-main,.acc-lite-title,.search-hero-main,.product-profile-main{display:flex;align-items:center;gap:10px;min-width:0}.inv-hero-icon,.purchase-icon,.acc-lite-icon,.search-hero-icon,.product-profile-icon{width:44px;height:44px;display:grid;place-items:center;flex:0 0 44px;border-radius:var(--radius-sm);background:var(--color-primary-soft);color:var(--color-primary)}.inv-hero h3,.purchase-hero h3,.settings-hero h3,.search-hero h3,.acc-lite-title h3{margin:0;font-size:18px;font-weight:850}.inv-hero p,.purchase-hero p,.settings-hero p,.search-hero p,.acc-lite-title p{margin:2px 0 0;color:var(--color-text-secondary);font-size:12px}.inv-hero-pill,.purchase-pill,.settings-pill,.acc-lite-count{background:var(--color-primary-soft);color:var(--color-primary);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;white-space:nowrap}
    .inv-stats,.purchase-kpis,.rc-summary,.acc-lite-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.inv-stat,.purchase-kpi,.rc-card,.acc-lite-stat,.profile-balance-mini,.product-profile-kpi{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:10px;box-shadow:var(--shadow-xs)}.inv-stat span,.purchase-kpi span,.rc-card span,.acc-lite-stat span,.profile-balance-mini span,.product-profile-kpi span{display:block;color:var(--color-text-secondary);font-size:10.5px}.inv-stat b,.purchase-kpi b,.rc-card b,.acc-lite-stat b,.profile-balance-mini b,.product-profile-kpi b{display:block;margin-top:3px;color:var(--color-text);font-size:14px;font-weight:850}

    /* Motion system: fast, subtle, unified */
    :root{

      --motion-fast:140ms;
      --motion-ui:190ms;
      --motion-sheet:240ms;
      --motion-page:220ms;
      --motion-press:100ms;
    }

    @keyframes hg-view-in{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    @keyframes hg-card-in{from{opacity:.001;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    @keyframes hg-sheet-in{from{opacity:.001;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    @keyframes hg-pop-in{from{opacity:.001;transform:translateY(4px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes hg-fade-in{from{opacity:0}to{opacity:1}}
    @keyframes hg-toast-in{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes hg-toast-out{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(8px)}}
    @keyframes hg-shake{0%,100%{transform:translateX(0)}22%{transform:translateX(-4px)}44%{transform:translateX(4px)}66%{transform:translateX(-2px)}88%{transform:translateX(1px)}}
    @keyframes hg-details-in{from{opacity:.001;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
    @keyframes hg-skeleton{0%{background-position:120% 0}100%{background-position:-120% 0}}

function simpleHash(str){let h=2166136261;str=String(str||'');for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}

}

function renderProducts(){

function saveProductForm(ev){
  ev.preventDefault();
  const category=document.getElementById('prodCategory').value.trim(),name=document.getElementById('prodName').value.trim(),unit=document.getElementById('prodUnit').value.trim();
  if(!category||!name||!unit)return toast('کالای اصلی، نوع کالا و واحد ضروری است.','bad');
  if(db.products.some(p=>p.id!==state.productEditId&&productCategory(p).trim()===category&&String(p.name||'').trim()===name))return toast('این نوع برای همین کالای اصلی قبلاً ثبت شده است.','bad');
  if(state.productEditId){
    const p=productById(state.productEditId),before=auditClone(p);Object.assign(p,{category,name,unit,minStock:toNum(document.getElementById('prodMin').value)});
    addAuditLog('update','product',{id:p.id,title:fullProductName(p),before,after:p,note:'ویرایش جنس'});state.productEditId=null
  }else{
    const p={id:uid(),category,name,unit,stock:0,buyPrice:0,sellPrice:0,minStock:toNum(document.getElementById('prodMin').value),active:true,createdAt:nowISOTime()};
    db.products.push(p);addAuditLog('create','product',{id:p.id,title:fullProductName(p),after:p,note:'افزودن کالا'})
  }
  state.inventoryTool=null;saveDB(false);toast('نوع کالا ذخیره شد. برای افزایش موجودی از «ورود کالا» استفاده کنید.');render()
}
function editProduct(id){state.view='products';state.productProfileId=null;state.inventoryTool='add';state.productEditId=id;pushAppHistory({view:'products',inventoryTool:'add',productEditId:id},'#products/edit/'+id);render();window.scrollTo({top:0,behavior:'smooth'})}
function toggleProduct(id){const p=productById(id);if(!p)return;p.active=p.active===false?true:false;saveDB(false);toast('حالت جنس تغییر کرد.');render()}
function saveAdjustment(){const date=solarToIso(document.getElementById('adjDate').value),p=productById(document.getElementById('adjProduct').value),type=document.getElementById('adjType').value,q=toNum(document.getElementById('adjQty').value),reason=document.getElementById('adjReason').value.trim();if(!date)return toast('تاریخ صحیح نیست.','bad');if(!p)return toast('نوع کالا انتخاب نشده است.','bad');if(q<=0)return toast('مقدار صحیح نیست.','bad');const signed=type==='add'?q:-q;if(toNum(p.stock)+signed<0)return toast('موجودی نمی‌تواند منفی شود.','bad');p.stock=round2(toNum(p.stock)+signed);const adj={id:uid(),date,productId:p.id,category:productCategory(p),productName:p.name,unit:p.unit,qtySigned:signed,reason,operator:currentOperator(),createdAt:nowISOTime()};db.adjustments.push(adj);addStockMove({...productSnapshot(p.id,p),date,type:signed>=0?'adjust_in':'adjust_out',qtyIn:signed>=0?signed:0,qtyOut:signed<0?Math.abs(signed):0,refType:'adjustment',refId:adj.id,refNo:'',party:'',note:reason||'اصلاح انبار',balanceAfter:p.stock});addAuditLog('create','adjustment',{id:adj.id,title:fullProductNameFrom(adj.category,adj.productName),after:adj,note:reason||'اصلاح انبار'});state.inventoryTool=null;saveDB(false);toast('اصلاح انبار ثبت شد.');render()}
function renderAdjustments(){const list=[...db.adjustments].sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt)).slice(0,20);if(!list.length)return '<div class="empty">هنوز اصلاح موجودی ثبت نشده است.</div>';return `<div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>جنس</th><th>تغییر</th><th>دلیل</th><th>عملیات</th></tr></thead><tbody>${list.map(a=>`<tr><td>${formatDate(a.date)}</td><td>${e(fullProductNameFrom(a.category,a.productName))}</td><td><span class="badge ${a.qtySigned>=0?'good':'bad'}">${a.qtySigned>=0?'+':''}${qty(a.qtySigned)} ${e(a.unit)}</span></td><td>${e(a.reason||'-')}</td><td><button class="btn smallbtn bad" onclick="deleteAdjustment('${a.id}')">حذف</button></td></tr>`).join('')}</tbody></table></div>`}
function deleteAdjustment(id){if(!requireDeletePin('حذف اصلاح انبار'))return;createInternalBackup('beforeDeleteAdjustment');const a=db.adjustments.find(x=>x.id===id);if(!a)return;if(!confirm('این اصلاح حذف شود؟ اثر آن از موجودی برعکس می‌شود.'))return;const p=productById(a.productId);if(p){if(toNum(p.stock)-toNum(a.qtySigned)<0)return toast('با حذف این اصلاح، موجودی منفی می‌شود.','bad');p.stock=round2(toNum(p.stock)-toNum(a.qtySigned));const q=toNum(a.qtySigned);addStockMove({...productSnapshot(a.productId,a),date:todayIso(),type:q>=0?'adjust_delete_out':'adjust_delete_in',qtyIn:q<0?Math.abs(q):0,qtyOut:q>=0?q:0,refType:'adjustment',refId:a.id,refNo:'',party:'',note:'حذف اصلاح انبار',balanceAfter:p.stock});addAuditLog('delete','adjustment',{id:a.id,title:fullProductNameFrom(a.category,a.productName),before:a,note:'حذف اصلاح انبار'})}db.adjustments=db.adjustments.filter(x=>x.id!==id);saveDB(false);toast('اصلاح حذف شد.','warn');render()}
function daysBetweenIso(a,b){try{const d1=new Date(a+'T00:00:00'),d2=new Date(b+'T00:00:00');return Math.max(0,Math.floor((d2-d1)/86400000))}catch(e){return 0}}
function customerDebtInfo(id){const entries=[];(db.sales||[]).filter(s=>s.customerId===id).forEach(s=>entries.push({date:s.date,createdAt:s.createdAt||'',debit:toNum(s.total),credit:toNum(s.paid)}));(db.payments||[]).filter(p=>p.customerId===id).forEach(p=>entries.push({date:p.date,createdAt:p.createdAt||'',debit:customerPaymentOutAmount(p),credit:customerPaymentInAmount(p)}));(db.accountAdjustments||[]).filter(a=>a.customerId===id).forEach(a=>{const d=accountAdjustmentDelta(a);entries.push({date:a.date,createdAt:a.createdAt||'',debit:d>0?d:0,credit:d<0?Math.abs(d):0})});entries.sort((a,b)=>(a.date+a.createdAt).localeCompare(b.date+b.createdAt));let bal=0,start=null;for(const r of entries){const prev=bal;bal=round2(bal+toNum(r.debit)-toNum(r.credit));if(prev<=0&&bal>0)start=r.date;if(bal<=0)start=null}return{balance:round2(bal),since:start,days:start?daysBetweenIso(start,todayIso()):0}}
function customerDebtAlert(id){const info=customerDebtInfo(id),daysLimit=toNum(db.settings.debtWarnDays||30),messages=[];if(info.balance>0&&daysLimit>0&&info.days>=daysLimit)messages.push(`مشتری ${customerById(id)?.name||''} ${fmt(info.days)} روز است بدهکار است.`);const c=customerById(id),limit=toNum(c?.creditLimit||0);if(info.balance>0&&limit>0&&info.balance>limit)messages.push(`بدهی مشتری از حد اعتبار (${money(limit)}) گذشته است.`);return{...info,creditLimit:limit,has:messages.length>0,messages}}
function lastAccountActivity(id){let dates=[];db.sales.filter(x=>x.customerId===id).forEach(x=>dates.push(x.date));db.payments.filter(x=>x.customerId===id).forEach(x=>dates.push(x.date));db.purchases.filter(x=>x.supplierId===id).forEach(x=>dates.push(x.date));(db.supplierPayments||[]).filter(x=>x.supplierId===id).forEach(x=>dates.push(x.date));(db.expenses||[]).filter(x=>x.accountId===id).forEach(x=>dates.push(x.date));(db.accountAdjustments||[]).filter(x=>x.customerId===id).forEach(x=>dates.push(x.date));(db.cashMoves||[]).filter(x=>x.partyId===id).forEach(x=>dates.push(x.date));return dates.sort().pop()||''}

function renderCustomers(){
  if(state.accountAddMode)return renderAccountAddPage();
  if(state.customerEditId)return renderAccountEditPage(state.customerEditId);
  if(state.statementCustomerId)return renderAccountDetailPage(state.statementCustomerId);
  const all=[...db.customers];
  const activeAll=all.filter(c=>c.active!==false),inactiveAll=all.filter(c=>c.active===false);
  const debtCount=activeAll.filter(c=>accountReceivable(c.id)>0||supplierBalance(c.id)>0).length,clearCount=activeAll.filter(c=>accountReceivable(c.id)===0&&accountPayable(c.id)===0&&expenseTotal(c.id)===0).length,creditCount=activeAll.filter(c=>customerBalance(c.id)<0).length;
  const filterKey=state.accountFilter==='inactive'?'inactive':(state.accountBalanceFilter||'all');
  let rows=[...(filterKey==='inactive'?inactiveAll:activeAll)];
  if(filterKey==='debt')rows=rows.filter(c=>accountReceivable(c.id)>0||supplierBalance(c.id)>0);
  if(filterKey==='clear')rows=rows.filter(c=>accountReceivable(c.id)===0&&accountPayable(c.id)===0&&expenseTotal(c.id)===0);
  if(filterKey==='credit')rows=rows.filter(c=>customerBalance(c.id)<0);
  if(filterKey==='customer')rows=rows.filter(isCustomerAccount);
  if(filterKey==='supplier')rows=rows.filter(isSupplierAccount);
  if(filterKey==='expense')rows=rows.filter(isExpenseAccount);
  if(['sarraf','bank','company','owner'].includes(filterKey))rows=rows.filter(c=>(c.type||'customer')===filterKey);
  const q=String(state.customerSearch||'').trim().toLowerCase();

function customerStatementText(id){const c=customerById(id);if(!c)return'';const sales=[...db.sales.filter(s=>s.customerId===id)].sort((a,b)=>(a.date+a.createdAt).localeCompare(b.date+b.createdAt));const paysAll=[...db.payments.filter(p=>p.customerId===id)].sort((a,b)=>(a.date+a.createdAt).localeCompare(b.date+b.createdAt));const pays=paysAll.filter(p=>!isCustomerCashOut(p)),cashOuts=paysAll.filter(isCustomerCashOut);const totalSales=sales.reduce((a,s)=>a+toNum(s.total),0),paidInBills=sales.reduce((a,s)=>a+toNum(s.paid),0),extraPaid=pays.reduce((a,p)=>a+customerPaymentInAmount(p),0),cashOutTotal=cashOuts.reduce((a,p)=>a+customerPaymentOutAmount(p),0),bal=customerBalance(id);let lines=[];lines.push(db.settings.shopName||'فروشگاه هم‌گام');lines.push('صورت حساب مشتری');lines.push('----------------');lines.push('نام: '+c.name);if(c.phone)lines.push('شماره: '+c.phone);if(c.address)lines.push('آدرس: '+c.address);lines.push('تاریخ: '+formatDate(todayIso()));lines.push('');lines.push('مجموع بردگی جنس: '+money(totalSales));if(cashOutTotal>0)lines.push('مجموع بردگی: '+money(cashOutTotal));lines.push('پرداخت داخل فاکتورها: '+money(paidInBills));lines.push('آوردگی/پرداخت جداگانه: '+money(extraPaid));lines.push(bal>0?'باقی مشتری: '+money(bal):bal<0?'مطالبات مشتری از ما: '+money(Math.abs(bal)):'حساب صاف است');if(sales.length){lines.push('');lines.push('فاکتورها:');sales.slice(-15).forEach(s=>{const due=Math.max(0,toNum(s.total)-toNum(s.paid));const items=(s.items||[]).map(i=>fullProductNameFrom(i.category,i.productName)+' '+qty(i.qty)+' '+(i.unit||'')).join('، ');lines.push(`${formatDate(s.date)} | فاکتور ${s.invoiceNo||''} | ${items} | مجموع ${money(s.total)} | رسید ${money(s.paid)} | باقی ${money(due)}`)});if(sales.length>15)lines.push(`... و ${fmt(sales.length-15)} فاکتور دیگر`)}if(cashOuts.length){lines.push('');lines.push('بردگی:');cashOuts.slice(-10).forEach(p=>lines.push(`${formatDate(p.date)} | ${money(customerPaymentOutAmount(p))} | ${p.method||''} ${p.note?'- '+p.note:'   addAuditLog('delete','customer',{id:c.id,title:c.name,before:c,note:`حذف حساب و ${sales.length} فاکتور / ${payments.length} آوردگی یا بردگی`});

function buildAccountSaleLineFromInputs(){

  if(!itemText){toast('نام کالا یا شرح فروش را وارد کنید.','bad');return false}
  if(q<=0)q=1;
  if(lineTotal<=0&&price>0)lineTotal=round2(q*price);
  if(lineTotal>0&&price<=0)price=round2(lineTotal/q);
  if(lineTotal<=0){toast('مجموع فروش یا قیمت فی واحد را وارد کنید.','bad');return false}
  if(price<0||q<=0){toast('مقدار یا قیمت صحیح نیست.','bad');return false}
  const match=findProductByText(itemText);
  if(match){
    if(!unitText)unitText=match.unit||'';
    if(!db.settings.allowNegativeStock&&toNum(match.stock)<q){toast('موجودی '+match.name+' کافی نیست.','bad');return false}

}

function saveSaleInvoiceEdit(id){const s=db.sales.find(x=>x.id===id);if(!s)return toast('فاکتور یافت نشد.','bad');if(saleHasReturns(s))return toast('این فاکتور برگشت دارد؛ ویرایش اقلام برای حفظ انبار بسته است.','bad');const date=solarToIso(document.getElementById('editSaleDate_'+id).value);if(!date)return toast('تاریخ فاکتور صحیح نیست.','bad');let newItems=[],invalid=false;(s.items||[]).forEach((old,idx)=>{const q=toNum(document.getElementById('editSaleQty_'+id+'_'+idx).value),price=toNum(document.getElementById('editSalePrice_'+id+'_'+idx).value);if(q<0||price<0)invalid=true;if(q>0)newItems.push({...old,qty:q,price:price,total:round2(q*price)})});if(invalid)return toast('مقدار یا قیمت منفی صحیح نیست.','bad');if(!newItems.length)return toast('فاکتور بدون جنس شده نمی‌تواند.','bad');const subtotal=round2(newItems.reduce((a,i)=>a+toNum(i.total),0)),discount=toNum(document.getElementById('editSaleDiscount_'+id).value);if(discount<0||discount>subtotal)return toast('تخفیف صحیح نیست.','bad');const total=round2(subtotal-discount),paid=toNum(document.getElementById('editSalePaid_'+id).value);if(paid<0||paid>total)return toast('مبلغ رسیده باید بین صفر و مجموع فاکتور باشد.','bad');let oldReq={},newReq={};(s.items||[]).filter(i=>i.productId).forEach(i=>oldReq[i.productId]=(oldReq[i.productId]||0)+toNum(i.qty));newItems.filter(i=>i.productId).forEach(i=>newReq[i.productId]=(newReq[i.productId]||0)+toNum(i.qty));for(const pid of new Set([...Object.keys(oldReq),...Object.keys(newReq)])){const p=productById(pid);if(!p)continue;const after=round2(toNum(p.stock)+(oldReq[pid]||0)-(newReq[pid]||0));if(after<0&&!db.settings.allowNegativeStock)return toast('موجودی '+p.name+' برای این ویرایش کافی نیست.','bad')}createInternalBackup('beforeEditSale');for(const pid of new Set([...Object.keys(oldReq),...Object.keys(newReq)])){const p=productById(pid);if(p){const diff=round2((newReq[pid]||0)-(oldReq[pid]||0));p.stock=round2(toNum(p.stock)+(oldReq[pid]||0)-(newReq[pid]||0));if(diff>0)addStockMove({...productSnapshot(pid,p),date,type:'sale_edit_out',qtyOut:diff,refType:'sale',refId:s.id,refNo:s.invoiceNo,party:s.customerName,note:'ویرایش فاکتور: افزایش مقدار',balanceAfter:p.stock});if(diff<0)addStockMove({...productSnapshot(pid,p),date,type:'sale_edit_in',qtyIn:Math.abs(diff),refType:'sale',refId:s.id,refNo:s.invoiceNo,party:s.customerName,note:'ویرایش فاکتور: کاهش مقدار',balanceAfter:p.stock})}}const beforeSale=auditClone(s);Object.assign(s,{date,items:newItems,subtotal,discount,total,paid,due:round2(total-paid),note:document.getElementById('editSaleNote_'+id).value.trim(),costTotal:round2(newItems.reduce((a,i)=>a+toNum(i.qty)*toNum(i.cost),0))});if(beforeSale.treasuryStatus==='entered'){const diff=round2(toNum(paid)-toNum(beforeSale.paid));if(diff>0){const cm=addCashMove({date,direction:'in',amount:diff,method:s.paymentMethod,partyId:s.customerId,partyName:s.customerName,source:'sale_payment',reason:'افزایش پرداخت فاکتور '+(s.invoiceNo||''),refType:'sale',refId:s.id,refNo:s.invoiceNo});if(cm)s.cashMoveId=cm.id}else if(diff<0){addCashMove({date,direction:'out',amount:Math.abs(diff),method:s.paymentMethod,partyId:s.customerId,partyName:s.customerName,source:'reversal',reason:'کاهش پرداخت فاکتور '+(s.invoiceNo||''),refType:'sale',refId:s.id,refNo:s.invoiceNo})}}addAuditLog('update','sale',{id:s.id,title:'فاکتور '+s.invoiceNo+' - '+s.customerName,before:beforeSale,after:s,note:'ویرایش فاکتور'});state.editSaleId=null;saveDB(false);toast('فاکتور ویرایش شد.');render()}

  let remaining=amount,supplierPart=0,customerPart=0,supplierRecord=null,customerRecord=null;const supDue=Math.max(0,supplierBalance(id));if(supDue>0&&remaining>0){supplierPart=round2(Math.min(remaining,supDue));supplierRecord={id:uid(),date,supplierId:id,amount:supplierPart,method:'نقد',note,source:'accountMoney',treasuryStatus:treasury?'entered':'not_entered',operator:currentOperator(),createdAt:nowISOTime()};promoteAccountRole(c,'supplier');db.supplierPayments=db.supplierPayments||[];db.supplierPayments.push(supplierRecord);addAuditLog('create','supplierPayment',{id:supplierRecord.id,title:c.name+' - بردگی - '+money(supplierPart),after:supplierRecord,note:'بردگی / پرداخت طلب فراهم کننده'}) ;remaining=round2(remaining-supplierPart)}if(remaining>0){customerPart=remaining;customerRecord={id:uid(),date,customerId:id,amount:customerPart,direction:'out',method:'نقد',note,treasuryStatus:treasury?'entered':'not_entered',operator:currentOperator(),createdAt:nowISOTime()};promoteAccountRole(c,'customer');db.payments.push(customerRecord);addAuditLog('create','payment',{id:customerRecord.id,title:c.name+' - بردگی - '+money(customerPart),after:customerRecord,note})}if(treasury){const ref=supplierRecord||customerRecord;const cm=addCashMove({date,direction:'out',amount,method:'نقد',partyId:id,partyName:c.name,source:'customer_cash_out',reason:'بردگی به '+c.name,note,refType:ref?(supplierRecord&&!customerRecord?'supplierPayment':customerRecord&&!supplierRecord?'payment':'account'):'account',refId:ref?ref.id:id,refNo:c.name});if(cm){if(supplierRecord)supplierRecord.cashMoveId=cm.id;if(customerRecord)customerRecord.cashMoveId=cm.id}}saveDB(false);toast('بردگی ثبت شد'+(treasury?' و از خزانه کم شد.':' و خزانه تغییر نکرد.'));render()}

  (db.supplierPayments||[]).filter(p=>p.supplierId===id).forEach(p=>items.push({kind:'supplierPayment',id:p.id,date:p.date,createdAt:p.createdAt||'',title:p.source==='customerCashOut'||p.source==='accountMoney'?'بردگی / پرداخت به مشتری':'پرداخت به فراهم کننده',amount:toNum(p.amount),note:[p.note||'',treasuryStatusText(p)].filter(Boolean).join(' | '),record:p,locked:false}));
  return items.sort((a,b)=>(b.date+(b.createdAt||'')).localeCompare(a.date+(a.createdAt||'')))

function saleCostForProfit(s){

  const items=s.items||[];
  items.forEach(i=>{
    const q=toNum(i.qty),lineAmount=toNum(i.total??(q*toNum(i.price)));
    if(lineAmount<=0)return;
    let unitCost=toNum(i.cost||0),fromProduct=false;
    if(!unitCost&&i.productId){const p=productById(i.productId);unitCost=toNum(p?.buyPrice||0);fromProduct=unitCost>0}
    if(unitCost>0){cost+=q*unitCost;if(fromProduct&&!toNum(i.cost||0))estimated=true}
    else{unknown=true;unknownSales+=lineAmount}
  });

  if(cost<=0&&stored>0){cost=stored;estimated=true}
  return{cost:round2(cost),unknown,estimated,unknownSales:round2(unknownSales)}
}
function saleReturnAmountForProfit(s){const stored=toNum(s.returnTotal||0);if(stored>0)return stored;return round2((s.returns||[]).reduce((a,r)=>a+toNum(r.amount||r.grossAmount||0),0))}

function applyReport(ev){if(ev&&ev.preventDefault)ev.preventDefault();const rs=document.getElementById('repStart'),re=document.getElementById('repEnd');state.reportStart=rs?rs.value.trim():state.reportStart;state.reportEnd=re?re.value.trim():state.reportEnd;const start=state.reportStart?parseReportDate(state.reportStart):null,end=state.reportEnd?parseReportDate(state.reportEnd):null;if(state.reportStart&&!start)return toast('تاریخ شروع صحیح نیست. نمونه: 1405/04/01','bad');if(state.reportEnd&&!end)return toast('تاریخ ختم صحیح نیست. نمونه: 1405/04/31','bad');if(start&&end&&start>end)return toast('تاریخ شروع از تاریخ ختم بزرگ‌تر است.','bad');toast('گزارش نمایش داده شد.','good');render()}

function stableDataString(obj){return JSON.stringify(obj)}
function backupChecksum(data){let str=stableDataString(data),h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16).padStart(8,'0')}

function makeBackupPackage(){const data=auditClone(db);const checksum=backupChecksum(data);return{app:'hamgam-store-offline',backupVersion:2,createdAt:nowISOTime(),date:todayIso(),storageMode,stats:dbStats(data),checksum,data}}
function parseBackupObject(obj){if(obj&&obj.app==='hamgam-store-offline'&&obj.backupVersion>=2&&obj.data){const actual=backupChecksum(obj.data);if(obj.checksum&&obj.checksum!==actual)throw new Error('checksum');return obj.data}return obj}
async function getInternalBackups(){try{if(storageMode==='IndexedDB'&&idbHandle){return (await idbGet(INTERNAL_BACKUP_KEY))||[]}const raw=localStorage.getItem(INTERNAL_BACKUP_KEY);return raw?JSON.parse(raw):[]}catch(e){console.warn('internal backup read failed',e);return[]}}
async function saveInternalBackups(list){internalBackupsCache=list||[];try{if(storageMode==='IndexedDB'&&idbHandle){await idbSet(INTERNAL_BACKUP_KEY,internalBackupsCache)}else{localStorage.setItem(INTERNAL_BACKUP_KEY,JSON.stringify(internalBackupsCache))}}catch(e){console.warn('internal backup save failed',e);try{localStorage.setItem(INTERNAL_BACKUP_KEY,JSON.stringify(internalBackupsCache))}catch(err){}}}
async function refreshInternalBackups(){internalBackupsCache=await getInternalBackups();return internalBackupsCache}
function internalBackupReasonLabel(r){return({daily:'بکاپ روزانه',beforeDeleteSale:'قبل حذف فاکتور',beforeDeletePurchase:'قبل حذف رسید',beforeDeleteAccount:'قبل حذف حساب',beforeReset:'قبل ریست',beforeImport:'قبل وارد کردن بکاپ',beforeSyncStock:'قبل همسان‌سازی موجودی',beforeClearTrash:'قبل پاک‌سازی سطل حذف',beforeDeleteAdjustment:'قبل حذف اصلاح',beforeDeletePayment:'قبل حذف پرداخت'}[r]||r||'بکاپ داخلی')}
async function createInternalBackup(reason='manual'){if(!db)return;const pkg=makeBackupPackage();pkg.internalId=uid();pkg.reason=reason;pkg.reasonLabel=internalBackupReasonLabel(reason);try{let list=await getInternalBackups();if(reason==='daily'&&list.some(x=>x.date===todayIso()&&x.reason==='daily')){internalBackupsCache=list;return}list.unshift(pkg);const limit=Math.max(1,Math.floor(toNum(db.settings.internalBackupLimit||7)||7));list=list.slice(0,limit);await saveInternalBackups(list);if(reason!=='daily')toast('بکاپ داخلی ساخته شد.','good')}catch(e){console.error(e);toast('ساخت بکاپ داخلی ناکام شد.','bad')}}
function renderInternalBackups(){const list=internalBackupsCache||[];if(!list.length)return '<div class="empty">هنوز بکاپ داخلی ساخته نشده است.</div>';return `<div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>نوع</th><th>آمار</th><th>عملیات</th></tr></thead><tbody>${list.map(b=>`<tr><td>${formatDate(b.date)}<br><span class="muted small">${e(String(b.createdAt||'').slice(11,19))}</span></td><td>${e(b.reasonLabel||internalBackupReasonLabel(b.reason))}</td><td class="small muted">مشتری: ${fmt(b.stats?.customers||0)} | فاکتور: ${fmt(b.stats?.sales||0)} | کالا: ${fmt(b.stats?.products||0)}</td><td class="toolbar"><button class="btn smallbtn good" onclick="restoreInternalBackup('${b.internalId}')">بازیابی</button><button class="btn smallbtn secondary" onclick="downloadInternalBackup('${b.internalId}')">دانلود</button></td></tr>`).join('')}</tbody></table></div>`}
async function restoreInternalBackup(id){const list=await getInternalBackups();const b=list.find(x=>x.internalId===id);if(!b)return toast('بکاپ داخلی یافت نشد.','bad');if(!confirm('این بکاپ داخلی بازیابی شود؟ اطلاعات فعلی جایگزین می‌شود.'))return;await createInternalBackup('beforeRestoreInternal');db=ensureDB(auditClone(b.data));saveDB(false);state={...state,view:'dashboard',saleCart:[],purchaseCart:[],sale:null,purchase:null,productEditId:null,productProfileId:null,customerEditId:null,statementCustomerId:null,lastSaleId:null,editSaleId:null,returnSaleId:null,accountAddMode:false,accountActionId:null,accountFilter:'active',accountBalanceFilter:'all',accountSort:'name',accountProfileTab:'history',accountSaleCart:[],accountSale:null,globalSearch:'',unlocked:false};toast('بکاپ داخلی بازیابی شد.','good');render()}
async function downloadInternalBackup(id){const list=await getInternalBackups();const b=list.find(x=>x.internalId===id);if(!b)return toast('بکاپ داخلی یافت نشد.','bad');downloadFile('hamgam-internal-backup-'+(b.date||todayIso())+'.json',JSON.stringify(b,null,2))}
async function clearInternalBackups(){if(!confirm('همه بکاپ‌های داخلی پاک شود؟'))return;await saveInternalBackups([]);toast('بکاپ‌های داخلی پاک شد.','warn');render()}
function openGlobalSearch(){state.view='search';render();setTimeout(()=>document.getElementById('globalSearchInput')?.focus(),80)}
function searchMatch(text,q){return String(text||'').toLowerCase().includes(String(q||'').toLowerCase())}
function buildSearchResults(q){q=String(q||'').trim();if(!q)return[];let out=[];const qd=englishDigits(q).toLowerCase();(db.customers||[]).forEach(c=>{if(searchMatch(c.name,qd)||searchMatch(c.phone,qd)||searchMatch(c.address,qd)||searchMatch(c.note,qd))out.push({kind:'customer',icon:'users',title:c.name,sub:`${c.phone||'بدون شماره'} ${c.address?'— '+c.address:''}`,amount:money(customerBalance(c.id)),action:`state.view='customers';showStatement('${c.id}')`,button:'پروفایل'})});(db.products||[]).forEach(p=>{const name=fullProductName(p);if(searchMatch(name,qd)||searchMatch(p.category,qd)||searchMatch(p.unit,qd))out.push({kind:'product',icon:'warehouse',title:name,sub:`موجودی: ${qty(p.stock)} ${p.unit}`,amount:p.active===false?'غیرفعال':'انبار',action:`state.view='products';openProductProfile('${p.id}')`,button:'حساب جنس'})});(db.sales||[]).forEach(s=>{const items=(s.items||[]).map(i=>fullProductNameFrom(i.category,i.productName)).join(' ');if(searchMatch(s.invoiceNo,qd)||searchMatch(s.customerName,qd)||searchMatch(s.date,qd)||searchMatch(items,qd)||searchMatch(s.total,qd))out.push({kind:'sale',icon:'receipt',title:`فاکتور ${s.invoiceNo||''} — ${s.customerName||'نقدی'}`,sub:`${formatDate(s.date)} | ${items.slice(0,80)}`,amount:money(s.total),action:s.customerId?`state.view='customers';showStatement('${s.customerId}')`:`printSale('${s.id}')`,button:s.customerId?'حساب مشتری':'چاپ'})});(db.purchases||[]).forEach(p=>{const items=(p.items||[]).map(i=>fullProductNameFrom(i.category,i.productName)).join(' ');if(searchMatch(p.receiptNo,qd)||searchMatch(p.supplier,qd)||searchMatch(p.date,qd)||searchMatch(items,qd)||searchMatch(p.total,qd))out.push({kind:'purchase',icon:'boxIn',title:`رسید ${p.receiptNo||''} — ${p.supplier||'-'}`,sub:`${formatDate(p.date)} | ${items.slice(0,80)}`,amount:money(p.total),action:`state.view='purchase';render()`,button:'ورود کالا'})});(db.expenses||[]).forEach(x=>{if(searchMatch(x.description,qd)||searchMatch(x.note,qd)||searchMatch(x.method,qd)||searchMatch(x.amount,qd))out.push({kind:'expense',icon:'expense',title:x.description||x.note||'مصرف',sub:`${formatDate(x.date)} — ${x.method||''}`,amount:money(x.amount),action:`state.view='reports';render()`,button:'گزارش'})});(db.stockMoves||[]).forEach(m=>{if(searchMatch(m.productName,qd)||searchMatch(m.category,qd)||searchMatch(m.refNo,qd)||searchMatch(m.party,qd)||searchMatch(m.note,qd))out.push({kind:'move',icon:'history',title:`حرکت: ${fullProductNameFrom(m.category,m.productName)}`,sub:`${formatDate(m.date)} — ${stockMoveTypeLabel(m.type)} — ${m.refNo||''}`,amount:(m.qtyIn?`+${qty(m.qtyIn)}`:m.qtyOut?`-${qty(m.qtyOut)}`:'-'),action:`state.view='products';openProductProfile('${m.productId}')`,button:'حرکت جنس'})});return out.slice(0,80)}
function renderSearchResults(q){const results=buildSearchResults(q);return q?`<div class="search-section-title"><h3>نتایج جستجو</h3><span class="muted small">${fmt(results.length)} مورد</span></div>${results.length?`<div class="search-result-grid">${results.map(r=>`<div class="search-result-card"><div class="search-result-icon">${iconSvg(r.icon)}</div><div class="search-result-main"><b>${e(r.title)}</b><span>${e(r.sub||'')}</span></div><div class="search-result-amount">${e(r.amount||'')}</div><div class="search-result-actions"><button class="btn smallbtn secondary" onclick="${r.action}">${e(r.button||'باز کردن')}</button></div></div>`).join('')}</div>`:'<div class="empty">چیزی یافت نشد.</div>'}`:`<div class="search-tips"><b>نمونه جستجو:</b><br>نام مشتری، شماره تماس، شماره فاکتور مثل 00012، نام جنس مثل گچ سفید، تاریخ، مبلغ یا نام فراهم کننده را بنویسید.</div>`}
function updateSearchResults(){const inp=document.getElementById('globalSearchInput');state.globalSearch=inp?inp.value:state.globalSearch;const box=document.getElementById('searchResultsWrap');if(box){box.innerHTML=renderSearchResults(state.globalSearch||'');enhanceMobileTables()}const count=document.getElementById('searchResultCount');if(count)count.textContent=fmt(buildSearchResults(state.globalSearch||'').length)+' نتیجه'}
function renderSearch(){const q=state.globalSearch||'';const results=buildSearchResults(q);return `<div class="search-page"><div class="search-hero"><div class="search-hero-main"><div class="search-hero-icon">${iconSvg('search')}</div><div><h3>جستجوی همه پایگاه داده</h3><p>مشتری، فاکتور، جنس، ورود کالا، مصرف و حرکت انبار را یکجا پیدا کنید.</p></div></div><span class="badge info" id="searchResultCount">${fmt(results.length)} نتیجه</span></div><div class="search-box-main"><div class="global-search-input">${iconSvg('search')}<input id="globalSearchInput" placeholder="نام مشتری، شماره، شماره فاکتور، جنس، تاریخ، مبلغ..." value="${e(q)}" oninput="updateSearchResults()" onkeydown="if(event.key==='Enter')updateSearchResults()"></div></div><div id="searchResultsWrap">${renderSearchResults(q)}</div></div>`}

function duplicateCount(arr,keyFn){const seen=new Set(),dups=new Set();arr.forEach(x=>{const k=keyFn(x);if(!k)return;if(seen.has(k))dups.add(k);seen.add(k)});return dups.size}
function expectedStockByDocs(){const map={};(db.products||[]).forEach(p=>map[p.id]=0);(db.purchases||[]).forEach(p=>(p.items||[]).forEach(i=>{if(i.productId)map[i.productId]=(map[i.productId]||0)+toNum(i.qty)}));(db.sales||[]).forEach(s=>(s.items||[]).forEach((i,idx)=>{if(!i.productId)return;const returned=saleLineReturnedQty?saleLineReturnedQty(s,idx):toNum(i.returnedQty||0);const sold=i.originalQty!==undefined?toNum(i.originalQty):toNum(i.qty)+returned;map[i.productId]=(map[i.productId]||0)-Math.max(0,round2(sold-returned))}));(db.adjustments||[]).forEach(a=>{map[a.productId]=(map[a.productId]||0)+toNum(a.qtySigned)});return map}
function dbHealthReport(){
  const issues=[];
  const prodIds=new Set((db.products||[]).map(p=>p.id));
  const custIds=new Set((db.customers||[]).map(c=>c.id));
  const supplierIds=new Set((db.customers||[]).filter(isSupplierAccount).map(c=>c.id));
  const moneyClose=(a,b)=>Math.abs(round2(toNum(a)-toNum(b)))<0.01;
  const missingSaleProducts=(db.sales||[]).reduce((n,s)=>n+(s.items||[]).filter(i=>i.productId&&!prodIds.has(i.productId)).length,0);
  if(missingSaleProducts)issues.push({type:'bad',title:'فروش با جنس حذف‌شده',desc:'بعضی اقلام فروش به جنس موجود وصل نیست.',count:missingSaleProducts});
  const missingPurchaseProducts=(db.purchases||[]).reduce((n,p)=>n+(p.items||[]).filter(i=>i.productId&&!prodIds.has(i.productId)).length,0);
  if(missingPurchaseProducts)issues.push({type:'bad',title:'ورود کالا با جنس حذف‌شده',desc:'بعضی اقلام ورود کالا به جنس موجود وصل نیست.',count:missingPurchaseProducts});
  const missingCustomers=(db.sales||[]).filter(s=>s.customerId&&!custIds.has(s.customerId)).length+(db.payments||[]).filter(p=>p.customerId&&!custIds.has(p.customerId)).length;
  if(missingCustomers)issues.push({type:'warn',title:'معامله با مشتری حذف‌شده',desc:'بعضی فاکتورها یا پرداخت‌ها مشتری ندارند.',count:missingCustomers});
  const missingSuppliers=(db.purchases||[]).filter(p=>p.supplierId&&!custIds.has(p.supplierId)).length+(db.supplierPayments||[]).filter(p=>p.supplierId&&!custIds.has(p.supplierId)).length;
  if(missingSuppliers)issues.push({type:'warn',title:'معامله با فراهم کننده حذف‌شده',desc:'بعضی خریدها یا پرداخت‌های فراهم کننده حساب مرتبط ندارند.',count:missingSuppliers});
  const dupInv=duplicateCount(db.sales||[],s=>s.invoiceNo);if(dupInv)issues.push({type:'warn',title:'شماره فاکتور تکراری',desc:'شماره فاکتورهای تکراری پیدا شد.',count:dupInv});
  const dupRec=duplicateCount(db.purchases||[],p=>p.receiptNo);if(dupRec)issues.push({type:'warn',title:'شماره رسید تکراری',desc:'شماره رسیدهای ورود کالا تکراری است.',count:dupRec});
  const badSaleTotals=(db.sales||[]).filter(s=>{const itemSum=round2((s.items||[]).reduce((a,i)=>a+toNum(i.total),0));return !moneyClose(itemSum,toNum(s.subtotal||itemSum))||!moneyClose(round2(toNum(s.subtotal||itemSum)-toNum(s.discount||0)),toNum(s.total||0))}).length;
  if(badSaleTotals)issues.push({type:'bad',title:'اختلاف جمع فاکتور فروش',desc:'جمع اقلام، تخفیف یا مجموع بعضی فاکتورها هماهنگ نیست.',count:badSaleTotals});
  const badPurchaseTotals=(db.purchases||[]).filter(p=>{const itemSum=round2((p.items||[]).reduce((a,i)=>a+toNum(i.total),0));return !moneyClose(itemSum,toNum(p.total||0))}).length;
  if(badPurchaseTotals)issues.push({type:'bad',title:'اختلاف جمع رسید ورود کالا',desc:'جمع اقلام بعضی رسیدهای ورود کالا با مجموع رسید برابر نیست.',count:badPurchaseTotals});
  const overReturned=(db.sales||[]).reduce((n,s)=>n+(s.items||[]).filter((i,idx)=>saleLineReturnedQty(s,idx)>saleLineOriginalQty(s,idx)+0.0001||saleLineReturnedAmount(s,idx)>saleLineOriginalAmount(s,idx)+0.01).length,0);
  if(overReturned)issues.push({type:'bad',title:'برگشت بیشتر از فروش',desc:'در بعضی اقلام مقدار یا مبلغ برگشتی از فروش اصلی بیشتر شده است.',count:overReturned});
  const negStock=(db.products||[]).filter(p=>toNum(p.stock)<0).length;if(negStock)issues.push({type:'bad',title:'موجودی منفی',desc:'بعضی کالاها موجودی منفی دارند.',count:negStock});
  const expected=expectedStockByDocs();const stockMismatch=(db.products||[]).filter(p=>Math.abs(round2(toNum(p.stock)-toNum(expected[p.id]||0)))>0.0001).length;
  if(stockMismatch)issues.push({type:'warn',title:'اختلاف موجودی با اسناد',desc:'موجودی بعضی کالاها با فروش/ورود/اصلاحات برابر نیست.',count:stockMismatch});
  const badAmounts=[...(db.sales||[]).filter(s=>toNum(s.total)<0||toNum(s.paid)<0),...(db.purchases||[]).filter(p=>toNum(p.total)<0||toNum(p.paid)<0),...(db.payments||[]).filter(p=>toNum(p.amount)<=0),...(db.expenses||[]).filter(x=>toNum(x.amount)<=0)].length;
  if(badAmounts)issues.push({type:'bad',title:'مبلغ نامعتبر',desc:'مبلغ صفر، منفی یا نامعتبر در معاملات پیدا شد.',count:badAmounts});
  if(!(db.stockMoves||[]).length&&((db.sales||[]).length||(db.purchases||[]).length||(db.adjustments||[]).length))issues.push({type:'warn',title:'حرکت انبار ساخته نشده',desc:'تاریخچه حرکت انبار خالی است.',count:1});
  return issues
}
function dbHealthHtml(){const issues=dbHealthReport();const status=issues.some(x=>x.type==='bad')?'bad':issues.length?'warn':'good';const text=status==='good'?'سالم':status==='warn'?'نیاز به بررسی':'مشکل جدی';return `<div class="db-health"><div class="db-health-head"><h3>سلامت پایگاه داده</h3><span class="db-health-status ${status}">${text}</span></div><p class="muted small">این بخش شماره‌ها، جمع فاکتور، موجودی، برگشت کالا، پرداخت‌ها و ارتباط اسناد با مشتری/جنس را بررسی می‌کند.</p>${issues.length?`<div class="db-issue-list">${issues.map(x=>`<div class="db-issue"><div><b>${e(x.title)}</b><br><span>${e(x.desc)}</span></div><div class="count">${fmt(x.count)}</div></div>`).join('')}</div>`:'<div class="empty">مشکل مهمی یافت نشد.</div>'}<div class="db-health-actions"><button class="btn secondary" onclick="showSelfCheckReport()">تست مالی سریع</button><button class="btn secondary" onclick="repairLightDatabase()">ترمیم سبک</button><button class="btn warn" onclick="rebuildStockMovementOnly()">بازسازی حرکت انبار</button><button class="btn bad" onclick="syncStockFromDocuments()">همسان‌سازی موجودی</button></div></div>`}
function repairLightDatabase(){renumberSales();renumberPurchases();db.products.forEach(p=>{if(!p.category)p.category=p.name||'عمومی';if(p.active===undefined)p.active=true});db.customers.forEach(c=>{if(!c.type)c.type='customer';if(c.active===undefined)c.active=true});addAuditLog('update','system',{title:'ترمیم سبک پایگاه داده',note:'تنظیم شماره‌ها و ساختار پایه'});saveDB(false);toast('ترمیم سبک انجام شد.','good');render()}
function rebuildStockMovementOnly(){if(!confirm('حرکت انبار از روی اسناد فعلی بازسازی شود؟'))return;db.stockMoves=rebuildStockMoves(db);db.meta.stockMovesBuilt=true;addAuditLog('update','system',{title:'بازسازی حرکت انبار',note:'حرکت‌ها از روی فروش، ورود کالا و اصلاحات ساخته شد'});saveDB(false);toast('حرکت انبار بازسازی شد.','good');render()}
function syncStockFromDocuments(){if(!requireDeletePin('همسان‌سازی موجودی انبار'))return;createInternalBackup('beforeSyncStock');if(!confirm('موجودی کالاها از روی اسناد فروش/ورود/اصلاحات دوباره محاسبه شود؟'))return;if(!confirm('این کار موجودی فعلی انبار را تغییر می‌دهد. مطمئن هستید؟'))return;const before=auditClone(db.products);const expected=expectedStockByDocs();db.products.forEach(p=>p.stock=round2(expected[p.id]||0));db.stockMoves=rebuildStockMoves(db);db.meta.stockMovesBuilt=true;addAuditLog('update','system',{title:'همسان‌سازی موجودی',before,after:db.products,note:'موجودی از روی اسناد محاسبه شد'});saveDB(false);toast('موجودی با اسناد همسان‌سازی شد.','warn');render()}
function pushTrash(kind,record){db.trash=db.trash||{};db.trash[kind]=db.trash[kind]||[];db.trash[kind].unshift({id:uid(),deletedAt:nowISOTime(),date:todayIso(),record:auditClone(record)});if(db.trash[kind].length>100)db.trash[kind]=db.trash[kind].slice(0,100)}
function renderTrashBin(){const sales=(db.trash?.sales||[]),purchases=(db.trash?.purchases||[]);if(!sales.length&&!purchases.length)return '<div class="empty">سطل حذف خالی است.</div>';return `<div class="table-wrap"><table><thead><tr><th>نوع</th><th>شرح</th><th>تاریخ حذف</th><th>عملیات</th></tr></thead><tbody>${sales.map(t=>{const r=t.record||{};return `<tr><td>فاکتور فروش</td><td><b>${e(r.invoiceNo||'')}</b> — ${e(r.customerName||'')}<br><span class="muted small">${money(r.total||0)}</span></td><td>${formatDate(t.date)}</td><td><button class="btn smallbtn good" onclick="restoreDeletedSale('${t.id}')">بازیابی</button></td></tr>`}).join('')}${purchases.map(t=>{const r=t.record||{};return `<tr><td>ورود کالا</td><td><b>${e(r.receiptNo||'')}</b> — ${e(r.supplier||'')}<br><span class="muted small">${money(r.total||0)}</span></td><td>${formatDate(t.date)}</td><td><button class="btn smallbtn good" onclick="restoreDeletedPurchase('${t.id}')">بازیابی</button></td></tr>`}).join('')}</tbody></table></div><div class="toolbar" style="margin-top:10px"><button class="btn bad" onclick="clearTrashBin()">پاک‌سازی سطل حذف</button></div>`}
function restoreDeletedSale(tid){const t=(db.trash?.sales||[]).find(x=>x.id===tid);if(!t)return;const sale=auditClone(t.record);if(!sale)return;for(const i of (sale.items||[]).filter(x=>x.productId)){const p=productById(i.productId);if(!p)return toast('برای بازیابی فاکتور، کالا یافت نشد.','bad');if(!db.settings.allowNegativeStock&&toNum(p.stock)<toNum(i.qty))return toast('برای بازیابی فاکتور، موجودی '+(p?p.name:'جنس')+' کافی نیست.','bad')}if(!confirm('این فاکتور بازیابی شود؟ موجودی کالاها دوباره از انبار کم می‌شود.'))return;(sale.items||[]).filter(x=>x.productId).forEach(i=>{const p=productById(i.productId);if(p){p.stock=round2(toNum(p.stock)-toNum(i.qty));addStockMove({...productSnapshot(i.productId,i),date:todayIso(),type:'sale_out',qtyOut:i.qty,refType:'sale',refId:sale.id,refNo:sale.invoiceNo||'',party:sale.customerName||'',note:'بازیابی فاکتور حذف‌شده',balanceAfter:p.stock})}});if(db.sales.some(s=>s.id===sale.id))sale.id=uid();db.sales.push(sale);if(sale.treasuryStatus==='entered'&&toNum(sale.paid)>0){const cm=addCashMove({date:todayIso(),direction:'in',amount:sale.paid,method:sale.paymentMethod,partyId:sale.customerId,partyName:sale.customerName,source:'sale_payment',reason:'بازیابی فاکتور '+(sale.invoiceNo||''),refType:'sale',refId:sale.id,refNo:sale.invoiceNo||''});if(cm)sale.cashMoveId=cm.id}db.trash.sales=db.trash.sales.filter(x=>x.id!==tid);addAuditLog('create','sale',{id:sale.id,title:'بازیابی فاکتور '+(sale.invoiceNo||''),after:sale,note:'بازیابی از سطل حذف'});saveDB(false);toast('فاکتور بازیابی شد.','good');render()}
function restoreDeletedPurchase(tid){const t=(db.trash?.purchases||[]).find(x=>x.id===tid);if(!t)return;const pur=auditClone(t.record);if(!pur)return;if(!confirm('این رسید ورود کالا بازیابی شود؟ موجودی کالاها دوباره به انبار اضافه می‌شود.'))return;(pur.items||[]).forEach(i=>{const p=productById(i.productId);if(p){p.stock=round2(toNum(p.stock)+toNum(i.qty));addStockMove({...productSnapshot(i.productId,i),date:todayIso(),type:'purchase_in',qtyIn:i.qty,refType:'purchase',refId:pur.id,refNo:pur.receiptNo||'',party:pur.supplier||'',note:'بازیابی ورود کالا حذف‌شده',balanceAfter:p.stock})}});if(db.purchases.some(p=>p.id===pur.id))pur.id=uid();db.purchases.push(pur);renumberPurchases();db.trash.purchases=db.trash.purchases.filter(x=>x.id!==tid);addAuditLog('create','purchase',{id:pur.id,title:'بازیابی رسید '+(pur.receiptNo||''),after:pur,note:'بازیابی از سطل حذف'});saveDB(false);toast('رسید ورود کالا بازیابی شد.','good');render()}
function clearTrashBin(){if(!requireDeletePin('پاک‌سازی سطل حذف'))return;createInternalBackup('beforeClearTrash');if(!confirm('سطل حذف کاملاً خالی شود؟ بعداً بازیابی ممکن نیست.'))return;db.trash={sales:[],purchases:[],customers:[]};addAuditLog('delete','system',{title:'پاک‌سازی سطل حذف',note:'تمام موارد حذف‌شده پاک شد'});saveDB(false);toast('سطل حذف خالی شد.','warn');render()}
function xmlEscape(v){return String(v??'').replace(/[<>&"']/g,ch=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[ch]))}
function excelCell(v){const isNum=typeof v==='number'&&isFinite(v);return `<Cell><Data ss:Type="${isNum?'Number':'String'}">${xmlEscape(isNum?round2(v):toEnglishDigitsText(v))}</Data></Cell>`}
function excelSheet(name,rows){return `<Worksheet ss:Name="${xmlEscape(String(name).slice(0,31))}"><Table>${rows.map(r=>`<Row>${r.map(excelCell).join('')}</Row>`).join('')}</Table></Worksheet>`}
function exportExcelXml(){const sheets=[];sheets.push(excelSheet('Customers', [['نام','تلفن','آدرس','حد اعتبار','باقی مشتری','فعال','یادداشت'],...(db.customers||[]).map(c=>[c.name,c.phone,c.address,toNum(c.creditLimit||0),customerBalance(c.id),c.active===false?'نه':'بله',c.note])]));sheets.push(excelSheet('Products', [['کالای اصلی','نوع','واحد','موجودی','حداقل هشدار','فعال'],...(db.products||[]).map(p=>[productCategory(p),p.name,p.unit,toNum(p.stock),toNum(p.minStock),p.active===false?'نه':'بله'])]));sheets.push(excelSheet('Sales', [['شماره فاکتور','تاریخ','مشتری','مجموع','پرداخت','باقی','روش','یادداشت'],...(db.sales||[]).map(s=>[s.invoiceNo,formatDate(s.date),s.customerName,toNum(s.total),toNum(s.paid),Math.max(0,toNum(s.total)-toNum(s.paid)),s.paymentMethod,s.note])]));sheets.push(excelSheet('Sale Items', [['شماره فاکتور','تاریخ','مشتری','جنس','مقدار','واحد','قیمت','جمع'],...(db.sales||[]).flatMap(s=>(s.items||[]).map(i=>[s.invoiceNo,formatDate(s.date),s.customerName,fullProductNameFrom(i.category,i.productName),toNum(i.qty),i.unit,toNum(i.price),toNum(i.total)]))]));sheets.push(excelSheet('Purchases', [['شماره رسید','تاریخ','فراهم کننده','خرید از فراهم کننده','هزینه اضافه','قیمت تمام‌شده کل','پرداخت فراهم کننده','باقی','روش','یادداشت'],...(db.purchases||[]).map(p=>[p.receiptNo,formatDate(p.date),p.supplier,purchaseSupplierTotal(p),toNum(p.extraCostTotal||0),toNum(p.total),purchaseSupplierPaid(p),purchaseSupplierDue(p),p.method,p.note])]));sheets.push(excelSheet('Purchase Items', [['شماره رسید','تاریخ','فراهم کننده','جنس','مقدار','واحد','قیمت خرید','جمع'],...(db.purchases||[]).flatMap(p=>(p.items||[]).map(i=>[p.receiptNo,formatDate(p.date),p.supplier,fullProductNameFrom(i.category,i.productName),toNum(i.qty),i.unit,toNum(i.cost),toNum(i.total)]))]));sheets.push(excelSheet('Customer Payments', [['تاریخ','مشتری','نوع','مبلغ','روش','یادداشت'],...(db.payments||[]).map(p=>{const c=customerById(p.customerId),out=isCustomerCashOut(p);return[formatDate(p.date),c?c.name:'',out?'بردگی':'آوردگی',out?customerPaymentOutAmount(p):customerPaymentInAmount(p),p.method,p.note]})]));sheets.push(excelSheet('Supplier Payments', [['تاریخ','فراهم کننده','مبلغ','روش','یادداشت'],...(db.supplierPayments||[]).map(p=>{const c=customerById(p.supplierId);return[formatDate(p.date),c?c.name:'',toNum(p.amount),p.method,p.note]})]));sheets.push(excelSheet('Expenses', [['تاریخ','دسته','شرح','مبلغ','روش','یادداشت'],...(db.expenses||[]).map(x=>[formatDate(x.date),x.category||'عمومی',x.description||x.note,toNum(x.amount),x.method,x.note])]));sheets.push(excelSheet('Sale Returns', [['شماره فاکتور','تاریخ','مشتری','جنس','مقدار','واحد','مبلغ','یادداشت'],...(db.sales||[]).flatMap(s=>(s.returns||[]).flatMap(r=>(r.items||[]).map(i=>[s.invoiceNo,formatDate(r.date),s.customerName,fullProductNameFrom(i.category,i.productName),toNum(i.qty),i.unit,toNum(i.amount),r.note])))]));sheets.push(excelSheet('Stock Moves', [['تاریخ','جنس','نوع حرکت','داخل','بیرون','قبل','بعد','واحد','مرجع','حساب','کاربر','یادداشت'],...(db.stockMoves||[]).map(m=>[formatDate(m.date),fullProductNameFrom(m.category,m.productName),stockMoveTypeLabel(m.type),toNum(m.qtyIn),toNum(m.qtyOut),m.balanceBefore??'',m.balanceAfter??'',m.unit,m.refNo,m.party,m.operator||'',m.note])]));sheets.push(excelSheet('Cash Moves', [['تاریخ','نوع','مبلغ','شخص/منبع','دلیل','مرجع','روش','یادداشت'],...(db.cashMoves||[]).map(m=>[formatDate(m.date),m.direction==='out'?'خروج':'ورود',toNum(m.amount),m.partyName||'',m.reason||'',treasuryRefText(m),m.method||'',m.note||''])]));sheets.push(excelSheet('Account Adjustments', [['تاریخ','حساب','نوع','مبلغ','دلیل','یادداشت'],...(db.accountAdjustments||[]).map(a=>{const c=customerById(a.customerId);return[formatDate(a.date),c?c.name:'',accountAdjustmentLabel(a.type),toNum(a.amount),a.reason||'',a.note||'']})]));sheets.push(excelSheet('Audit Logs', [['تاریخ','عمل','بخش','شرح','یادداشت'],...(db.auditLogs||[]).map(a=>[formatDate(a.date),auditActionLabel(a.action),auditEntityLabel(a.entity),a.title,a.note])]));const xml=`<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><DocumentProperties xmlns="urn:schemas-microsoft-com:office:office"><Title>Hamgam Full Export</Title><Created>${nowISOTime()}</Created></DocumentProperties><Styles><Style ss:ID="Default"><Alignment ss:Vertical="Center"/><Font ss:FontName="Tahoma" ss:Size="11"/></Style></Styles>${sheets.join('')}</Workbook>`;downloadFile('hamgam-full-export-'+todayIso()+'.xml',xml,'application/xml;charset=utf-8');toast('خروجی کامل Excel XML آماده شد.','good')}
function saveTelegramBackupSettings(){const token=(document.getElementById('tgBotToken')?.value||'').trim(),chat=(document.getElementById('tgChatId')?.value||'').trim();db.settings.telegramBotToken=token;db.settings.telegramChatId=chat;saveDB(false);toast(token&&chat?'تنظیمات بکاپ تلگرام ذخیره شد.':'تنظیمات تلگرام خالی ذخیره شد؛ بکاپ ابری غیرفعال است.','good');render()}
async function sendBackupToTelegram(){
  const token=String(db.settings.telegramBotToken||'').trim(),chat=String(db.settings.telegramChatId||'').trim();
  if(!token||!chat)return toast('برای بکاپ تلگرام، اول توکن ربات و chat id را در تنظیمات وارد و ذخیره کنید.','bad');
  if(typeof navigator!=='undefined'&&navigator.onLine===false)return toast('اینترنت وصل نیست؛ بکاپ محلی همچنان راه اصلی است.','bad');
  try{
    db.settings.lastBackupDate=todayIso();
    const pkg=makeBackupPackage(),json=JSON.stringify(pkg,null,2),name='hamgam-backup-'+todayIso()+'.json';
    const fd=new FormData();fd.append('chat_id',chat);fd.append('caption','بکاپ هم‌گام - '+formatDate(todayIso()));fd.append('document',new Blob([json],{type:'application/json'}),name);
    const res=await fetch('https://api.telegram.org/bot'+token+'/sendDocument',{method:'POST',body:fd});
    if(!res.ok){let msg='ارسال بکاپ به تلگرام ناکام شد.';try{const j=await res.json();if(j.description)msg+=' '+j.description}catch(e){}throw new Error(msg)}
    saveDB(false);toast('بکاپ به تلگرام ارسال شد. یک نسخه محلی هم همیشه نگه دارید.','good');render()
  }catch(err){console.error(err);toast((err&&err.message?err.message:'ارسال بکاپ به تلگرام ناکام شد.')+' بکاپ محلی را فراموش نکنید.','bad')}
}

(db.settings.theme||'light')==='light'?'selected':''}>روشن</option><option value="dark" ${(db.settings.theme||'light')==='dark'?'selected':''}>تیره</option></select></div><div class="field"><label>عرض فاکتور کوچک</label><select id="setReceiptWidth"><option value="80" ${(db.settings.receiptWidth||'80')==='80'?'selected':''}>80 میلی‌متر</option><option value="58" ${(db.settings.receiptWidth||'80')==='58'?'selected':''}>58 میلی‌متر</option></select></div><div class="field" style="grid-column:1/-1"><label>متن پایین فاکتور</label><input id="setFooter" value="${e(db.settings.receiptFooter||'')}"></div></div><details class="settings-fold compact"><summary>تنظیمات فاکتور، بدهی و پیام واتساپ</summary><div class="settings-fold-body"><div class="form-grid two"><div class="field"><label>شروع شماره فاکتور فروش</label><input id="setInvoiceStart" inputmode="numeric" value="${e(db.settings.invoiceStart||1)}"></div><div class="field"><label>شروع شماره رسید ورود کالا</label><input id="setReceiptStart" inputmode="numeric" value="${e(db.settings.receiptStart||1)}"></div><div class="field"><label>فروش با موجودی ناکافی</label><select id="setAllowNegativeStock"><option value="no" ${!db.settings.allowNegativeStock?'selected':''}>ممنوع</option><option value="yes" ${db.settings.allowNegativeStock?'selected':''}>با اجازه مدیر</option></select></div><div class="field"><label>خزانه منفی</label><select id="setAllowNegativeTreasury"><option value="no" ${!db.settings.allowNegativeTreasury?'selected':''}>ممنوع</option><option value="yes" ${db.settings.allowNegativeTreasury?'selected':''}>مجاز با هشدار</option></select></div><div class="field"><label>هشدار پس از چند روز بدهی</label><input id="setDebtWarnDays" inputmode="numeric" value="${e(db.settings.debtWarnDays||30)}"></div><div class="field"><label>حد مبلغ هشدار بدهی</label><input id="setDebtWarnAmount" inputmode="decimal" value="${e(db.settings.debtWarnAmount||10000)}"></div><div></div><div class="field" style="grid-column:1/-1"><label>متن پیام یادآوری واتساپ</label><textarea id="setDebtReminderTemplate" rows="7">${e(db.settings.debtReminderTemplate||defaultDebtReminderTemplate())}</textarea><div class="muted small">متغیرها: {shop} نام فروشگاه، {customer} نام مشتری، {amount} مبلغ باقی</div></div></div></div></details><div class="toolbar" style="margin-top:12px"><button class="btn good" type="submit">ذخیره تنظیمات</button></div></form></section><details class="settings-fold"><summary>بکاپ ابری تلگرام (اختیاری)</summary><div class="settings-fold-body"><div class="advanced-note">این گزینه اختیاری است و فقط وقتی دکمه ارسال را بزنید از اینترنت استفاده می‌کند. بکاپ محلی دانلودی همچنان راه اصلی و قابل‌اعتماد است.</div><div class="form-grid two" style="margin-top:12px"><div class="field"><label>توکن ربات تلگرام</label><input id="tgBotToken" value="${e(db.settings.telegramBotToken||'')}" placeholder="مثلاً 123456:ABC..."></div><div class="field"><label>Chat ID</label><input id="tgChatId" value="${e(db.settings.telegramChatId||'')}" placeholder="مثلاً 123456789"></div></div><div class="toolbar" style="margin-top:12px"><button class="btn secondary" onclick="saveTelegramBackupSettings()">ذخیره تنظیمات تلگرام</button><button class="btn good" onclick="sendBackupToTelegram()">ارسال بکاپ به تلگرام</button></div></div></details><details class="settings-fold"><summary>بکاپ خودکار داخلی</summary><div class="settings-fold-body"><div class="advanced-note">برنامه روزانه یک بکاپ داخلی می‌سازد و پیش از عملیات حساس نیز بکاپ می‌گیرد. این بکاپ‌ها داخل همین مرورگر نگهداری می‌شوند.</div><div class="form-grid" style="margin-top:12px"><div class="field"><label>تعداد بکاپ‌های اخیر برای نگهداری</label><input id="setInternalBackupLimit" inputmode="numeric" value="${e(db.settings.internalBackupLimit||7)}"></div><div class="field"><label>&nbsp;</label><button class="btn secondary" onclick="createInternalBackup('manual')">ساخت بکاپ داخلی اکنون</button></div></div><div style="margin-top:12px">${renderInternalBackups()}</div><div class="toolbar" style="margin-top:12px"><button class="btn bad" onclick="clearInternalBackups()">پاک‌سازی بکاپ‌های داخلی</button></div></div></details><details class="settings-fold"><summary>رمز ورود برنامه</summary><div class="settings-fold-body"><div class="advanced-note">برای ساخت یا تغییر رمز این تلفن، اول رمز اولیه را وارد کنید و بعد رمز جدید بسازید.</div><div class="form-grid three" style="margin-top:12px"><div class="field"><label>رمز اولیه</label><input id="setAppPinCurrent" type="password" inputmode="numeric" maxlength="8"></div><div class="field"><label>رمز جدید 4 تا 8 رقم</label><input id="setAppPinNew" type="password" inputmode="numeric" maxlength="8"></div><div class="field"><label>تکرار رمز جدید</label><input id="setAppPinConfirm" type="password" inputmode="numeric" maxlength="8"></div></div><div class="toolbar" style="margin-top:12px"><button class="btn good" onclick="saveAppPasswordSettings()">تغییر رمز ورود</button><button class="btn ghost" onclick="lockApp()">قفل کردن برنامه</button></div></div></details><details class="settings-fold"><summary>رمز حذف و ریست</summary><div class="settings-fold-body"><div class="advanced-note">برای حذف فاکتور، حذف رسید، حذف حساب، حذف اصلاحات، پاک‌سازی سطل حذف و ریست کامل برنامه این رمز خواسته می‌شود. حالت فعلی: <b>${db.settings.deletePinHash?'فعال':'غیرفعال'}</b></div><div class="form-grid three" style="margin-top:12px"><div class="field"><label>رمز فعلی ${db.settings.deletePinHash?'':'(لازم نیست)'}</label><input id="setDeletePinCurrent" type="password" inputmode="numeric" maxlength="6"></div><div class="field"><label>رمز جدید 4 تا 6 رقم</label><input id="setDeletePinNew" type="password" inputmode="numeric" maxlength="6"></div><div class="field"><label>تکرار رمز جدید</label><input id="setDeletePinConfirm" type="password" inputmode="numeric" maxlength="6"></div></div><div class="toolbar" style="margin-top:12px"><button class="btn good" onclick="saveDeletePinSettings()">ذخیره رمز</button><button class="btn ghost" onclick="disableDeletePin()">غیرفعال کردن رمز</button></div></div></details><details class="settings-fold"><summary>سلامت و ترمیم پایگاه داده</summary><div class="settings-fold-body">${dbHealthHtml()}</div></details><details class="settings-fold"><summary>سطل حذف و بازیابی</summary><div class="settings-fold-body"><div class="advanced-note">فاکتورها و رسیدهای حذف‌شده تا 100 مورد آخر اینجا نگهداری می‌شوند و قابل بازیابی هستند.</div>${renderTrashBin()}</div></details><details class="settings-fold danger-zone"><summary>ریست برنامه</summary><div class="settings-fold-body"><div class="advanced-note">اگر می‌خواهید برنامه از صفر شروع شود، این دکمه همه اطلاعات را پاک می‌کند و پایگاه داده نو می‌سازد. پیش از ریست حتماً بکاپ بگیرید.</div><div class="toolbar" style="margin-top:12px"><button class="btn bad" onclick="resetDatabase()">ریست کامل و حذف همه اطلاعات</button></div></div></details><details class="settings-fold"><summary>راهنمای کوتاه استفاده</summary><div class="settings-fold-body"><div class="guide-list"><div class="guide-item">در «انبار و کالاها» کالای اصلی و نوع کالا را ثبت کنید.</div><div class="guide-item">هر وقت کالا وارد شد، از بخش «ورود کالا» ثبت کنید تا به انبار همان نوع اضافه شود.</div><div class="guide-item">برای فروش، وارد حساب مشتری شوید و از تب «بردگی» کالا را ثبت کنید.</div><div class="guide-item">برای دریافت وجه مشتری، داخل پروفایل مشتری از تب «آوردگی» استفاده کنید.</div><div class="guide-item">هر روز یا هر هفته از همین بخش بکاپ بگیرید.</div></div></div></details></div>`
}
function saveSettings(ev){ev.preventDefault();Object.assign(db.settings,{shopName:document.getElementById('setShop').value.trim(),ownerName:document.getElementById('setOwner').value.trim(),phone:document.getElementById('setPhone').value.trim(),address:document.getElementById('setAddress').value.trim(),receiptFooter:document.getElementById('setFooter').value.trim(),receiptWidth:document.getElementById('setReceiptWidth')?document.getElementById('setReceiptWidth').value:(db.settings.receiptWidth||'80'),theme:document.getElementById('setTheme')?document.getElementById('setTheme').value:(db.settings.theme||'light'),allowNegativeStock:(document.getElementById('setAllowNegativeStock')?.value==='yes'),allowNegativeTreasury:(document.getElementById('setAllowNegativeTreasury')?.value==='yes'),invoiceStart:Math.max(1,Math.floor(toNum(document.getElementById('setInvoiceStart')?.value||db.settings.invoiceStart||1))),receiptStart:Math.max(1,Math.floor(toNum(document.getElementById('setReceiptStart')?.value||db.settings.receiptStart||1))),debtWarnDays:Math.max(1,Math.floor(toNum(document.getElementById('setDebtWarnDays')?.value||db.settings.debtWarnDays||30))),debtWarnAmount:Math.max(0,toNum(document.getElementById('setDebtWarnAmount')?.value||db.settings.debtWarnAmount||10000)),debtReminderTemplate:(document.getElementById('setDebtReminderTemplate')?.value||defaultDebtReminderTemplate()),internalBackupLimit:Math.max(1,Math.floor(toNum(document.getElementById('setInternalBackupLimit')?.value||db.settings.internalBackupLimit||7)))});renumberSales();renumberPurchases();saveDB(false);toast('تنظیمات ذخیره شد و شماره‌ها تنظیم شد.');render()}

ceipt.w58{max-width:58mm}.thermal-receipt.w80{max-width:80mm}.thermal-receipt h2{font-size:15px;text-align:center;margin:0 0 4px}.thermal-receipt .center{text-align:center}.thermal-receipt .small{font-size:10.5px}.thermal-receipt table{border:0;border-radius:0;font-size:11px}.thermal-receipt th,.thermal-receipt td{border:0;border-bottom:1px dashed #aaa;padding:4px 2px}.thermal-receipt .tot{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:2px 0}.thermal-receipt .tot.grand{font-weight:900;border-top:1px solid #111;margin-top:4px;padding-top:5px}

  </style>`;
  try{const w=window.open('','_blank');if(w&&w.document){w.document.open();w.document.write(`<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>چاپ</title>${style}</head><body>${html}<script>setTimeout(()=>{window.print()},250)<\/script></body></html>`);w.document.close();return}}catch(err){}
  const p=document.getElementById('printArea');p.className='print-area '+(mode==='thermal'?'thermal':'');p.innerHTML=html;setTimeout(()=>{try{window.print()}catch(e){alert('چاپ در این مرورگر پشتیبانی نشد. از منوی مرورگر گزینه Print را بزنید.')}setTimeout(()=>{p.className='print-area'},500)},120)
