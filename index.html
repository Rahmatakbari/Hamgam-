<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>سیستم آفلاین فروشگاه هم‌گام</title>
    <style>
    /* =========================================================
       Hamgam Clean Design System
       Order: tokens, reset, typography, layout, navigation,
       components, forms, tables, pages, responsive, print.
       UI only: JavaScript, data, ids and events are unchanged.
       ========================================================= */

    /* 1) Design tokens */
    :root{
      color-scheme:light;
      --color-primary:#0F4C5C;
      --color-primary-hover:#0B3D4A;
      --color-primary-soft:#E7F3F5;
      --color-accent:#B4532A;
      --color-accent-soft:#FFF1E8;
      --color-secondary:#2D7C87;
      --color-background:#F2F1EC;
      --color-surface:#FFFFFF;
      --color-surface-soft:#F8F7F2;
      --color-surface-muted:#ECEBE4;
      --color-text:#1F2933;
      --color-text-secondary:#6B7280;
      --color-text-muted:#9CA3AF;
      --color-border:#E1DDD2;
      --color-border-strong:#C9C2B5;
      --color-success:#16803c;
      --color-success-soft:#ecfdf3;
      --color-warning:#b7791f;
      --color-warning-soft:#fffaeb;
      --color-danger:#b42318;
      --color-danger-soft:#fff1f3;
      --color-info:#175cd3;
      --color-info-soft:#eff8ff;
      --radius-xs:8px;
      --radius-sm:12px;
      --radius-md:16px;
      --radius-lg:20px;
      --radius-xl:24px;
      --shadow-xs:0 1px 2px rgba(16,24,40,.04);
      --shadow-sm:0 4px 12px rgba(16,24,40,.05);
      --shadow-md:0 10px 26px rgba(16,24,40,.07);
      --focus-ring:0 0 0 3px rgba(22,78,99,.16);
      --font-sans:"Noto Sans Arabic","Noto Naskh Arabic","Vazirmatn","Segoe UI",Tahoma,Arial,sans-serif;
      --tap:44px;
      --bottom-nav-h:72px;
      --bg:var(--color-background);
      --panel:var(--color-surface);
      --text:var(--color-text);
      --muted:var(--color-text-secondary);
      --line:var(--color-border);
      --primary:var(--color-primary);
      --good:var(--color-success);
      --warn:#d97706;
      --bad:var(--color-danger);
      --radius:var(--radius-md);
      --shadow:var(--shadow-sm);
    }
    html[data-theme="dark"]{
      color-scheme:dark;
      --color-primary:#7DD3E1;
      --color-primary-hover:#A5E7EF;
      --color-primary-soft:rgba(125,211,225,.13);
      --color-accent:#E08A56;
      --color-accent-soft:rgba(224,138,86,.14);
      --color-secondary:#7DD3E1;
      --color-background:#0B1117;
      --color-surface:#121B22;
      --color-surface-soft:#0F171D;
      --color-surface-muted:#1A252D;
      --color-text:#f8fafc;
      --color-text-secondary:#a3adbd;
      --color-text-muted:#7d8a9f;
      --color-border:#2B373E;
      --color-border-strong:#3D4B53;
      --color-success:#34d399;
      --color-success-soft:rgba(52,211,153,.12);
      --color-warning:#fbbf24;
      --color-warning-soft:rgba(251,191,36,.12);
      --color-danger:#fb7185;
      --color-danger-soft:rgba(251,113,133,.12);
      --color-info:#60a5fa;
      --color-info-soft:rgba(96,165,250,.12);
      --shadow-xs:0 1px 2px rgba(0,0,0,.20);
      --shadow-sm:0 8px 18px rgba(0,0,0,.22);
      --shadow-md:0 12px 30px rgba(0,0,0,.26);
    }

    /* 2) Reset */
    *{box-sizing:border-box}
    html{min-height:100%;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
    body{margin:0;min-height:100dvh;background:var(--color-background);color:var(--color-text);font-family:var(--font-sans);line-height:1.6;direction:rtl;overflow-x:hidden}
    button,input,select,textarea{font:inherit;direction:rtl}
    button{cursor:pointer;touch-action:manipulation}
    button:disabled,input:disabled,select:disabled,textarea:disabled{opacity:.55;cursor:not-allowed}
    a{color:inherit}
    ::selection{background:rgba(22,78,99,.16)}


    /* Universal multilingual font stack: Persian, Arabic, English */
    body,input,select,textarea,button,table{font-family:var(--font-sans);font-feature-settings:"kern" 1;font-kerning:normal}

    /* 3) Typography */
    h1,h2,h3,h4,p{margin-top:0}
    .muted{color:var(--color-text-secondary)}
    .small{font-size:12px}
    .ltr{direction:ltr;display:inline-block}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .ui-icon{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.18em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .icon .ui-icon,.nav-svg{width:22px;height:22px}

    /* 4) Layout */
    .app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh;background:transparent}
    .main{min-width:0;width:100%;max-width:1320px;margin:0 auto;padding:20px}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:12px 14px;box-shadow:var(--shadow-xs)}
    .topbar h2{margin:0;font-size:21px;font-weight:850;letter-spacing:-.02em;color:var(--color-text)}
    .topbar .meta{color:var(--color-text-secondary);font-size:12px}
    #view.view-enter{animation:pageIn .14s ease-out}
    @keyframes pageIn{from{opacity:.65;transform:translateY(4px)}to{opacity:1;transform:none}}

    /* 5) Navigation */
    .sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:#0f172a;color:#fff;padding:16px;box-shadow:none}
    .brand{display:flex;align-items:center;gap:10px;padding-bottom:14px;margin-bottom:12px;border-bottom:1px solid rgba(255,255,255,.10)}
    .brand .logo{width:44px;height:44px;border-radius:14px;background:var(--color-primary);display:grid;place-items:center;color:#fff;font-weight:900;flex:0 0 44px}
    .brand h1{margin:0;font-size:16px;font-weight:850;color:#fff;line-height:1.35}
    .brand p{margin:2px 0 0;color:#cbd5e1;font-size:11px}
    .side-note{margin-top:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);color:#cbd5e1;border-radius:var(--radius-md);padding:12px;font-size:12px;line-height:1.75}
    .nav{display:grid;gap:6px}
    .nav button{width:100%;min-height:46px;display:flex;align-items:center;gap:10px;text-align:right;background:transparent;border:1px solid transparent;color:#cbd5e1;border-radius:var(--radius-sm);padding:10px 11px;font-size:13px;font-weight:750;transition:background .15s ease,color .15s ease,transform .1s ease}
    .nav button:hover{background:rgba(255,255,255,.08);color:#fff}
    .nav button.active{background:var(--color-primary);color:#fff}
    .nav button:active{transform:scale(.98)}

    /* 6) Components */
    .panel,.card,.smart-panel,.purchase-card,.purchase-recent details,.inv-action-card,.inv-search-panel,.inv-recent details,.settings-card,.settings-fold,.db-health,.rc-panel,.rc-section,.report-fold,.account-edit-card,.account-menu-box,.profile-simple-card,.customer-payment-box,.account-sale-box,.profile-simple-head,.product-profile-panel,.product-profile-head,.search-box-main,.search-result-card,.inventory-card,.acc-lite-card,.acc-lite-summary,.acc-lite-controls,.simple-invoice,.invoice-card,.journal-card,.payment-row,.product-mini-row,.report-mini-row,.home-mini-panel{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs);color:var(--color-text)}
    .panel,.card,.settings-card,.account-edit-card,.product-profile-panel,.profile-simple-card,.customer-payment-box,.account-sale-box,.rc-panel{padding:14px}
    .panel h3,.settings-card h3,.rc-panel h3,.product-profile-panel h3,.profile-simple-card h3{font-size:16px;font-weight:850;color:var(--color-text);margin:0 0 10px}
    .panel-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
    .panel-title h3{margin:0}
    .empty{background:var(--color-surface-soft);border:1px dashed var(--color-border-strong);border-radius:var(--radius-md);padding:16px;text-align:center;color:var(--color-text-secondary);font-size:13px}
    .advanced-note,.backup-external-guide{background:var(--color-surface-soft);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:11px 12px;color:var(--color-text-secondary);font-size:12.5px;line-height:1.75}
    .backup-external-guide b{color:var(--color-text)}
    .backup-external-guide ul{margin:6px 0 0;padding-right:18px}
    .backup-external-guide .warn{color:var(--color-danger);font-weight:800}
    .badge{display:inline-flex;align-items:center;justify-content:center;gap:5px;border-radius:999px;padding:4px 9px;font-size:11.5px;font-weight:800}
    .badge.good{background:var(--color-success-soft);color:var(--color-success)}
    .badge.bad{background:var(--color-danger-soft);color:var(--color-danger)}
    .badge.warn{background:var(--color-warning-soft);color:var(--color-warning)}
    .badge.info{background:var(--color-info-soft);color:var(--color-info)}
    .badge.gray{background:var(--color-surface-muted);color:var(--color-text-secondary)}
    .toast{position:fixed;left:16px;bottom:16px;z-index:200;display:none;max-width:min(360px,calc(100vw - 32px));background:#111827;color:#fff;border-radius:var(--radius-md);padding:11px 13px;box-shadow:var(--shadow-md);font-size:13px}
    .toast.show{display:block;animation:pageIn .14s ease-out}
    .toast.good{background:#166534}.toast.bad{background:#991b1b}.toast.warn{background:#92400e}

    /* 7) Buttons */
    .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .btn{min-height:40px;border:0;border-radius:var(--radius-sm);padding:9px 13px;background:var(--color-primary);color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;transition:transform .1s ease,filter .15s ease,background .15s ease}
    .btn:hover{filter:brightness(.97)}
    .btn:active{transform:scale(.98)}
    .btn.secondary{background:var(--color-primary-soft);color:var(--color-primary)}
    .btn.ghost{background:var(--color-surface-soft);color:var(--color-text);border:1px solid var(--color-border)}
    .btn.good{background:var(--color-success);color:#fff}
    .btn.warn{background:#d97706;color:#fff}
    .btn.bad{background:var(--color-danger);color:#fff}
    .btn.dark{background:#111827;color:#fff}
    .btn.smallbtn{min-height:34px;border-radius:var(--radius-xs);padding:6px 9px;font-size:12px}

    /* 8) Forms */
    .form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .form-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
    .form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
    .field{display:grid;gap:6px}
    .field label{font-size:12px;font-weight:750;color:var(--color-text-secondary)}
    .field input,.field select,.field textarea,.acc-lite-select,.account-sort-select,.global-search-input input,.inv-search-box input{width:100%;min-height:44px;border:1px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-surface);color:var(--color-text);padding:9px 11px;outline:0;box-shadow:none}
    .field textarea{min-height:72px;resize:vertical}
    .field input:focus,.field select:focus,.field textarea:focus,.acc-lite-select:focus,.global-search-input input:focus,.inv-search-box input:focus{border-color:var(--color-primary);box-shadow:var(--focus-ring)}
    ::placeholder{color:var(--color-text-muted)}

    /* 9) Tables */
    .table-wrap{overflow:auto;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface)}
    table{width:100%;min-width:760px;border-collapse:collapse;background:transparent}
    th,td{padding:10px;border-bottom:1px solid var(--color-border);text-align:right;vertical-align:top;color:var(--color-text)}
    th{background:var(--color-surface-soft);color:var(--color-text-secondary);font-size:12px;font-weight:800;position:sticky;top:0;z-index:1}
    tr:last-child td{border-bottom:0}

    /* 10) Dashboard */
    .home-screen{display:grid;gap:14px}
    .home-modern-header{background:linear-gradient(135deg,#0f172a,#164e63);color:#fff;border-radius:var(--radius-xl);padding:16px;border:1px solid rgba(255,255,255,.10);box-shadow:var(--shadow-sm)}
    .home-modern-brand h2{margin:0;color:#fff;font-size:20px;font-weight:850;line-height:1.35}
    .home-modern-brand p{margin:3px 0 0;color:#dbeafe;font-size:12px}
    .home-modern-title{margin-top:12px;background:rgba(255,255,255,.10);border-radius:var(--radius-md);padding:9px 11px}
    .home-modern-title h3{margin:0;color:#fff;font-size:16px;font-weight:850}
    .home-modern-title small{color:#dbeafe;font-size:11px}
    .sales-glass-card{padding:15px;border-radius:var(--radius-lg);background:var(--color-surface);border:1px solid var(--color-border);box-shadow:var(--shadow-xs)}
    .sales-glass-card .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .sales-glass-card .label{font-size:15px;font-weight:850;color:var(--color-text)}
    .sales-glass-card .sub,.sales-glass-card .mini{font-size:11.5px;color:var(--color-text-secondary)}
    .sales-glass-card .amount{font-size:24px;font-weight:900;color:var(--color-text);margin-top:8px;line-height:1.25}
    .soft-icon-btn{width:38px;height:38px;border-radius:var(--radius-sm);display:grid;place-items:center;background:var(--color-primary-soft);color:var(--color-primary)}
    .home-today{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
    .home-stat{padding:10px;border-radius:var(--radius-md);background:var(--color-surface);border:1px solid var(--color-border)}
    .home-stat span{display:block;color:var(--color-text-secondary);font-size:10.5px}.home-stat b{display:block;margin-top:3px;font-size:14px;font-weight:850;color:var(--color-text)}.home-stat.good b{color:var(--color-success)}.home-stat.warn b{color:var(--color-warning)}.home-stat.bad b{color:var(--color-danger)}
    .quick-heading{display:flex;align-items:center;gap:8px}.quick-heading:before{content:'';width:5px;height:22px;border-radius:999px;background:var(--color-primary)}.quick-heading h3{margin:0;font-size:17px;font-weight:850;color:var(--color-text)}
    .home-action-grid.core-four{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .home-action-card{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:86px;padding:12px;border:1px solid var(--color-border);border-radius:var(--radius-lg);background:var(--color-surface);color:var(--color-text);text-align:right;font-weight:850}
    .home-action-card .txt small{display:block;margin-top:3px;color:var(--color-text-secondary);font-size:10.5px;line-height:1.45}
    .home-action-card .ico{width:40px;height:40px;display:grid;place-items:center;border-radius:var(--radius-sm);background:var(--color-surface-muted);color:var(--color-text-secondary);flex:0 0 40px}.home-action-card.green .ico{background:var(--color-success-soft);color:var(--color-success)}.home-action-card.orange .ico{background:var(--color-warning-soft);color:var(--color-warning)}.home-action-card.blue .ico{background:var(--color-info-soft);color:var(--color-info)}
    .home-mini-panels{display:grid;grid-template-columns:1fr 1fr;gap:10px}.home-mini-panel{padding:12px}.home-mini-panel h3{margin:0 0 8px;font-size:14px;font-weight:850;color:var(--color-text)}.home-mini-list{display:grid;gap:7px}.home-mini-row,.home-recent-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--color-surface-soft);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:8px}.home-mini-row b,.home-recent-main b{display:block;font-size:12px;color:var(--color-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.home-mini-row span,.home-recent-main span{display:block;font-size:10.5px;color:var(--color-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.home-mini-row .amt,.home-recent-side strong{font-size:11.5px;font-weight:850;white-space:nowrap}.home-recent-list{display:grid;gap:7px}.home-recent-side{text-align:left}.home-recent-side small{display:block;font-size:9.5px;color:var(--color-text-secondary)}.home-recent-more{border:0;background:transparent;color:var(--color-primary);font-size:11.5px;font-weight:800;text-align:right;padding:4px 2px;min-height:28px}

    /* 11) Inventory */
    .inventory-v2{display:grid;gap:12px}.inv-hero,.purchase-hero,.settings-hero,.search-hero,.acc-lite-head,.product-profile-head,.account-edit-head{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:14px;box-shadow:var(--shadow-xs);color:var(--color-text)}
    .inv-hero-main,.purchase-hero-main,.acc-lite-title,.search-hero-main,.product-profile-main{display:flex;align-items:center;gap:10px;min-width:0}.inv-hero-icon,.purchase-icon,.acc-lite-icon,.search-hero-icon,.product-profile-icon{width:44px;height:44px;display:grid;place-items:center;flex:0 0 44px;border-radius:var(--radius-sm);background:var(--color-primary-soft);color:var(--color-primary)}.inv-hero h3,.purchase-hero h3,.settings-hero h3,.search-hero h3,.acc-lite-title h3{margin:0;font-size:18px;font-weight:850}.inv-hero p,.purchase-hero p,.settings-hero p,.search-hero p,.acc-lite-title p{margin:2px 0 0;color:var(--color-text-secondary);font-size:12px}.inv-hero-pill,.purchase-pill,.settings-pill,.acc-lite-count{background:var(--color-primary-soft);color:var(--color-primary);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;white-space:nowrap}
    .inv-stats,.purchase-kpis,.rc-summary,.acc-lite-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.inv-stat,.purchase-kpi,.rc-card,.acc-lite-stat,.profile-balance-mini,.product-profile-kpi{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:10px;box-shadow:var(--shadow-xs)}.inv-stat span,.purchase-kpi span,.rc-card span,.acc-lite-stat span,.profile-balance-mini span,.product-profile-kpi span{display:block;color:var(--color-text-secondary);font-size:10.5px}.inv-stat b,.purchase-kpi b,.rc-card b,.acc-lite-stat b,.profile-balance-mini b,.product-profile-kpi b{display:block;margin-top:3px;color:var(--color-text);font-size:14px;font-weight:850}

function renderStockMoves(productId=null,limit=30){const list=stockMoveRows(productId).slice(0,limit);if(!list.length)return '<div class="empty">هنوز حرکت انبار ثبت نشده است.</div>';return `<div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>جنس</th><th>نوع حرکت</th><th>داخل</th><th>بیرون</th><th>قبل</th><th>بعد</th><th>مرجع</th><th>کاربر</th><th>یادداشت</th></tr></thead><tbody>${list.map(m=>`<tr><td>${formatDate(m.date)}</td><td>${e(fullProductNameFrom(m.category,m.productName))}<br><span class="muted small">${e(m.unit||'')}</span></td><td>${stockMoveTypeLabel(m.type)}</td><td>${m.qtyIn?qty(m.qtyIn)+' '+e(m.unit||''):'-'}</td><td>${m.qtyOut?qty(m.qtyOut)+' '+e(m.unit||''):'-'}</td><td>${m.balanceBefore===null||m.balanceBefore===undefined?'-':qty(m.balanceBefore)}</td><td>${m.balanceAfter===null||m.balanceAfter===undefined?'-':qty(m.balanceAfter)}</td><td>${e(m.refNo||'-')}<br><span class="muted small">${e(m.party||'')}</span></td><td>${e(m.operator||'مدیر')}</td><td>${e(m.note||'')}</td></tr>`).join('')}</tbody></table></div>`}
function auditClone(v){try{return JSON.parse(JSON.stringify(v))}catch(err){return null}}
function addAuditLog(action,entity,{id='',title='',before=null,after=null,note=''}={}){db.auditLogs=db.auditLogs||[];db.auditLogs.push({id:uid(),date:todayIso(),createdAt:nowISOTime(),action,entity,entityId:id,title,note,before:auditClone(before),after:auditClone(after)});if(db.auditLogs.length>2000)db.auditLogs=db.auditLogs.slice(-2000)}
function auditActionLabel(a){return({create:'ایجاد',update:'ویرایش',delete:'حذف',void:'باطل',activate:'فعال‌سازی',deactivate:'غیرفعال‌سازی',payment:'پرداخت/دریافت'}[a]||a)}
function auditEntityLabel(e){return({sale:'فاکتور فروش',purchase:'رسید ورود کالا',customer:'حساب مشتری',product:'جنس',adjustment:'اصلاح انبار',payment:'پرداخت مشتری',supplierPayment:'پرداخت فروشنده',expense:'مصرف',return:'برگشت کالا'}[e]||e)}
function renderAuditLogs(start=null,end=null,limit=40){const list=[...(db.auditLogs||[])].filter(x=>(!start||x.date>=start)&&(!end||x.date<=end)).sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt)).slice(0,limit);if(!list.length)return '<div class="empty">هنوز تاریخچه تغییرات ثبت نشده است.</div>';return `<div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>عمل</th><th>بخش</th><th>شرح</th><th>یادداشت</th></tr></thead><tbody>${list.map(x=>`<tr><td>${formatDate(x.date)}</td><td><span class="badge ${x.action==='delete'?'bad':x.action==='update'?'warn':'info'}">${auditActionLabel(x.action)}</span></td><td>${auditEntityLabel(x.entity)}</td><td><b>${e(x.title||'-')}</b><br><span class="muted small">${e(x.entityId||'')}</span></td><td>${e(x.note||'-')}</td></tr>`).join('')}</tbody></table></div>`}
function hasUnsavedWork(){return !!((state.saleCart&&state.saleCart.length)||(state.purchaseCart&&state.purchaseCart.length)||(state.accountSaleCart&&state.accountSaleCart.length))}
function runSelfCheck(){try{const issues=dbHealthReport().map(x=>`${x.type}: ${x.title} (${x.count})`);if(!db)issues.push('db not loaded');(db.products||[]).forEach(p=>{if(!p.id)issues.push('product without id')});(db.sales||[]).forEach(s=>{if(!s.id)issues.push('sale without id');if(!s.invoiceNo)issues.push('sale without invoice number')});(db.purchases||[]).forEach(p=>{if(!p.id)issues.push('purchase without id');if(!p.receiptNo)issues.push('purchase without receipt number')});return{ok:issues.length===0,issues}}catch(e){return{ok:false,issues:[String(e)]}}}
function showSelfCheckReport(){const r=runSelfCheck();if(r.ok)toast('تست مالی و ساختاری: مشکل مهمی پیدا نشد.','good');else alert('نتیجه تست مالی/ساختاری:\n\n'+r.issues.join('\n'))}
function setupRippleEffects(){/* حالت متوازن: افکت موج برای سرعت بهتر خاموش است؛ انیمیشن‌های سبک باقی می‌ماند */}
function setupBrowserUx(){try{if(window.__hamgamUxReady)return;window.__hamgamUxReady=true;setupRippleEffects();let __lastBtn=null,__lastBtnAt=0;document.addEventListener('click',ev=>{const btn=ev.target.closest?.('button');if(!btn)return;const now=Date.now();if(btn===__lastBtn&&now-__lastBtnAt<650){ev.preventDefault();ev.stopImmediatePropagation();return}__lastBtn=btn;__lastBtnAt=now},true);window.addEventListener('beforeunload',ev=>{if(hasUnsavedWork()){ev.preventDefault();ev.returnValue='';return''}});window.addEventListener('online',()=>toast('اتصال انترنت برقرار شد.','good'));window.addEventListener('offline',()=>toast('شما آفلاین هستید؛ برنامه همچنان کار می‌کند.','warn'));window.addEventListener('error',ev=>{console.error(ev.error||ev.message);try{toast('یک خطای برنامه ثبت شد.','bad')}catch(e){}});window.addEventListener('unhandledrejection',ev=>{console.error(ev.reason);try{toast('یک خطای ذخیره/پردازش ثبت شد.','bad')}catch(e){}});if(history&&history.replaceState)history.replaceState({view:state.view},'',location.hash||'#'+state.view);window.addEventListener('popstate',ev=>{if(ev.state&&ev.state.view){applyHistoryState(ev.state)}})}catch(e){}}
function pushAppHistory(payload,urlHash){try{if(!history||!history.pushState)return;const cur=history.state||{};const same=JSON.stringify(cur)===JSON.stringify(payload);if(!same)history.pushState(payload,'',urlHash||('#'+(payload.view||state.view||'dashboard')))}catch(e){}}
function applyHistoryState(hs){
  hs=hs||{view:'dashboard'};
  state.view=hs.view||'dashboard';
  state.statementCustomerId=hs.statementCustomerId||null;
  state.customerEditId=hs.customerEditId||null;
  state.accountAddMode=!!hs.accountAddMode;
  state.accountActionId=null;state.editSaleId=null;state.returnSaleId=null;
  state.productProfileId=hs.productProfileId||null;
  state.productEditId=hs.productEditId||null;
  state.inventoryTool=hs.inventoryTool||null;
  render()
}
function setView(v){state.view=v;state.statementCustomerId=null;state.customerEditId=null;state.accountAddMode=false;state.accountActionId=null;state.editSaleId=null;state.returnSaleId=null;state.productProfileId=null;state.productEditId=null;state.inventoryTool=null;pushAppHistory({view:v},'#'+v);render();if(window.innerWidth&&window.innerWidth<=820)window.scrollTo({top:0,behavior:'smooth'})}
function productById(id){return db.products.find(p=>p.id===id)} function customerById(id){return db.customers.find(c=>c.id===id)} function accountById(id){return customerById(id)}
function activeProducts(){return db.products.filter(p=>p.active!==false&&p.hidden!==true)}
function productCategory(p){return (p&&p.category?String(p.category).trim():'')||(p&&p.name?String(p.name).trim():'عمومی')}
function fullProductNameFrom(category,name){category=String(category||'').trim();name=String(name||'').trim();if(category&&name&&category!==name)return category+' — '+name;return name||category||'-'}
function fullProductName(p){return fullProductNameFrom(productCategory(p),p?p.name:'')}
function categories(activeOnly=true){const list=[];DEFAULT_PRODUCTS.forEach(p=>list.push(p.category||p.name));(activeOnly?activeProducts():db.products.filter(p=>p.hidden!==true)).forEach(p=>list.push(productCategory(p)));return [...new Set(list.filter(Boolean))]}
function categoryOptions(sel='',activeOnly=true){const cs=categories(activeOnly);const selected=sel&&cs.includes(sel)?sel:(cs[0]||'');return cs.map(c=>`<option value="${e(c)}" ${c===selected?'selected':''}>${e(c)}</option>`).join('')}
function categoryDatalist(){return `<datalist id="categoryNames">${categories(false).map(c=>`<option value="${e(c)}">`).join('')}</datalist>`}
function productOptions(sel='',cat=''){const ps=activeProducts().filter(p=>!cat||productCategory(p)===cat);if(!ps.length)return '<option value="">برای این کالای اصلی نوعی ثبت نشده</option>';return ps.map(p=>{const label=cat?String(p.name||''):fullProductName(p);return `<option value="${e(p.id)}" ${p.id===sel?'selected':''}>${e(label)} — موجودی: ${qty(p.stock)} ${e(p.unit)}</option>`}).join('')}

function accountTypeLabel(t){return t==='supplier'?'فروشنده':t==='both'?'مشتری و فروشنده':t==='expense'?'مصرف / خرج':'مشتری'}
function isCustomerAccount(c){return ['customer','both'].includes(c?.type||'customer')}
function isSupplierAccount(c){return ['supplier','both'].includes(c?.type||'customer')}
function isExpenseAccount(c){return (c?.type||'customer')==='expense'}
function promoteAccountRole(c,role){if(!c)return;c.type=c.type||'customer';if(role==='customer'&&c.type==='supplier')c.type='both';else if(role==='supplier'&&c.type==='customer')c.type='both';else if(role==='supplier'&&c.type!=='both')c.type='supplier';else if(role==='customer'&&c.type!=='both')c.type='customer'}
function customerOptions(sel=''){const ps=db.customers.filter(isCustomerAccount);return ps.map(c=>`<option value="${e(c.id)}" ${c.id===sel?'selected':''}>${e(c.name)} — طلب: ${money(Math.max(0,customerBalance(c.id)))}</option>`).join('')}
function supplierOptions(sel=''){const ps=db.customers.filter(isSupplierAccount);return ps.map(c=>`<option value="${e(c.id)}" ${c.id===sel?'selected':''}>${e(c.name)} — بدهی ما: ${money(Math.max(0,supplierBalance(c.id)))}</option>`).join('')}
function expenseOptions(sel=''){const ps=db.customers.filter(isExpenseAccount);return ps.map(c=>`<option value="${e(c.id)}" ${c.id===sel?'selected':''}>${e(c.name)} — مصرف: ${money(expenseTotal(c.id))}</option>`).join('')}
function accountOptions(sel=''){return db.customers.map(c=>`<option value="${e(c.id)}" ${c.id===sel?'selected':''}>${e(c.name)} — ${accountTypeLabel(c.type)}</option>`).join('')}
function customerDatalist(){return `<datalist id="customerNames">${db.customers.filter(isCustomerAccount).map(c=>`<option value="${e(c.name)}">`).join('')}</datalist>`}
function supplierDatalist(){return `<datalist id="supplierNames">${db.customers.filter(isSupplierAccount).map(c=>`<option value="${e(c.name)}">`).join('')}</datalist>`}
function customerBalance(id){const debt=db.sales.filter(s=>s.customerId===id).reduce((a,s)=>a+(toNum(s.total)-toNum(s.paid)),0);const paid=db.payments.filter(p=>p.customerId===id).reduce((a,p)=>a+toNum(p.amount),0);return round2(debt-paid)}
function supplierBalance(id){const debt=db.purchases.filter(p=>p.supplierId===id).reduce((a,p)=>a+(toNum(p.total)-toNum(p.paid)),0);const paid=(db.supplierPayments||[]).filter(p=>p.supplierId===id).reduce((a,p)=>a+toNum(p.amount),0);return round2(debt-paid)}
function expenseTotal(id){return round2((db.expenses||[]).filter(x=>x.accountId===id).reduce((a,x)=>a+toNum(x.amount),0))}
function totalExpenses(){return round2((db.expenses||[]).reduce((a,x)=>a+toNum(x.amount),0))}
function accountReceivable(id){return round2(Math.max(0,customerBalance(id)))}
function accountPayable(id){return round2(Math.max(0,-customerBalance(id))+Math.max(0,supplierBalance(id)))}
function totalCustomerDebt(){return db.customers.reduce((a,c)=>a+Math.max(0,customerBalance(c.id)),0)}
function totalSupplierDebt(){return db.customers.reduce((a,c)=>a+Math.max(0,supplierBalance(c.id)),0)}
function totalReceivable(){return db.customers.reduce((a,c)=>a+accountReceivable(c.id),0)}
function totalPayable(){return db.customers.reduce((a,c)=>a+accountPayable(c.id),0)}
function saleTotal(cart=state.saleCart){return round2(cart.reduce((a,i)=>a+i.qty*i.price,0))}
function purchaseBaseTotal(cart=state.purchaseCart){return round2((cart||[]).reduce((a,i)=>a+toNum(i.qty)*toNum(i.cost),0))}
function purchaseExtraTotal(){return round2((state.purchaseExtraCosts||[]).reduce((a,x)=>a+toNum(x.amount),0))}
function purchaseTotal(cart=state.purchaseCart){return round2(purchaseBaseTotal(cart)+purchaseExtraTotal())}
function applyTheme(){try{document.documentElement.setAttribute('data-theme',db?.settings?.theme||'light')}catch(e){}}
function currentOperator(){return state?.currentUser?.name||state?.currentUserName||'مدیر'}
function productSearchText(p){return [productCategory(p),p?.name,p?.unit,fullProductName(p)].filter(Boolean).join(' ').toLowerCase()}
function findProductByText(text){const q=String(text||'').trim().toLowerCase();if(!q)return null;return activeProducts().find(p=>fullProductName(p).toLowerCase()===q||String(p.name||'').trim().toLowerCase()===q)||activeProducts().find(p=>productSearchText(p).includes(q))||null}
function renderError(err){const msg=err&&err.message?err.message:String(err);return `<div class="app-error"><h3>خطا در نمایش این بخش</h3><p>برنامه بسته نشده است. می‌توانید به داشبورد برگردید یا صفحه را دوباره باز کنید.</p><code>${e(msg)}</code><div class="toolbar"><button class="btn secondary" onclick="state.view='dashboard';render()">رفتن به داشبورد</button><button class="btn ghost" onclick="location.reload()">بارگذاری دوباره</button></div></div>`}
function render(){applyTheme();try{document.body.dataset.view=state.view;document.body.dataset.accountSubview=(state.view==='customers'&&!state.accountAddMode&&!state.customerEditId&&!state.statementCustomerId&&!state.accountActionId)?'list':''}catch(e){}const box=document.getElementById('view');try{document.getElementById('sideShopName').textContent=db.settings.shopName||'فروشگاه هم‌گام';document.getElementById('todayText').innerHTML='امروز: <b>'+formatDateLong(todayIso())+'</b> &nbsp; | &nbsp; ذخیره: '+(storageMode==='IndexedDB'?'IndexedDB آفلاین':'LocalStorage آفلاین');renderNav();const found=navItems.find(x=>x[0]===state.view);document.getElementById('pageTitle').textContent=found?found[2]:(state.view==='sale'?'فروش نقدی سریع':'داشبورد');const views={dashboard:renderDashboard,sale:renderSale,purchase:renderPurchase,products:renderProducts,customers:renderCustomers,reports:renderReports,search:renderSearch,settings:renderSettings};box.innerHTML=(views[state.view]||renderDashboard)();try{box.classList.remove('view-enter');void box.offsetWidth;box.classList.add('view-enter')}catch(e){}enhanceMobileTables();renderLock()}catch(err){console.error('Render error:',err);if(box)box.innerHTML=renderError(err);try{toast('در نمایش این بخش خطا رخ داد.','bad')}catch(e){}}}

function enhanceMobileTables(){document.querySelectorAll('#view table').forEach(table=>{const labels=[...table.querySelectorAll('thead th')].map(th=>th.textContent.trim());table.querySelectorAll('tbody tr').forEach(tr=>{[...tr.children].forEach((td,i)=>{if(labels[i])td.setAttribute('data-label',labels[i])})})})}

function simpleHash(str){let h=2166136261;str=String(str||'');for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
function pinHash(pin){return simpleHash('hamgam-pin-'+String(pin||''))}
function renderLock(){const el=document.getElementById('lockScreen');if(el){el.style.display='none';el.innerHTML=''}}
function unlockApp(){const v=document.getElementById('unlockPin')?.value||'';if(pinHash(v)===db.settings.pinHash){state.unlocked=true;renderLock();toast('خوش آمدید.','good')}else{toast('رمز صحیح نیست.','bad');const i=document.getElementById('unlockPin');if(i){i.value='';i.focus()}}}
function lockApp(){if(db.settings.pinHash){state.unlocked=false;renderLock();toast('برنامه قفل شد.','warn')}}
function savePinSettings(){const cur=document.getElementById('setPinCurrent')?.value||'',pin=document.getElementById('setPinNew')?.value||'',conf=document.getElementById('setPinConfirm')?.value||'';if(!/^\d{4}$/.test(pin))return toast('رمز باید 4 رقم باشد.','bad');if(pin!==conf)return toast('تکرار رمز برابر نیست.','bad');if(db.settings.pinHash&&pinHash(cur)!==db.settings.pinHash)return toast('رمز فعلی صحیح نیست.','bad');db.settings.pinHash=pinHash(pin);state.unlocked=true;saveDB(false);toast('رمز ورود فعال/تغییر شد.');render()}
function disablePin(){const cur=document.getElementById('setPinCurrent')?.value||'';if(!db.settings.pinHash)return toast('رمزی فعال نیست.','warn');if(pinHash(cur)!==db.settings.pinHash)return toast('برای حذف رمز، رمز فعلی را وارد کنید.','bad');if(!confirm('رمز ورود حذف شود؟'))return;db.settings.pinHash='';state.unlocked=true;saveDB(false);toast('رمز ورود حذف شد.','warn');render()}
function requireDeletePin(action='این عمل حساس'){
  if(!db.settings.deletePinHash){toast('اول رمز حذف و ریست را در تنظیمات بسازید.','bad');state.view='settings';render();return false}
  const now=Date.now(),lockedUntil=toNum(db.settings.deletePinLockedUntil||0);
  if(lockedUntil&&lockedUntil>now){const mins=Math.ceil((lockedUntil-now)/60000);toast('به دلیل تلاش ناموفق، رمز حذف و ریست تا '+fmt(mins)+' دقیقه قفل است.','bad');return false}
  const v=(window.prompt?window.prompt('رمز حذف و ریست را وارد کنید:\n'+action):prompt('رمز حذف و ریست را وارد کنید:'));
  if(v===null||v===undefined)return false;
  if(pinHash(v)===db.settings.deletePinHash){db.settings.deletePinFailCount=0;db.settings.deletePinLockedUntil=0;saveDB(false);return true}
  db.settings.deletePinFailCount=Math.max(0,toNum(db.settings.deletePinFailCount||0))+1;
  if(db.settings.deletePinFailCount>=5){db.settings.deletePinFailCount=0;db.settings.deletePinLockedUntil=now+5*60000;saveDB(false);toast('رمز چند بار اشتباه وارد شد؛ حذف و ریست برای 5 دقیقه قفل شد.','bad');return false}
  saveDB(false);toast('رمز حذف و ریست صحیح نیست. تلاش باقی‌مانده: '+fmt(5-db.settings.deletePinFailCount),'bad');return false
}
function saveDeletePinSettings(){const cur=document.getElementById('setDeletePinCurrent')?.value||'',pin=document.getElementById('setDeletePinNew')?.value||'',conf=document.getElementById('setDeletePinConfirm')?.value||'';if(!/^\d{4,6}$/.test(pin))return toast('رمز باید 4 تا 6 رقم باشد.','bad');if(pin!==conf)return toast('تکرار رمز برابر نیست.','bad');if(db.settings.deletePinHash&&pinHash(cur)!==db.settings.deletePinHash)return toast('رمز فعلی صحیح نیست.','bad');db.settings.deletePinHash=pinHash(pin);db.settings.deletePinFailCount=0;db.settings.deletePinLockedUntil=0;saveDB(false);toast('رمز حذف و ریست ذخیره شد.','good');render()}
function disableDeletePin(){const cur=document.getElementById('setDeletePinCurrent')?.value||'';if(!db.settings.deletePinHash)return toast('رمز حذف و ریست فعال نیست.','warn');if(pinHash(cur)!==db.settings.deletePinHash)return toast('برای حذف رمز، رمز فعلی را وارد کنید.','bad');if(!confirm('رمز حذف و ریست غیرفعال شود؟'))return;db.settings.deletePinHash='';saveDB(false);toast('رمز حذف و ریست غیرفعال شد.','warn');render()}
function backupDue(){return !db.settings.lastBackupDate||db.settings.lastBackupDate!==todayIso()}

fullProductNameFrom(a.category,a.productName)} — ${a.reason||''}`,amount:a.qtySigned,extra:a.unit||'',id:a.id})});return rows.sort((a,b)=>(b.date+(b.createdAt||'')).localeCompare(a.date+(a.createdAt||'')))}

  return `<div class="panel"><div class="panel-title"><h3>ثبت فروش / فاکتور</h3><span class="badge info">از انبار همان نوع کم می‌شود</span></div>${customerDatalist()}<div class="form-grid"><div class="field"><label>تاریخ هجری شمسی</label><input id="saleDate" value="${e(state.sale.date)}" oninput="state.sale.date=this.value" placeholder="مثلاً 1405/04/21"></div><div class="field"><label>نام مشتری</label><input id="saleCustomer" list="customerNames" value="${e(state.sale.customerName)}" oninput="state.sale.customerName=this.value" placeholder="نقدی یا نام مشتری"></div><div class="field"><label>شماره مشتری</label><input id="salePhone" value="${e(state.sale.customerPhone)}" oninput="state.sale.customerPhone=this.value" placeholder="اختیاری"></div><div class="field"><label>نوع دریافت</label><select id="saleMethod" onchange="state.sale.method=this.value"><option ${state.sale.method==='نقد'?'selected':''}>نقد</option><option ${state.sale.method==='حواله'?'selected':''}>حواله</option><option ${state.sale.method==='کارت'?'selected':''}>کارت</option><option ${state.sale.method==='نسیه'?'selected':''}>نسیه</option></select></div></div><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><div class="form-grid"><div class="field"><label>کالای اصلی</label><select id="saleCategory" onchange="state.sale.category=this.value;refreshProductSelect('saleCategory','saleProduct','sale')">${categoryOptions(saleCat)}</select></div><div class="field"><label>نوع / مدل کالا</label><select id="saleProduct" onchange="fillSalePrice()">${productOptions('',saleCat)}</select></div><div class="field"><label>تعداد/مقدار</label><input id="saleQty" inputmode="decimal" placeholder="مثلاً 10"></div><div class="field"><label>قیمت فی واحد</label><input id="salePrice" inputmode="decimal" placeholder="خالی = قیمت فروش جنس"></div><div class="field"><label>&nbsp;</label><button class="btn" onclick="addSaleLine()">افزودن به فاکتور</button></div></div><p class="muted small">مثال: اول «گچ» را انتخاب function addSaleLine(){captureSale();const p=productById(document.getElementById('saleProduct').value),q=toNum(document.getElementById('saleQty').value);if(!p)return toast('کالا انتخاب نشده است.','bad');if(q<=0)return toast('مقدار فروش صحیح نیست.','bad');const priceInput=document.getElementById('salePrice').value;const price=priceInput.trim()?toNum(priceInput):toNum(p.sellPrice);if(price<=0)return toast('قیمت فروش را وارد کنید.','bad');const already=state.saleCart.filter(i=>i.productId===p.id).reduce((a,i)=>a+i.qty,0);if(q+already>toNum(p.stock))return toast('موجودی کافی نیست. موجودی فعلی: '+qty(p.stock)+' '+p.unit,'bad');state.saleCart.push({productId:p.id,category:productCategory(p),productName:p.name,unit:p.unit,qty:q,price:price,cost:toNum(p.buyPrice)});render()}

function registerSale(){captureSale();const date=solarToIso(state.sale.date);if(!date)return toast('تاریخ فروش صحیح نیست. نمونه: 1405/04/21','bad');if(!state.saleCart.length)return toast('فاکتور خالی است.','bad');const subtotal=saleTotal(),discount=toNum(state.sale.discount);if(discount<0||discount>subtotal)return toast('تخفیف صحیح نیست.','bad');const total=round2(subtotal-discount),paid=toNum(state.sale.paid);if(paid<0||paid>total)return toast('مبلغ پرداخت شده باید بین صفر و مبلغ فاکتور باشد.','bad');const due=round2(total-paid);const cname=(state.sale.customerName||'').trim();const cashName=isCashCustomerName(cname)||!cname;if(due>0&&cashName)return toast('برای فروش نسیه، نام مشتری را وارد کنید.','bad');let required={};state.saleCart.forEach(i=>required[i.productId]=(required[i.productId]||0)+i.qty);for(const id in required){const p=productById(id);if(!p)return toast('کالا یافت نشد.','bad');if(!db.settings.allowNegativeStock&&toNum(p.stock)<required[id])return toast('موجودی '+(p?p.name:'جنس')+' کافی نیست.','bad')}const c=cashName?cashCustomerAccount():findOrCreateCustomer(cname,state.sale.customerPhone);state.saleCart.forEach(i=>{const p=productById(i.productId);p.stock=round2(toNum(p.stock)-i.qty)});const sale={id:uid(),invoiceNo:nextInvoiceNo(),date,customerId:c?c.id:null,customerName:c?c.name:(cname||'نقدی'),items:state.saleCart.map(x=>({...x,total:round2(x.qty*x.price)})),subtotal,discount,total,paid,due,paymentMethod:state.sale.method,note:state.sale.note,costTotal:round2(state.saleCart.reduce((a,i)=>a+i.qty*i.cost,0)),operator:currentOperator(),createdAt:nowISOTime()};db.sales.push(sale);sale.items.filter(i=>i.productId).forEach(i=>{const p=productById(i.productId);addStockMove({...productSnapshot(i.productId,i),date:sale.date,type:'sale_out',qtyOut:i.qty,refType:'sale',refId:sale.id,refNo:sale.invoiceNo,party:sale.customerName,note:'فروش / بردگی',balanceAfter:p?toNum(p.stock):null})});addAuditLog('create','sale',{id:sale.id,title:'فاکتور '+sale.invoiceNo+' function renderProductProfile(id){const p=productById(id);if(!p)return '<div class="empty">کالا یافت نشد.</div>';const moves=stockMoveRows(id),sales=productSales(id),purchases=productPurchases(id);const qtyIn=round2(moves.reduce((a,m)=>a+toNum(m.qtyIn),0)),qtyOut=round2(moves.reduce((a,m)=>a+toNum(m.qtyOut),0)),soldQty=round2(sales.reduce((a,x)=>a+toNum(x.item.qty),0)),buyQty=round2(purchases.reduce((a,x)=>a+toNum(x.item.qty),0));const saleAmount=round2(sales.reduce((a,x)=>a+toNum(x.item.total),0)),purchaseAmount=round2(purchases.reduce((a,x)=>a+toNum(x.item.total),0));const low=toNum(p.minStock)>0&&toNum(p.stock)<=toNum(p.minStock);return `<div class="product-profile"><div class="product-profile-head"><div class="product-profile-main"><div class="product-profile-icon">${iconSvg('warehouse')}</div><div><h3>${e(fullProductName(p))}</h3><p>واحد: ${e(p.unit)} — گروپ: ${e(productCategory(p))}</p></div></div><div class="product-profile-actions"><button onclick="closeProductProfile()">برگشت</button><button onclick="event.stopPropagation();editProduct('${p.id}')">ویرایش</button><button onclick="event.stopPropagation();toggleProduct('${p.id}')">${p.active===false?'فعال کردن':'غیرفعال'}</button><button onclick="state.productProfileId=null;setView('purchase')">ورود کالا</button><button onclick="state.productProfileId=null;setView('customers')">فروش به مشتری</button></div></div><div class="product-profile-kpis"><div class="product-profile-kpi ${low?'warn':''}"><span>موجودی فعلی</span><b>${qty(p.stock)} ${e(p.unit)}</b></div><div class="product-profile-kpi in"><span>کل ورودی</span><b>${qty(qtyIn)} ${e(p.unit)}</b></div><div class="product-profile-kpi out"><span>کل خروجی</span><b>${qty(qtyOut)} ${e(p.unit)}</b></div><div class="product-profile-kpi"><span>حداقل هشدار</span><b>${qty(p.minStock)} ${e(p.unit)}</b></div></div><div class="product-profile-grid"><div class="product-profile-panel"><h3>آخرین فروش‌ها</h3>${sales.length?`<div class="product-mini-list">${sales.slice(0,8).map function isGenericProduct(p){const n=String(p?.name||'').trim();return n==='نوع عمومی'||n==='عمومی'||n==='پیش‌فرض'}
function productHasReferences(productId){return (db.sales||[]).some(s=>(s.items||[]).some(i=>i.productId===productId))||(db.purchases||[]).some(p=>(p.items||[]).some(i=>i.productId===productId))||(db.adjustments||[]).some(a=>a.productId===productId)||(db.stockMoves||[]).some(m=>m.productId===productId)}
function cleanupGenericProducts(){
  const list=(db.products||[]).filter(p=>isGenericProduct(p)&&p.hidden!==true);
  if(!list.length)return toast('هیچ نوع عمومی قابل نمایش پیدا نشد.','warn');
  const deletable=list.filter(p=>toNum(p.stock)===0&&!productHasReferences(p.id));
  const hideable=list.filter(p=>toNum(p.stock)===0&&productHasReferences(p.id));
  const blocked=list.filter(p=>toNum(p.stock)!==0);
  if(!deletable.length&&!hideable.length)return toast('نوع عمومی‌ها موجودی دارند؛ اول موجودی‌شان را صفر یا نام‌شان را ویرایش کنید.','warn');
  if(!confirm(`${deletable.length} نوع عمومی حذف و ${hideable.length} نوع عمومی استفاده‌شده مخفی شود؟ ${blocked.length?blocked.length+' مورد به دلیل موجودی دست‌نخورده می‌ماند.':''}`))return;
  deletable.forEach(p=>addAuditLog('delete','product',{id:p.id,title:fullProductName(p),before:p,note:'پاک‌سازی نوع عمومی بی‌استفاده'}));
  hideable.forEach(p=>{const before=auditClone(p);p.hidden=true;p.active=false;addAuditLog('update','product',{id:p.id,title:fullProductName(p),before,after:p,note:'مخفی‌سازی نوع عمومی استفاده‌شده'})});
  db.products=db.products.filter(p=>!deletable.some(d=>d.id===p.id));
  saveDB(false);
  toast(`${deletable.length} حذف شد، ${hideable.length} مخفی شد${blocked.length?'، '+blocked.length+' مورد باقی ماند':''}.`,'good');
  render()
}

function saveProductForm(ev){

  if(!category||!name||!unit)return toast('کالای اصلی، نوع کالا و واحد ضروری است.','bad');

    const p=productById(state.productEditId),before=auditClone(p);Object.assign(p,{category,name,unit,minStock:toNum(document.getElementById('prodMin').value)});

  }else{

}

function saveAdjustment(){const date=solarToIso(document.getElementById('adjDate').value),p=productById(document.getElementById('adjProduct').value),type=document.getElementById('adjType').value,q=toNum(document.getElementById('adjQty').value),reason=document.getElementById('adjReason').value.trim();if(!date)return toast('تاریخ صحیح نیست.','bad');if(!p)return toast('نوع کالا انتخاب نشده است.','bad');if(q<=0)return toast('مقدار صحیح نیست.','bad');const signed=type==='add'?q:-q;if(toNum(p.stock)+signed<0)return toast('موجودی نمی‌تواند منفی شود.','bad');p.stock=round2(toNum(p.stock)+signed);const adj={id:uid(),date,productId:p.id,category:productCategory(p),productName:p.name,unit:p.unit,qtySigned:signed,reason,operator:currentOperator(),createdAt:nowISOTime()};db.adjustments.push(adj);addStockMove({...productSnapshot(p.id,p),date,type:signed>=0?'adjust_in':'adjust_out',qtyIn:signed>=0?signed:0,qtyOut:signed<0?Math.abs(signed):0,refType:'adjustment',refId:adj.id,refNo:'',party:'',note:reason||'اصلاح انبار',balanceAfter:p.stock});addAuditLog('create','adjustment',{id:adj.id,title:fullProductNameFrom(adj.category,adj.productName),after:adj,note:reason||'اصلاح انبار'});state.inventoryTool=null;saveDB(false);toast('اصلاح انبار ثبت شد.');render()}
function renderAdjustments(){const list=[...db.adjustments].sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt)).slice(0,20);if(!list.length)return '<div class="empty">هنوز اصلاح موجودی ثبت نشده است.</div>';return `<div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>جنس</th><th>تغییر</th><th>دلیل</th><th>عملیات</th></tr></thead><tbody>${list.map(a=>`<tr><td>${formatDate(a.date)}</td><td>${e(fullProductNameFrom(a.category,a.productName))}</td><td><span class="badge ${a.qtySigned>=0?'good':'bad'}">${a.qtySigned>=0?'+':''}${qty(a.qtySigned)} ${e(a.unit)}</span></td><td>${e(a.reason||'-')}</td><td><button class="btn smallbtn bad" onclick="deleteAdjustment('${a.id}')">حذف</button></td></tr>`).join('')}</tbody></table></div>`}
function deleteAdjustment(id){if(!requireDeletePin('حذف اصلاح انبار'))return;createInternalBackup('beforeDeleteAdjustment');const a=db.adjustments.find(x=>x.id===id);if(!a)return;if(!confirm('این اصلاح حذف شود؟ اثر آن از موجودی برعکس می‌شود.'))return;const p=productById(a.productId);if(p){if(toNum(p.stock)-toNum(a.qtySigned)<0)return toast('با حذف این اصلاح، موجودی منفی می‌شود.','bad');p.stock=round2(toNum(p.stock)-toNum(a.qtySigned));const q=toNum(a.qtySigned);addStockMove({...productSnapshot(a.productId,a),date:todayIso(),type:q>=0?'adjust_delete_out':'adjust_delete_in',qtyIn:q<0?Math.abs(q):0,qtyOut:q>=0?q:0,refType:'adjustment',refId:a.id,refNo:'',party:'',note:'حذف اصلاح انبار',balanceAfter:p.stock});addAuditLog('delete','adjustment',{id:a.id,title:fullProductNameFrom(a.category,a.productName),before:a,note:'حذف اصلاح انبار'})}db.adjustments=db.adjustments.filter(x=>x.id!==id);saveDB(false);toast('اصلاح حذف شد.','warn');render()}
function daysBetweenIso(a,b){try{const d1=new Date(a+'T00:00:00'),d2=new Date(b+'T00:00:00');return Math.max(0,Math.floor((d2-d1)/86400000))}catch(e){return 0}}
function customerDebtInfo(id){const entries=[];(db.sales||[]).filter(s=>s.customerId===id).forEach(s=>entries.push({date:s.date,createdAt:s.createdAt||'',debit:toNum(s.total),credit:toNum(s.paid)}));(db.payments||[]).filter(p=>p.customerId===id).forEach(p=>entries.push({date:p.date,createdAt:p.createdAt||'',debit:0,credit:toNum(p.amount)}));entries.sort((a,b)=>(a.date+a.createdAt).localeCompare(b.date+b.createdAt));let bal=0,start=null;for(const r of entries){const prev=bal;bal=round2(bal+toNum(r.debit)-toNum(r.credit));if(prev<=0&&bal>0)start=r.date;if(bal<=0)start=null}return{balance:round2(bal),since:start,days:start?daysBetweenIso(start,todayIso()):0}}
function customerDebtAlert(id){const info=customerDebtInfo(id),daysLimit=toNum(db.settings.debtWarnDays||30),messages=[];if(info.balance>0&&daysLimit>0&&info.days>=daysLimit)messages.push(`مشتری ${customerById(id)?.name||''} ${fmt(info.days)} روز است بدهکار است.`);const c=customerById(id),limit=toNum(c?.creditLimit||0);if(info.balance>0&&limit>0&&info.balance>limit)messages.push(`بدهی مشتری از حد اعتبار (${money(limit)}) گذشته است.`);return{...info,creditLimit:limit,has:messages.length>0,messages}}
function lastAccountActivity(id){let dates=[];db.sales.filter(x=>x.customerId===id).forEach(x=>dates.push(x.date));db.payments.filter(x=>x.customerId===id).forEach(x=>dates.push(x.date));return dates.sort().pop()||''}
function avatarStyle(name){name=String(name||'؟');let sum=0;for(const ch of name)sum+=ch.charCodeAt(0);const h=sum%360;return `background:linear-gradient(135deg,hsl(${h},78%,55%),hsl(${(h+38)%360},78%,42%))`}

function openAddAccountPanel(){state.view='customers';state.statementCustomerId=null;state.customerEditId=null;state.accountActionId=null;state.editSaleId=null;state.returnSaleId=null;state.accountAddMode=true;render()}
function accountStatusInfo(balance){balance=toNum(balance);if(balance>0)return{key:'debt',text:'باقی‌مانده قابل دریافت',kind:'warn'};if(balance<0)return{key:'credit',text:'مبلغ قابل پرداخت به مشتری',kind:'good'};return{key:'clear',text:'حساب تسویه است',kind:'good'}}
function todayCustomerPaymentsTotal(){const t=todayIso();return round2((db.payments||[]).filter(p=>p.date===t).reduce((a,p)=>a+toNum(p.amount),0))}
function customerTotals(id){const sales=(db.sales||[]).filter(s=>s.customerId===id),pays=(db.payments||[]).filter(p=>p.customerId===id);return{sales:round2(sales.reduce((a,s)=>a+toNum(s.total),0)),paid:round2(sales.reduce((a,s)=>a+toNum(s.paid),0)+pays.reduce((a,p)=>a+toNum(p.amount),0)),invoiceCount:sales.length,paymentCount:pays.length}}
function openQuickPayment(){const debtors=(db.customers||[]).filter(isCustomerAccount).filter(c=>c.active!==false&&customerBalance(c.id)>0).sort((a,b)=>customerBalance(b.id)-customerBalance(a.id));state.view='customers';state.accountAddMode=false;state.customerEditId=null;state.statementCustomerId=null;state.accountFilter='active';state.accountBalanceFilter='debt';state.accountSort='balance';state.accountProfileTab='brought';if(debtors.length===1){showStatement(debtors[0].id);state.accountProfileTab='brought'}else{toast(debtors.length?'مشتری بدهکار را انتخاب کنید و تب آوردگی را بزنید.':'فعلاً مشتری بدهکار ندارید.','warn');render()}}
function openQuickCreditSale(){state.view='customers';state.accountAddMode=false;state.customerEditId=null;state.statementCustomerId=null;state.accountFilter='active';state.accountBalanceFilter='all';state.accountSort='recent';state.accountProfileTab='taken';toast('برای فروش نسیه، مشتری را باز کنید و تب بردگی را بزنید.','good');render()}
function accountBalanceDisplayHtml(bal){const n=fmt(Math.abs(toNum(bal)));if(toNum(bal)>0)return `<span class="acc-balance-num negative" dir="ltr">-${n}</span><span class="acc-balance-currency"> افغانی</span>`;if(toNum(bal)<0)return `<span class="acc-balance-num positive" dir="ltr">${n}</span><span class="acc-balance-currency"> افغانی</span>`;return `<span class="acc-balance-num zero" dir="ltr">0</span><span class="acc-balance-currency"> افغانی</span>`}
function renderCustomers(){
  if(state.accountAddMode)return renderAccountAddPage();
  if(state.customerEditId)return renderAccountEditPage(state.customerEditId);
  if(state.statementCustomerId)return renderAccountDetailPage(state.statementCustomerId);
  const all=[...db.customers].filter(isCustomerAccount);
  const activeAll=all.filter(c=>c.active!==false),inactiveAll=all.filter(c=>c.active===false);
  const debtCount=activeAll.filter(c=>customerBalance(c.id)>0).length,clearCount=activeAll.filter(c=>customerBalance(c.id)===0).length,creditCount=activeAll.filter(c=>customerBalance(c.id)<0).length;
  const filterKey=state.accountFilter==='inactive'?'inactive':(state.accountBalanceFilter||'all');
  let rows=[...(filterKey==='inactive'?inactiveAll:activeAll)];
  if(filterKey==='debt')rows=rows.filter(c=>customerBalance(c.id)>0);if(filterKey==='clear')rows=rows.filter(c=>customerBalance(c.id)===0);if(filterKey==='credit')rows=rows.filter(c=>customerBalance(c.id)<0);
  const sort=state.accountSort||'name';rows.sort((a,b)=>sort==='recent'?String(lastAccountActivity(b.id)||'').localeCompare(String(lastAccountActivity(a.id)||'')):sort==='balance'?customerBalance(b.id)-customerBalance(a.id):String(a.name||'').localeCompare(String(b.name||''),'fa'));

h)?' style="display:none"':'';const first=String(c.name||'؟').trim().slice(0,1)||'؟';const cls=bal>0?'debt':bal<0?'credit':'clear';return `<div class="acc-lite-card ${cls}" data-search="${e(search)}" onclick="showStatement('${c.id}')"${hidden}><button class="acc-lite-avatar" style="${avatarStyle(c.name)}" onclick="showStatement('${c.id}')">${e(first)}</button><div class="acc-lite-main"><button class="acc-lite-name" onclick="showStatement('${c.id}')">${e(c.name)}</button><div class="acc-lite-meta"><span>${e(c.phone||'بدون شماره')}</span></div>${lastAccountActivity(c.id)?`<div class="acc-lite-sub">آخرین معامله: ${formatDate(lastAccountActivity(c.id))}</div>`:''}${c.address?`<div class="acc-lite-sub">${e(c.address)}</div>`:''}</div><div class="acc-lite-balance ${cls}">${accountBalanceDisplayHtml(bal)}</div><button type="button" class="acc-lite-more" onclick="openAccountActions(event,'${c.id}')" title="گزینه‌ها" aria-label="گزینه‌ها">${iconSvg('moreVertical')}</button></div>`}).join(''):'<div class="acc-lite-empty">هیچ مشتری در این بخش نیست.</div>'}</div>${state.accountActionId?renderAccountMiniMenu(state.accountActionId):''}<button class="acc-floating-add" onclick="openAddAccountPanel()" title="مشتری جدید" aria-label="مشتری جدید"><span class="sr-only">مشتری جدید</span></button></div>`
}
function saveCustomerForm(ev){ev.preventDefault();const name=document.getElementById('custName').value.trim();if(!name)return toast('نام حساب ضروری است.','bad');if(db.customers.some(c=>c.id!==state.customerEditId&&c.name.trim()===name))return toast('این نام قبلاً ثبت شده است.','bad');const data={name,type:'customer',phone:document.getElementById('custPhone').value.trim(),address:document.getElementById('custAddress').value.trim(),creditLimit:toNum(document.getElementById('custCreditLimit')?.value||0),note:document.getElementById('custNote').value.trim()};if(state.customerEditId){const c=customerById(state.customerEditId),before=auditClone(c);Object.assign(c,data);addAuditLog('update','customer',{id:c.id,title:c.name,before,after:c,note:'ویرایش حساب مشتری'});state.customerEditId=null}else{const c={id:uid(),...data,createdAt:nowISOTime()};db.customers.push(c);addAuditLog('create','customer',{id:c.id,title:c.name,after:c,note:'ایجاد حساب مشتری'})}state.accountAddMode=false;state.accountActionId=null;saveDB(false);toast('حساب ذخیره شد.');render()}
function openAccountEdit(ev,id){if(ev){ev.preventDefault();ev.stopPropagation()}state.view='customers';state.accountAddMode=false;state.statementCustomerId=null;state.editSaleId=null;state.returnSaleId=null;state.accountSaleCart=[];state.customerEditId=id;pushAppHistory({view:'customers',customerEditId:id},'#customers/edit/'+id);render();setTimeout(()=>{try{window.scrollTo({top:0,behavior:'smooth'})}catch(e){window.scrollTo(0,0)}},30)}
function editCustomer(id){openAccountEdit(null,id)}
function deleteCustomer(id){if(!requireDeletePin('حذف حساب'))return;const c=customerById(id);if(!c)return;const has=db.sales.some(s=>s.customerId===id)||db.purchases.some(p=>p.supplierId===id)||db.payments.some(p=>p.customerId===id)||(db.supplierPayments||[]).some(p=>p.supplierId===id)||(db.expenses||[]).some(x=>x.accountId===id);if(has)return toast('این حساب معامله دارد؛ برای جلوگیری از ازبین‌رفتن اطلاعات، فقط غیرفعال کنید یا از منوی حساب حذف کامل را با بررسی انجام دهید.','bad');createInternalBackup('beforeDeleteEmptyAccount');if(confirm('این حساب بدون معامله حذف شود؟')){addAuditLog('delete','customer',{id:c.id,title:c.name,before:c,note:'حذف حساب بدون معامله'});db.customers=db.customers.filter(c=>c.id!==id);saveDB(false);toast('حساب حذف شد.','warn');render()}}
function savePayment(){const date=solarToIso(document.getElementById('payDate').value),cid=document.getElementById('payCustomer').value,amount=toNum(document.getElementById('payAmount').value);if(!date)return toast('تاریخ صحیح نیست.','bad');if(!cid)return toast('مشتری انتخاب نشده است.','bad');if(amount<=0)return toast('مبلغ دریافت صحیح نیست.','bad');const bal=Math.max(0,customerBalance(cid));if(amount>bal&&bal>0&&!confirm('مبلغ دریافت از بدهی فعلی بیشتر است و اضافه آن پیش‌پرداخت می‌شود. ادامه می‌دهید؟'))return;const pay={id:uid(),date,customerId:cid,amount,method:document.getElementById('payMethod').value,note:document.getElementById('payNote').value.trim(),operator:currentOperator(),createdAt:nowISOTime()};db.payments.push(pay);addAuditLog('create','payment',{id:pay.id,title:(customerById(cid)?.name||'')+' - '+money(amount),after:pay,note:'دریافت از مشتری'});saveDB(false);toast('دریافت مشتری ثبت شد.');render()}
function renderPaymentsHistory(){const list=[...db.payments].sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt)).slice(0,20);if(!list.length)return '<div class="empty">هنوز دریافت مشتری ثبت نشده است.</div>';return `<div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>مشتری</th><th>مبلغ</th><th>روش</th><th>عملیات</th></tr></thead><tbody>${list.map(p=>{const c=customerById(p.customerId);return `<tr><td>${formatDate(p.date)}</td><td>${e(c?c.name:'-')}</td><td>${money(p.amount)}</td><td>${e(p.method||'-')}</td><td><button class="btn smallbtn bad" onclick="deletePayment('${p.id}')">حذف</button></td></tr>`}).join('')}</tbody></table></div>`}
function deletePayment(id){if(!requireDeletePin('حذف دریافت مشتری'))return;const pay=db.payments.find(p=>p.id===id);if(!pay)return toast('دریافت یافت نشد.','bad');createInternalBackup('beforeDeletePayment');if(!confirm('دریافت حذف شود؟ مانده حساب مشتری دوباره محاسبه می‌شود.'))return;addAuditLog('delete','payment',{id:pay.id,title:(customerById(pay.customerId)?.name||'')+' - '+money(pay.amount),before:pay,note:'حذف دریافت مشتری'});db.payments=db.payments.filter(p=>p.id!==id);saveDB(false);toast('دریافت حذف شد و مانده حساب اصلاح گردید.','warn');render()}
function saveSupplierPayment(){const date=solarToIso(document.getElementById('supPayDate').value),sid=document.getElementById('supPaySupplier').value,amount=toNum(document.getElementById('supPayAmount').value);if(!date)return toast('تاریخ صحیح نیست.','bad');if(!sid)return toast('فروشنده انتخاب نشده است.','bad');if(amount<=0)return toast('مبلغ پرداخت صحیح نیست.','bad');const pay={id:uid(),date,supplierId:sid,amount,method:document.getElementById('supPayMethod').value,note:document.getElementById('supPayNote').value.trim(),createdAt:nowISOTime()};db.supplierPayments.push(pay);addAuditLog('create','supplierPayment',{id:pay.id,title:(customerById(sid)?.name||'')+' - '+money(amount),after:pay,note:'پرداخت به فروشنده'});saveDB(false);toast('پرداخت به فروشنده ثبت شد.');render()}
function renderSupplierPaymentsHistory(){const list=[...(db.supplierPayments||[])].sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt)).slice(0,20);if(!list.length)return '<div class="empty">هنوز پرداخت فروشنده ثبت نشده است.</div>';return `<div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>فروشنده</th><th>مبلغ</th><th>روش</th><th>عملیات</th></tr></thead><tbody>${list.map(p=>{const c=customerById(p.supplierId);return `<tr><td>${formatDate(p.date)}</td><td>${e(c?c.name:'-')}</td><td>${money(p.amount)}</td><td>${e(p.method||'-')}</td><td><button class="btn smallbtn bad" onclick="deleteSupplierPayment('${p.id}')">حذف</button></td></tr>`}).join('')}</tbody></table></div>`}
function deleteSupplierPayment(id){if(!requireDeletePin('حذف پرداخت فروشنده'))return;createInternalBackup('beforeDeletePayment');if(!confirm('پرداخت فروشنده حذف شود؟'))return;db.supplierPayments=db.supplierPayments.filter(p=>p.id!==id);saveDB(false);toast('پرداخت فروشنده حذف شد.','warn');render()}
function saveExpense(){const date=solarToIso(document.getElementById('expenseDate').value),aid=document.getElementById('expenseAccount').value,amount=toNum(document.getElementById('expenseAmount').value);if(!date)return toast('تاریخ مصرف صحیح نیست.','bad');if(!aid)return toast('نوع مصرف انتخاب نشده است. اول یک حساب از نوع مصرف / خرج بسازید.','bad');if(amount<=0)return toast('مبلغ مصرف صحیح نیست.','bad');db.expenses.push({id:uid(),date,accountId:aid,amount,method:document.getElementById('expenseMethod').value,note:document.getElementById('expenseNote').value.trim(),createdAt:nowISOTime()});saveDB(false);toast('مصرف ثبت شد.');render()}
function renderExpenseHistory(id=null){const list=[...(db.expenses||[])].filter(x=>!id||x.accountId===id).sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt)).slice(0,30);if(!list.length)return '<div class="empty">هنوز مصرف ثبت نشده است.</div>';return `<div class="payment-list">${list.map(x=>{const c=customerById(x.accountId);return `<div class="payment-row"><div><b>${money(x.amount)}</b><div class="meta">${formatDate(x.date)} — ${e(c?c.name:'مصرف')} — ${e(x.method||'')}</div></div><span class="muted small">${e(x.note||'')}</span></div>`}).join('')}</div>`}
function showStatement(id){state.view='customers';state.customerEditId=null;state.accountAddMode=false;state.statementCustomerId=id;state.editSaleId=null;state.returnSaleId=null;state.accountProfileTab='history';pushAppHistory({view:'customers',statementCustomerId:id},'#customers/'+id);render();setTimeout(()=>document.getElementById('statementPanel')?.scrollIntoView({behavior:'smooth'}),50)}
function accountLedger(id){let rows=[];db.sales.filter(s=>s.customerId===id).forEach(s=>rows.push({date:s.date,createdAt:s.createdAt,desc:'فروش فاکتور '+s.invoiceNo,recIn:s.total,recOut:s.paid,payIn:0,payOut:0,note:'مانده فاکتور: '+money(Math.max(0,toNum(s.total)-toNum(s.paid)))}));db.payments.filter(p=>p.customerId===id).forEach(p=>rows.push({date:p.date,createdAt:p.createdAt,desc:'دریافت از مشتری',recIn:0,recOut:p.amount,payIn:0,payOut:0,note:p.method||''}));db.purchases.filter(p=>p.supplierId===id).forEach(p=>rows.push({date:p.date,createdAt:p.createdAt,desc:'ورود کالا / خرید رسید '+(p.receiptNo||''),recIn:0,recOut:0,payIn:p.total,payOut:p.paid,note:'مانده ما: '+money(Math.max(0,toNum(p.total)-toNum(p.paid)))}));(db.supplierPayments||[]).filter(p=>p.supplierId===id).forEach(p=>rows.push({date:p.date,createdAt:p.createdAt,desc:'پرداخت به فروشنده',recIn:0,recOut:0,payIn:0,payOut:p.amount,note:p.method||''}));(db.expenses||[]).filter(x=>x.accountId===id).forEach(x=>rows.push({date:x.date,createdAt:x.createdAt,desc:'مصرف / خرج',recIn:0,recOut:0,payIn:x.amount,payOut:0,note:x.note||x.method||''}));rows.sort((a,b)=>(a.date+a.createdAt).localeCompare(b.date+b.createdAt));let rec=0,pay=0;return rows.map(r=>{rec=round2(rec+toNum(r.recIn)-toNum(r.recOut));pay=round2(pay+toNum(r.payIn)-toNum(r.payOut));return{...r,recBalance:rec,payBalance:pay,net:round2(rec-pay)}})}
function openAccountActions(ev,id){if(ev){ev.preventDefault();ev.stopPropagation()}state.view='customers';state.accountAddMode=false;state.statementCustomerId=null;state.customerEditId=null;state.accountActionId=id;render()}
function customerStatementText(id){const c=customerById(id);if(!c)return'';const sales=[...db.sales.filter(s=>s.customerId===id)].sort((a,b)=>(a.date+a.createdAt).localeCompare(b.date+b.createdAt));const pays=[...db.payments.filter(p=>p.customerId===id)].sort((a,b)=>(a.date+a.createdAt).localeCompare(b.date+b.createdAt));const totalSales=sales.reduce((a,s)=>a+toNum(s.total),0),paidInBills=sales.reduce((a,s)=>a+toNum(s.paid),0),extraPaid=pays.reduce((a,p)=>a+toNum(p.amount),0),bal=customerBalance(id);let lines=[];lines.push(db.settings.shopName||'فروشگاه هم‌گام');lines.push('صورت حساب مشتری');lines.push('----------------');lines.push('نام: '+c.name);if(c.phone)lines.push('شماره: '+c.phone);if(c.address)lines.push('آدرس: '+c.address);lines.push('تاریخ: '+formatDate(todayIso()));lines.push('');lines.push('مجموع خرید: '+money(totalSales));lines.push('پرداخت داخل فاکتورها: '+money(paidInBills));lines.push('آوردگی/پرداخت جداگانه: '+money(extraPaid));lines.push(bal>0?'مانده مشتری: '+money(bal):bal<0?'مطالبات مشتری از ما: '+money(Math.abs(bal)):'حساب صاف است');if(sales.length){lines.push('');lines.push('فاکتورها:');sales.slice(-15).forEach(s=>{const due=Math.max(0,toNum(s.total)-toNum(s.paid));const items=(s.items||[]).map(i=>fullProductNameFrom(i.category,i.productName)+' '+qty(i.qty)+' '+(i.unit||'')).join('، ');lines.push(`${formatDate(s.date)} | فاکتور ${s.invoiceNo||''} | ${items} | مجموع ${money(s.total)} | رسید ${money(s.paid)} | مانده ${money(due)}`)});if(sales.length>15)lines.push(`... و ${fmt(sales.length-15)} فاکتور دیگر`)}if(pays.length){lines.push('');lines.push('آوردگی‌ها:');pays.slice(-10).forEach(p=>lines.push(`${formatDate(p.date)} | ${money(p.amount)} | ${p.method||''} ${p.note?'- '+p.note:''}`));if(pays.length>10)lines.push(`... و ${fmt(pays.length-10)} پرداخت دیگر`)}lines.push('----------------');lines.push('تشکر');return lines.join('\n')}
function balanceMessage(id){return customerStatementText(id)}
function shareBalance(id){const msg=customerStatementText(id);if(navigator.share){navigator.share({text:msg}).catch(()=>{})}else{navigator.clipboard?.writeText(msg);alert('صورت حساب کپی شد یا در پیام زیر نمایش داده می‌شود:\n\n'+msg)}}
function whatsappBalance(id){const c=customerById(id);const text=customerStatementText(id);try{navigator.clipboard?.writeText(text)}catch(e){}const msg=encodeURIComponent(text);let phone=customerWhatsappPhone(c);const url=phone?`https://wa.me/${phone}?text=${msg}`:`whatsapp://send?text=${msg}`;try{window.open(url,'_blank');toast('صورت‌حساب برای واتساپ آماده شد.','good')}catch(err){alert(text)}}
function customerWhatsappPhone(c){let phone=englishDigits(c?.phone||'').replace(/\D/g,'');if(phone&&phone.startsWith('0'))phone='93'+phone.slice(1);return phone}
function customerDebtReminderText(id){const c=customerById(id);if(!c)return'';const bal=Math.max(0,customerBalance(id));const shop=db.settings.shopName||'فروشگاه هم‌گام';const template=db.settings.debtReminderTemplate||defaultDebtReminderTemplate();return toEnglishDigitsText(template).replaceAll('{shop}',shop).replaceAll('{customer}',c.name||'').replaceAll('{amount}',money(bal)).replaceAll('{فروشگاه}',shop).replaceAll('{مشتری}',c.name||'').replaceAll('{مبلغ}',money(bal))}
function whatsappDebtReminder(id){const c=customerById(id);if(!c)return toast('حساب مشتری یافت نشد.','bad');const bal=Math.max(0,customerBalance(id));if(bal<=0)return toast('این مشتری فعلاً بدهی ندارد.','warn');const phone=customerWhatsappPhone(c);if(!phone){toast('شماره تماس مشتری ثبت نشده است؛ از ویرایش حساب شماره را تکمیل کنید.','bad');return}const text=customerDebtReminderText(id);const msg=encodeURIComponent(text);const url=`https://wa.me/${phone}?text=${msg}`;try{window.open(url,'_blank');toast('یادآوری بدهی در واتساپ آماده شد.','good')}catch(err){toast('باز کردن واتساپ ممکن نشد.','bad')}}
function downloadCustomerStatement(id){const c=customerById(id);downloadFile('statement-'+(c?c.name:'customer')+'-'+todayIso()+'.txt',customerStatementText(id),'text/plain;charset=utf-8')}
function deactivateAccount(id){const c=customerById(id);if(!c)return;if(confirm('این حساب غیرفعال شود؟')){const before=auditClone(c);c.active=false;addAuditLog('deactivate','customer',{id:c.id,title:c.name,before,after:c,note:'غیرفعال کردن حساب'});state.accountActionId=null;saveDB(false);toast('حساب غیرفعال شد.','warn');render()}}
function activateAccount(id){const c=customerById(id);if(!c)return;const before=auditClone(c);c.active=true;addAuditLog('activate','customer',{id:c.id,title:c.name,before,after:c,note:'فعال کردن حساب'});state.accountActionId=null;saveDB(false);toast('حساب فعال شد.','good');render()}
function deleteAccountFull(id){
  if(!requireDeletePin('حذف حساب مشتری'))return;
  const c=customerById(id);if(!c)return;
  const supplierRefs=db.purchases.some(p=>p.supplierId===id)||(db.supplierPayments||[]).some(p=>p.supplierId===id)||(db.expenses||[]).some(x=>x.accountId===id);
  if(supplierRefs)return toast('این حساب خرید/فروشنده یا مصرف دارد؛ حذف کامل برای جلوگیری از خرابی گزارش‌ها بسته شد. اگر لازم است، حساب را غیرفعال کنید.','bad');
  const sales=db.sales.filter(s=>s.customerId===id),payments=db.payments.filter(p=>p.customerId===id);
  if(!confirm(`حساب ${c.name} حذف شود؟\nفاکتورهای مشتری: ${sales.length}\nدریافت‌ها: ${payments.length}`))return;
  if(!confirm('این کار حساب و معاملات مشتری را حذف می‌کند و موجودی فاکتورها به انبار برمی‌گردد. بکاپ داخلی ساخته می‌شود. مطمئن هستید؟'))return;
  createInternalBackup('beforeDeleteAccount');
  sales.forEach(s=>{(s.items||[]).filter(i=>i.productId).forEach(i=>{const p=productById(i.productId);if(p){p.stock=round2(toNum(p.stock)+toNum(i.qty));addStockMove({...productSnapshot(i.productId,i),date:todayIso(),type:'sale_delete_return',qtyIn:i.qty,refType:'sale',refId:s.id,refNo:s.invoiceNo||'',party:s.customerName||c.name,note:'حذف حساب و برگشت فاکتور به انبار',balanceAfter:p.stock})}});pushTrash('sales',s);addAuditLog('delete','sale',{id:s.id,title:'فاکتور '+(s.invoiceNo||'')+' - '+(s.customerName||''),before:s,note:'حذف همراه حساب مشتری'})});
  payments.forEach(p=>addAuditLog('delete','payment',{id:p.id,title:c.name+' - '+money(p.amount),before:p,note:'حذف دریافت همراه حساب مشتری'}));
  addAuditLog('delete','customer',{id:c.id,title:c.name,before:c,note:`حذف حساب و ${sales.length} فاکتور / ${payments.length} دریافت`});
  db.sales=db.sales.filter(s=>s.customerId!==id);renumberSales();db.payments=db.payments.filter(p=>p.customerId!==id);db.customers=db.customers.filter(c=>c.id!==id);state.accountActionId=null;state.statementCustomerId=null;saveDB(false);toast('حساب حذف شد؛ فاکتورها به سطل حذف رفت و موجودی اصلاح شد.','warn');render()
}
function renderAccountActionPage(id){const c=customerById(id);if(!c)return '<div class="empty">حساب یافت نشد.</div>';return `<div class="account-action-page"><div class="account-edit-head"><div><h3>گزینه‌های حساب</h3><p>${e(c.name)} — مدیریت حساب مشتری</p></div><button class="btn smallbtn back-btn" onclick="state.accountActionId=null;render()">برگشت</button></div><div class="action-big-card"><div class="action-list-buttons"><button class="action-option" onclick="state.accountActionId=null;showStatement('${id}')"><span>${iconSvg('eye')}</span>دیدن پروفایل حساب</button><button class="action-option" onclick="state.accountActionId=null;editCustomer('${id}')"><span>${iconSvg('pencil')}</span>ویرایش حساب</button><button class="action-option danger" onclick="deleteAccountFull('${id}')"><span>${iconSvg('trash')}</span>حذف حساب</button><button class="action-option" onclick="${c.active===false?`activateAccount('${id}')`:`deactivateAccount('${id}')`}"><span>${iconSvg('pause')}</span>${c.active===false?'فعال کردن حساب':'غیرفعال کردن حساب'}</button><button class="action-option" onclick="shareBalance('${id}')"><span>${iconSvg('share')}</span>اشتراک صورت حساب</button><button class="action-option" onclick="whatsappBalance('${id}')"><span>${iconSvg('chat')}</span>واتساپ حساب</button></div></div></div>`}
function renderAccountAddPage(){return `<div class="account-edit-page"><div class="account-edit-head"><div><h3>افزودن حساب جدید</h3><p>اطلاعات مشتری یا فروشنده را وارد کنید و ذخیره نمایید.</p></div><button class="btn smallbtn back-btn" onclick="state.accountAddMode=false;render()">برگشت به لیست</button></div><div class="account-edit-card"><form onsubmit="saveCustomerForm(event)"><div class="form-grid two"><div class="field"><label>نام شخص/شرکت</label><input id="custName" required value=""></div><div class="field"><label>نوع حساب</label><select id="custType"><option value="customer" selected>مشتری</option></select></div><div class="field"><label>شماره تماس</label><input id="custPhone" value=""></div><div class="field"><label>آدرس</label><input id="custAddress" value=""></div><div class="field"><label>حد اعتبار</label><input id="custCreditLimit" inputmode="decimal" value="0" placeholder="اختیاری"></div><div class="field" style="grid-column:1/-1"><label>یادداشت / دیتا</label><input id="custNote" value=""></div></div><div class="toolbar" style="margin-top:12px"><button class="btn good" type="submit">ذخیره حساب</button><button class="btn ghost" type="button" onclick="state.accountAddMode=false;render()">انصراف</button></div></form></div></div>`}
function renderAccountEditPage(id){const c=customerById(id);if(!c)return '<div class="empty">حساب یافت نشد.</div>';return `<div class="account-edit-page"><div class="account-edit-head"><div><h3>ویرایش حساب</h3><p>${e(c.name)} — هر اطلاعات مشتری/حساب را از همین صفحه تغییر دهید.</p></div><button class="btn smallbtn back-btn" onclick="state.customerEditId=null;render()">برگشت به لیست</button></div><div class="account-edit-card"><form onsubmit="saveCustomerForm(event)"><div class="form-grid two"><div class="field"><label>نام شخص/شرکت</label><input id="custName" required value="${e(c.name||'')}"></div><div class="field"><label>نوع حساب</label><select id="custType"><option value="customer" selected>مشتری</option></select></div><div class="field"><label>شماره تماس</label><input id="custPhone" value="${e(c.phone||'')}"></div><div class="field"><label>آدرس</label><input id="custAddress" value="${e(c.address||'')}"></div><div class="field"><label>حد اعتبار</label><input id="custCreditLimit" inputmode="decimal" value="${e(c.creditLimit||0)}"></div><div class="field" style="grid-column:1/-1"><label>یادداشت / دیتا</label><input id="custNote" value="${e(c.note||'')}"></div></div><div class="toolbar" style="margin-top:12px"><button class="btn good" type="submit">ذخیره تغییرات</button><button class="btn ghost" type="button" onclick="state.customerEditId=null;render()">انصراف</button></div></form></div></div>`}
function ensureAccountSaleState(customerId){if(!state.accountSale||state.accountSale.customerId!==customerId){state.accountSale={customerId,date:solarToday(),category:categories()[0]||'',discount:'0',paid:'0',method:'نقد',note:''};state.accountSaleCart=[]}}
function accountSaleTotal(){return round2((state.accountSaleCart||[]).reduce((a,i)=>a+toNum(i.total??(toNum(i.qty)*toNum(i.price))),0))}
function captureAccountSale(){if(!state.accountSale)return;['accSaleDate','accSaleCategory','accSaleDiscount','accSalePaid','accSaleMethod','accSaleNote'].forEach(id=>{const el=document.getElementById(id);if(!el)return;const k={accSaleDate:'date',accSaleCategory:'category',accSaleDiscount:'discount',accSalePaid:'paid',accSaleMethod:'method',accSaleNote:'note'}[id];state.accountSale[k]=el.value})}
function fillAccountSalePrice(){const p=productById(document.getElementById('accSaleProduct')?.value);if(p)document.getElementById('accSalePrice').value=p.sellPrice||''}
function refreshAccountProductSelect(){const cat=document.getElementById('accSaleCategory')?.value||'';const sel=document.getElementById('accSaleProduct');if(sel)sel.innerHTML=productOptions('',cat);fillAccountSalePrice()}
function fillAccountSaleProductInfo(){
  const item=document.getElementById('accSaleItem'),unit=document.getElementById('accSaleUnit'),price=document.getElementById('accSalePrice');
  const p=findProductByText(item?.value||'');
  if(p){
    if(unit&&!unit.value)unit.value=p.unit||'';
    if(price&&!price.value&&toNum(p.sellPrice)>0)price.value=p.sellPrice;
  }
  updateAccSaleTotalFromUnit(false)
}
function updateAccSaleTotalFromUnit(force=true){
  const q=toNum(document.getElementById('accSaleQty')?.value||0),pr=toNum(document.getElementById('accSalePrice')?.value||0),tot=document.getElementById('accSaleTotal');
  if(tot&&q>0&&pr>0&&(force||!tot.value))tot.value=round2(q*pr)
}
function buildAccountSaleLineFromInputs(){
  const itemText=(document.getElementById('accSaleItem')?.value||'').trim();
  let q=toNum(document.getElementById('accSaleQty')?.value||0),unitText=(document.getElementById('accSaleUnit')?.value||'').trim(),price=toNum(document.getElementById('accSalePrice')?.value||0),lineTotal=toNum(document.getElementById('accSaleTotal')?.value||0);
  if(!itemText&&!q&&!price&&!lineTotal)return null;
  if(!itemText){toast('نام کالا یا شرح فروش را وارد کنید.','bad');return false}
  if(q<=0)q=1;
  if(lineTotal<=0&&price>0)lineTotal=round2(q*price);
  if(lineTotal>0&&price<=0)price=round2(lineTotal/q);
  if(lineTotal<=0){toast('مجموع فروش یا قیمت فی واحد را وارد کنید.','bad');return false}
  if(price<0||q<=0){toast('مقدار یا قیمت صحیح نیست.','bad');return false}
  const match=findProductByText(itemText);
  if(match){
    if(!unitText)unitText=match.unit||'';
    if(!db.settings.allowNegativeStock&&toNum(match.stock)<q){toast('موجودی '+match.name+' کافی نیست.','bad');return false}
    return {productId:match.id,category:productCategory(match),productName:match.name,unit:unitText,qty:q,price:price,cost:toNum(match.buyPrice),total:lineTotal,custom:false}
  }
  return {productId:null,category:'',productName:itemText,unit:unitText,qty:q,price:price,cost:0,total:lineTotal,custom:true}
}
function clearAccountSaleInputs(){['accSaleItem','accSaleUnit','accSalePrice','accSaleTotal'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=''});const q=document.getElementById('accSaleQty');if(q)q.value='1'}
function addAccountSaleLine(customerId){ensureAccountSaleState(customerId);captureAccountSale();const line=buildAccountSaleLineFromInputs();if(!line)return;state.accountSaleCart.push(line);clearAccountSaleInputs();render()}
function removeAccountSaleLine(idx){captureAccountSale();state.accountSaleCart.splice(idx,1);render()}

function invoiceItemsText(items){return (items||[]).map(i=>{const title=e(fullProductNameFrom(i.category,i.productName));const retQty=toNum(i.returnedQty||0),retAmount=toNum(i.returnedAmount||0);const ret=retQty||retAmount?` <span class="muted small">(برگشت: ${retQty?qty(retQty)+' '+e(i.unit||''):''}${retQty&&retAmount?' / ':''}${retAmount?money(retAmount):''})</span>`:'';const line=`${qty(i.qty||1)} ${e(i.unit||'')} × ${money(i.price||0)} = ${money(i.total??(toNum(i.qty)*toNum(i.price)))}`;return `${i.custom?e(i.productName):title} — ${line}${ret}`}).join('<br>')||'-'}
