function saleLineReturnedQty(s,idx){const item=(s.items||[])[idx]||{};const fromItem=toNum(item.returnedQty||0);if(fromItem)return fromItem;return (s.returns||[]).reduce((a,r)=>a+(r.items||[]).filter(x=>toNum(x.lineIndex)===idx).reduce((b,x)=>b+toNum(x.qty),0),0)}

function registerSaleReturn(id){
  const s=db.sales.find(x=>x.id===id);if(!s)return toast('فاکتور یافت نشد.','bad');
  const date=solarToIso(document.getElementById('returnSaleDate_'+id)?.value||solarToday());if(!date)return toast('تاریخ برگشت صحیح نیست.','bad');
  const note=(document.getElementById('returnSaleNote_'+id)?.value||'').trim();
  const items=[];let grossAmount=0,invalid='';
  (s.items||[]).forEach((i,idx)=>{const qRaw=document.getElementById('returnQty_'+id+'_'+idx),aRaw=document.getElementById('returnAmount_'+id+'_'+idx);if(!qRaw&&!aRaw)return;let q=toNum(qRaw?.value||0),amount=toNum(aRaw?.value||0);const oq=saleLineOriginalQty(s,idx),oa=saleLineOriginalAmount(s,idx),rq=saleLineReturnedQty(s,idx),ra=saleLineReturnedAmount(s,idx),remQty=Math.max(0,round2(oq-rq)),remAmount=Math.max(0,round2(oa-ra));if(q<0||amount<0){invalid='مقدار یا مبلغ برگشت منفی نمی‌تواند باشد.';return}if(!q&&!amount)return;if(q>remQty+0.0001){invalid='مقدار برگشت از مقدار فروخته‌شده بیشتر است: '+fullProductNameFrom(i.category,i.productName);return}if(amount<=0&&q>0){amount=remQty>0?round2(remAmount*(q/remQty)):remAmount}if(amount>remAmount+0.0001){invalid='مبلغ برگشت از مبلغ باقی‌مانده بیشتر است: '+fullProductNameFrom(i.category,i.productName);return}if(!q&&amount>0&&remQty>0&&!i.productId)q=round2(Math.min(remQty,remQty*(amount/remAmount)));items.push({lineIndex:idx,productId:i.productId||null,category:i.category||'',productName:i.productName||'',unit:i.unit||'',qty:round2(q),amount:round2(amount)});grossAmount=round2(grossAmount+amount)});
  if(invalid)return toast(invalid,'bad');
  if(!items.length)return toast('هیچ مقدار یا مبلغی برای برگشت وارد نشده است.','bad');
  if(!confirm('برگشت ثبت شود؟ موجودی کالاهای ثبت‌شده اضافه و حساب مشتری اصلاح می‌شود.'))return;
  createInternalBackup('beforeSaleReturn');
  const beforeSale=auditClone(s),beforeTotal=toNum(s.total);
  (s.items||[]).forEach((i,idx)=>{if(i.originalQty===undefined)i.originalQty=toNum(i.qty);if(i.originalTotal===undefined)i.originalTotal=toNum(i.total);if(i.originalPrice===undefined)i.originalPrice=toNum(i.price)});
  items.forEach(r=>{const i=s.items[r.lineIndex];if(!i)return;i.returnedQty=round2(toNum(i.returnedQty||0)+toNum(r.qty));i.returnedAmount=round2(toNum(i.returnedAmount||0)+toNum(r.amount));i.qty=Math.max(0,round2(toNum(i.originalQty)-toNum(i.returnedQty)));i.total=Math.max(0,round2(toNum(i.originalTotal)-toNum(i.returnedAmount)));i.price=i.qty>0?round2(toNum(i.total)/toNum(i.qty)):toNum(i.originalPrice||i.price||0);if(r.productId&&toNum(r.qty)>0){const p=productById(r.productId);if(p){p.stock=round2(toNum(p.stock)+toNum(r.qty));addStockMove({...productSnapshot(r.productId,r),date,type:'sale_return_in',qtyIn:r.qty,refType:'sale_return',refId:s.id,refNo:s.invoiceNo||'',party:s.customerName||'',note:note||'برگشت کالا از مشتری',balanceAfter:p.stock})}}});
  const subtotal=round2((s.items||[]).reduce((a,i)=>a+toNum(i.total),0));
  const discount=Math.min(toNum(s.discount||0),subtotal);
  const total=round2(subtotal-discount);
  const netReturn=round2(beforeTotal-total);
  const ret={id:uid(),date,operator:currentOperator(),createdAt:nowISOTime(),items,amount:netReturn>0?netReturn:grossAmount,grossAmount,note};
  s.returns=s.returns||[];s.returns.push(ret);s.subtotal=subtotal;s.discount=discount;s.total=total;s.due=round2(total-toNum(s.paid));s.returnTotal=round2(toNum(s.returnTotal||0)+toNum(ret.amount));s.costTotal=round2((s.items||[]).reduce((a,i)=>a+toNum(i.qty)*toNum(i.cost),0));
  addAuditLog('update','sale',{id:s.id,title:'برگشت فاکتور '+(s.invoiceNo||'')+' - '+(s.customerName||''),before:beforeSale,after:s,note:'ثبت برگشت کالا'});
  state.returnSaleId=null;state.editSaleId=null;saveDB(false);toast('برگشت ثبت شد؛ انبار و حساب مشتری اصلاح گردید.','good');render()
}

function saleCostForProfit(s){

}

function applyReport(ev){if(ev&&ev.preventDefault)ev.preventDefault();const rs=document.getElementById('repStart'),re=document.getElementById('repEnd');state.reportStart=rs?rs.value.trim():state.reportStart;state.reportEnd=re?re.value.trim():state.reportEnd;const start=state.reportStart?parseReportDate(state.reportStart):null,end=state.reportEnd?parseReportDate(state.reportEnd):null;if(state.reportStart&&!start)return toast('تاریخ شروع صحیح نیست. نمونه: 1405/04/01','bad');if(state.reportEnd&&!end)return toast('تاریخ ختم صحیح نیست. نمونه: 1405/04/31','bad');if(start&&end&&start>end)return toast('تاریخ شروع از تاریخ ختم بزرگ‌تر است.','bad');toast('گزارش نمایش داده شد.','good');render()}
function setReportRange(mode){if(mode==='today'){state.reportStart=solarToday();state.reportEnd=solarToday()}else if(mode==='yesterday'){const d=new Date();d.setDate(d.getDate()-1);const iso=`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;state.reportStart=formatDate(iso);state.reportEnd=formatDate(iso)}else if(mode==='week'){const d=new Date();d.setDate(d.getDate()-6);const iso=`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;state.reportStart=formatDate(iso);state.reportEnd=solarToday()}else if(mode==='month'){const j=isoToJ(todayIso());state.reportStart=jToSolarString({jy:j.jy,jm:j.jm,jd:1});state.reportEnd=jToSolarString({jy:j.jy,jm:j.jm,jd:jMonthLen(j.jy,j.jm)})}else if(mode==='year'){const j=isoToJ(todayIso());state.reportStart=jToSolarString({jy:j.jy,jm:1,jd:1});state.reportEnd=jToSolarString({jy:j.jy,jm:12,jd:jMonthLen(j.jy,12)})}else{state.reportStart='';state.reportEnd=''}render()}

function stableDataString(obj){return JSON.stringify(obj)}
function backupChecksum(data){let str=stableDataString(data),h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16).padStart(8,'0')}

function updateSearchResults(){const inp=document.getElementById('globalSearchInput');state.globalSearch=inp?inp.value:state.globalSearch;const box=document.getElementById('searchResultsWrap');if(box){box.innerHTML=renderSearchResults(state.globalSearch||'');enhanceMobileTables()}const count=document.getElementById('searchResultCount');if(count)count.textContent=fmt(buildSearchResults(state.globalSearch||'').length)+' نتیجه'}
function renderSearch(){const q=state.globalSearch||'';const results=buildSearchResults(q);return `<div class="search-page"><div class="search-hero"><div class="search-hero-main"><div class="search-hero-icon">${iconSvg('search')}</div><div><h3>جستجوی همه پایگاه داده</h3><p>مشتری، فاکتور، جنس، ورود کالا، مصرف و حرکت انبار را یکجا پیدا کنید.</p></div></div><span class="badge info" id="searchResultCount">${fmt(results.length)} نتیجه</span></div><div class="search-box-main"><div class="global-search-input">${iconSvg('search')}<input id="globalSearchInput" placeholder="نام مشتری، شماره، شماره فاکتور، جنس، تاریخ، مبلغ..." value="${e(q)}" oninput="updateSearchResults()" onkeydown="if(event.key==='Enter')updateSearchResults()"></div></div><div id="searchResultsWrap">${renderSearchResults(q)}</div></div>`}

function duplicateCount(arr,keyFn){const seen=new Set(),dups=new Set();arr.forEach(x=>{const k=keyFn(x);if(!k)return;if(seen.has(k))dups.add(k);seen.add(k)});return dups.size}
function expectedStockByDocs(){const map={};(db.products||[]).forEach(p=>map[p.id]=0);(db.purchases||[]).forEach(p=>(p.items||[]).forEach(i=>{if(i.productId)map[i.productId]=(map[i.productId]||0)+toNum(i.qty)}));(db.sales||[]).forEach(s=>(s.items||[]).forEach((i,idx)=>{if(!i.productId)return;const returned=saleLineReturnedQty?saleLineReturnedQty(s,idx):toNum(i.returnedQty||0);const sold=i.originalQty!==undefined?toNum(i.originalQty):toNum(i.qty)+returned;map[i.productId]=(map[i.productId]||0)-Math.max(0,round2(sold-returned))}));(db.adjustments||[]).forEach(a=>{map[a.productId]=(map[a.productId]||0)+toNum(a.qtySigned)});return map}
function dbHealthReport(){
  const issues=[];
  const prodIds=new Set((db.products||[]).map(p=>p.id));
  const custIds=new Set((db.customers||[]).map(c=>c.id));
  const supplierIds=new Set((db.customers||[]).filter(isSupplierAccount).map(c=>c.id));
  const moneyClose=(a,b)=>Math.abs(round2(toNum(a)-toNum(b)))<0.01;
  const missingSaleProducts=(db.sales||[]).reduce((n,s)=>n+(s.items||[]).filter(i=>i.productId&&!prodIds.has(i.productId)).length,0);
  if(missingSaleProducts)issues.push({type:'bad',title:'فروش با جنس حذف‌شده',desc:'بعضی اقلام فروش به جنس موجود وصل نیست.',count:missingSaleProducts});
  const missingPurchaseProducts=(db.purchases||[]).reduce((n,p)=>n+(p.items||[]).filter(i=>i.productId&&!prodIds.has(i.productId)).length,0);
  if(missingPurchaseProducts)issues.push({type:'bad',title:'ورود کالا با جنس حذف‌شده',desc:'بعضی اقلام ورود کالا به جنس موجود وصل نیست.',count:missingPurchaseProducts});
  const missingCustomers=(db.sales||[]).filter(s=>s.customerId&&!custIds.has(s.customerId)).length+(db.payments||[]).filter(p=>p.customerId&&!custIds.has(p.customerId)).length;
  if(missingCustomers)issues.push({type:'warn',title:'معامله با مشتری حذف‌شده',desc:'بعضی فاکتورها یا پرداخت‌ها مشتری ندارند.',count:missingCustomers});
  const missingSuppliers=(db.purchases||[]).filter(p=>p.supplierId&&!custIds.has(p.supplierId)).length+(db.supplierPayments||[]).filter(p=>p.supplierId&&!custIds.has(p.supplierId)).length;
  if(missingSuppliers)issues.push({type:'warn',title:'معامله با فروشنده حذف‌شده',desc:'بعضی خریدها یا پرداخت‌های فروشنده حساب مرتبط ندارند.',count:missingSuppliers});
  const dupInv=duplicateCount(db.sales||[],s=>s.invoiceNo);if(dupInv)issues.push({type:'warn',title:'شماره فاکتور تکراری',desc:'شماره فاکتورهای تکراری پیدا شد.',count:dupInv});
  const dupRec=duplicateCount(db.purchases||[],p=>p.receiptNo);if(dupRec)issues.push({type:'warn',title:'شماره رسید تکراری',desc:'شماره رسیدهای ورود کالا تکراری است.',count:dupRec});
  const badSaleTotals=(db.sales||[]).filter(s=>{const itemSum=round2((s.items||[]).reduce((a,i)=>a+toNum(i.total),0));return !moneyClose(itemSum,toNum(s.subtotal||itemSum))||!moneyClose(round2(toNum(s.subtotal||itemSum)-toNum(s.discount||0)),toNum(s.total||0))}).length;
  if(badSaleTotals)issues.push({type:'bad',title:'اختلاف جمع فاکتور فروش',desc:'جمع اقلام، تخفیف یا مجموع بعضی فاکتورها هماهنگ نیست.',count:badSaleTotals});
  const badPurchaseTotals=(db.purchases||[]).filter(p=>{const itemSum=round2((p.items||[]).reduce((a,i)=>a+toNum(i.total),0));return !moneyClose(itemSum,toNum(p.total||0))}).length;
  if(badPurchaseTotals)issues.push({type:'bad',title:'اختلاف جمع رسید ورود کالا',desc:'جمع اقلام بعضی رسیدهای ورود کالا با مجموع رسید برابر نیست.',count:badPurchaseTotals});
  const overReturned=(db.sales||[]).reduce((n,s)=>n+(s.items||[]).filter((i,idx)=>saleLineReturnedQty(s,idx)>saleLineOriginalQty(s,idx)+0.0001||saleLineReturnedAmount(s,idx)>saleLineOriginalAmount(s,idx)+0.01).length,0);
  if(overReturned)issues.push({type:'bad',title:'برگشت بیشتر از فروش',desc:'در بعضی اقلام مقدار یا مبلغ برگشتی از فروش اصلی بیشتر شده است.',count:overReturned});
  const negStock=(db.products||[]).filter(p=>toNum(p.stock)<0).length;if(negStock)issues.push({type:'bad',title:'موجودی منفی',desc:'بعضی کالاها موجودی منفی دارند.',count:negStock});
  const expected=expectedStockByDocs();const stockMismatch=(db.products||[]).filter(p=>Math.abs(round2(toNum(p.stock)-toNum(expected[p.id]||0)))>0.0001).length;
  if(stockMismatch)issues.push({type:'warn',title:'اختلاف موجودی با اسناد',desc:'موجودی بعضی کالاها با فروش/ورود/اصلاحات برابر نیست.',count:stockMismatch});
  const badAmounts=[...(db.sales||[]).filter(s=>toNum(s.total)<0||toNum(s.paid)<0),...(db.purchases||[]).filter(p=>toNum(p.total)<0||toNum(p.paid)<0),...(db.payments||[]).filter(p=>toNum(p.amount)<=0),...(db.expenses||[]).filter(x=>toNum(x.amount)<=0)].length;
  if(badAmounts)issues.push({type:'bad',title:'مبلغ نامعتبر',desc:'مبلغ صفر، منفی یا نامعتبر در معاملات پیدا شد.',count:badAmounts});
  if(!(db.stockMoves||[]).length&&((db.sales||[]).length||(db.purchases||[]).length||(db.adjustments||[]).length))issues.push({type:'warn',title:'حرکت انبار ساخته نشده',desc:'تاریخچه حرکت انبار خالی است.',count:1});
  return issues
}
function dbHealthHtml(){const issues=dbHealthReport();const status=issues.some(x=>x.type==='bad')?'bad':issues.length?'warn':'good';const text=status==='good'?'سالم':status==='warn'?'نیاز به بررسی':'مشکل جدی';return `<div class="db-health"><div class="db-health-head"><h3>سلامت پایگاه داده</h3><span class="db-health-status ${status}">${text}</span></div><p class="muted small">این بخش شماره‌ها، جمع فاکتور، موجودی، برگشت کالا، پرداخت‌ها و ارتباط اسناد با مشتری/جنس را بررسی می‌کند.</p>${issues.length?`<div class="db-issue-list">${issues.map(x=>`<div class="db-issue"><div><b>${e(x.title)}</b><br><span>${e(x.desc)}</span></div><div class="count">${fmt(x.count)}</div></div>`).join('')}</div>`:'<div class="empty">مشکل مهمی یافت نشد.</div>'}<div class="db-health-actions"><button class="btn secondary" onclick="showSelfCheckReport()">تست مالی سریع</button><button class="btn secondary" onclick="repairLightDatabase()">ترمیم سبک</button><button class="btn warn" onclick="rebuildStockMovementOnly()">بازسازی حرکت انبار</button><button class="btn bad" onclick="syncStockFromDocuments()">همسان‌سازی موجودی</button></div></div>`}
function repairLightDatabase(){renumberSales();renumberPurchases();db.products.forEach(p=>{if(!p.category)p.category=p.name||'عمومی';if(p.active===undefined)p.active=true});db.customers.forEach(c=>{if(!c.type)c.type='customer';if(c.active===undefined)c.active=true});addAuditLog('update','system',{title:'ترمیم سبک پایگاه داده',note:'تنظیم شماره‌ها و ساختار پایه'});saveDB(false);toast('ترمیم سبک انجام شد.','good');render()}
function rebuildStockMovementOnly(){if(!confirm('حرکت انبار از روی اسناد فعلی بازسازی شود؟'))return;db.stockMoves=rebuildStockMoves(db);db.meta.stockMovesBuilt=true;addAuditLog('update','system',{title:'بازسازی حرکت انبار',note:'حرکت‌ها از روی فروش، ورود کالا و اصلاحات ساخته شد'});saveDB(false);toast('حرکت انبار بازسازی شد.','good');render()}
function syncStockFromDocuments(){if(!requireDeletePin('همسان‌سازی موجودی انبار'))return;createInternalBackup('beforeSyncStock');if(!confirm('موجودی کالاها از روی اسناد فروش/ورود/اصلاحات دوباره محاسبه شود؟'))return;if(!confirm('این کار موجودی فعلی انبار را تغییر می‌دهد. مطمئن هستید؟'))return;const before=auditClone(db.products);const expected=expectedStockByDocs();db.products.forEach(p=>p.stock=round2(expected[p.id]||0));db.stockMoves=rebuildStockMoves(db);db.meta.stockMovesBuilt=true;addAuditLog('update','system',{title:'همسان‌سازی موجودی',before,after:db.products,note:'موجودی از روی اسناد محاسبه شد'});saveDB(false);toast('موجودی با اسناد همسان‌سازی شد.','warn');render()}
function pushTrash(kind,record){db.trash=db.trash||{};db.trash[kind]=db.trash[kind]||[];db.trash[kind].unshift({id:uid(),deletedAt:nowISOTime(),date:todayIso(),record:auditClone(record)});if(db.trash[kind].length>100)db.trash[kind]=db.trash[kind].slice(0,100)}
function renderTrashBin(){const sales=(db.trash?.sales||[]),purchases=(db.trash?.purchases||[]);if(!sales.length&&!purchases.length)return '<div class="empty">سطل حذف خالی است.</div>';return `<div class="table-wrap"><table><thead><tr><th>نوع</th><th>شرح</th><th>تاریخ حذف</th><th>عملیات</th></tr></thead><tbody>${sales.map(t=>{const r=t.record||{};return `<tr><td>فاکتور فروش</td><td><b>${e(r.invoiceNo||'')}</b> — ${e(r.customerName||'')}<br><span class="muted small">${money(r.total||0)}</span></td><td>${formatDate(t.date)}</td><td><button class="btn smallbtn good" onclick="restoreDeletedSale('${t.id}')">بازیابی</button></td></tr>`}).join('')}${purchases.map(t=>{const r=t.record||{};return `<tr><td>ورود کالا</td><td><b>${e(r.receiptNo||'')}</b> — ${e(r.supplier||'')}<br><span class="muted small">${money(r.total||0)}</span></td><td>${formatDate(t.date)}</td><td><button class="btn smallbtn good" onclick="restoreDeletedPurchase('${t.id}')">بازیابی</button></td></tr>`}).join('')}</tbody></table></div><div class="toolbar" style="margin-top:10px"><button class="btn bad" onclick="clearTrashBin()">پاک‌سازی سطل حذف</button></div>`}
function restoreDeletedSale(tid){const t=(db.trash?.sales||[]).find(x=>x.id===tid);if(!t)return;const sale=auditClone(t.record);if(!sale)return;for(const i of (sale.items||[]).filter(x=>x.productId)){const p=productById(i.productId);if(!p)return toast('برای بازیابی فاکتور، کالا یافت نشد.','bad');if(!db.settings.allowNegativeStock&&toNum(p.stock)<toNum(i.qty))return toast('برای بازیابی فاکتور، موجودی '+(p?p.name:'جنس')+' کافی نیست.','bad')}if(!confirm('این فاکتور بازیابی شود؟ موجودی کالاها دوباره از انبار کم می‌شود.'))return;(sale.items||[]).filter(x=>x.productId).forEach(i=>{const p=productById(i.productId);if(p){p.stock=round2(toNum(p.stock)-toNum(i.qty));addStockMove({...productSnapshot(i.productId,i),date:todayIso(),type:'sale_out',qtyOut:i.qty,refType:'sale',refId:sale.id,refNo:sale.invoiceNo||'',party:sale.customerName||'',note:'بازیابی فاکتور حذف‌شده',balanceAfter:p.stock})}});if(db.sales.some(s=>s.id===sale.id))sale.id=uid();db.sales.push(sale);renumberSales();db.trash.sales=db.trash.sales.filter(x=>x.id!==tid);addAuditLog('create','sale',{id:sale.id,title:'بازیابی فاکتور '+(sale.invoiceNo||''),after:sale,note:'بازیابی از سطل حذف'});saveDB(false);toast('فاکتور بازیابی شد.','good');render()}
function restoreDeletedPurchase(tid){const t=(db.trash?.purchases||[]).find(x=>x.id===tid);if(!t)return;const pur=auditClone(t.record);if(!pur)return;if(!confirm('این رسید ورود کالا بازیابی شود؟ موجودی کالاها دوباره به انبار اضافه می‌شود.'))return;(pur.items||[]).forEach(i=>{const p=productById(i.productId);if(p){p.stock=round2(toNum(p.stock)+toNum(i.qty));addStockMove({...productSnapshot(i.productId,i),date:todayIso(),type:'purchase_in',qtyIn:i.qty,refType:'purchase',refId:pur.id,refNo:pur.receiptNo||'',party:pur.supplier||'',note:'بازیابی ورود کالا حذف‌شده',balanceAfter:p.stock})}});if(db.purchases.some(p=>p.id===pur.id))pur.id=uid();db.purchases.push(pur);renumberPurchases();db.trash.purchases=db.trash.purchases.filter(x=>x.id!==tid);addAuditLog('create','purchase',{id:pur.id,title:'بازیابی رسید '+(pur.receiptNo||''),after:pur,note:'بازیابی از سطل حذف'});saveDB(false);toast('رسید ورود کالا بازیابی شد.','good');render()}
function clearTrashBin(){if(!requireDeletePin('پاک‌سازی سطل حذف'))return;createInternalBackup('beforeClearTrash');if(!confirm('سطل حذف کاملاً خالی شود؟ بعداً بازیابی ممکن نیست.'))return;db.trash={sales:[],purchases:[],customers:[]};addAuditLog('delete','system',{title:'پاک‌سازی سطل حذف',note:'تمام موارد حذف‌شده پاک شد'});saveDB(false);toast('سطل حذف خالی شد.','warn');render()}
function xmlEscape(v){return String(v??'').replace(/[<>&"']/g,ch=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[ch]))}

function excelSheet(name,rows){return `<Worksheet ss:Name="${xmlEscape(String(name).slice(0,31))}"><Table>${rows.map(r=>`<Row>${r.map(excelCell).join('')}</Row>`).join('')}</Table></Worksheet>`}
function exportExcelXml(){const sheets=[];sheets.push(excelSheet('Customers', [['نام','تلفن','آدرس','حد اعتبار','مانده مشتری','فعال','یادداشت'],...(db.customers||[]).map(c=>[c.name,c.phone,c.address,toNum(c.creditLimit||0),customerBalance(c.id),c.active===false?'نه':'بله',c.note])]));sheets.push(excelSheet('Products', [['کالای اصلی','نوع','واحد','موجودی','حداقل هشدار','فعال'],...(db.products||[]).map(p=>[productCategory(p),p.name,p.unit,toNum(p.stock),toNum(p.minStock),p.active===false?'نه':'بله'])]));sheets.push(excelSheet('Sales', [['شماره فاکتور','تاریخ','مشتری','مجموع','پرداخت','مانده','روش','یادداشت'],...(db.sales||[]).map(s=>[s.invoiceNo,formatDate(s.date),s.customerName,toNum(s.total),toNum(s.paid),Math.max(0,toNum(s.total)-toNum(s.paid)),s.paymentMethod,s.note])]));sheets.push(excelSheet('Sale Items', [['شماره فاکتور','تاریخ','مشتری','جنس','مقدار','واحد','قیمت','جمع'],...(db.sales||[]).flatMap(s=>(s.items||[]).map(i=>[s.invoiceNo,formatDate(s.date),s.customerName,fullProductNameFrom(i.category,i.productName),toNum(i.qty),i.unit,toNum(i.price),toNum(i.total)]))]));sheets.push(excelSheet('Purchases', [['شماره رسید','تاریخ','فروشنده','مجموع','پرداخت','مانده','روش','یادداشت'],...(db.purchases||[]).map(p=>[p.receiptNo,formatDate(p.date),p.supplier,toNum(p.total),toNum(p.paid),Math.max(0,toNum(p.total)-toNum(p.paid)),p.method,p.note])]));sheets.push(excelSheet('Purchase Items', [['شماره رسید','تاریخ','فروشنده','جنس','مقدار','واحد','قیمت خرید','جمع'],...(db.purchases||[]).flatMap(p=>(p.items||[]).map(i=>[p.receiptNo,formatDate(p.date),p.supplier,fullProductNameFrom(i.category,i.productName),toNum(i.qty),i.unit,toNum(i.cost),toNum(i.total)]))]));sheets.push(excelSheet('Customer Payments', [['تاریخ','مشتری','مبلغ','روش','یادداشت'],...(db.payments||[]).map(p=>{const c=customerById(p.customerId);return[formatDate(p.date),c?c.name:'',toNum(p.amount),p.method,p.note]})]));sheets.push(excelSheet('Supplier Payments', [['تاریخ','فروشنده','مبلغ','روش','یادداشت'],...(db.supplierPayments||[]).map(p=>{const c=customerById(p.supplierId);return[formatDate(p.date),c?c.name:'',toNum(p.amount),p.method,p.note]})]));sheets.push(excelSheet('Expenses', [['تاریخ','دسته','شرح','مبلغ','روش','یادداشت'],...(db.expenses||[]).map(x=>[formatDate(x.date),x.category||'عمومی',x.description||x.note,toNum(x.amount),x.method,x.note])]));sheets.push(excelSheet('Sale Returns', [['شماره فاکتور','تاریخ','مشتری','جنس','مقدار','واحد','مبلغ','یادداشت'],...(db.sales||[]).flatMap(s=>(s.returns||[]).flatMap(r=>(r.items||[]).map(i=>[s.invoiceNo,formatDate(r.date),s.customerName,fullProductNameFrom(i.category,i.productName),toNum(i.qty),i.unit,toNum(i.amount),r.note])))]));sheets.push(excelSheet('Stock Moves', [['تاریخ','جنس','نوع حرکت','داخل','بیرون','قبل','بعد','واحد','مرجع','حساب','کاربر','یادداشت'],...(db.stockMoves||[]).map(m=>[formatDate(m.date),fullProductNameFrom(m.category,m.productName),stockMoveTypeLabel(m.type),toNum(m.qtyIn),toNum(m.qtyOut),m.balanceBefore??'',m.balanceAfter??'',m.unit,m.refNo,m.party,m.operator||'',m.note])]));sheets.push(excelSheet('Audit Logs', [['تاریخ','عمل','بخش','شرح','یادداشت'],...(db.auditLogs||[]).map(a=>[formatDate(a.date),auditActionLabel(a.action),auditEntityLabel(a.entity),a.title,a.note])]));const xml=`<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><DocumentProperties xmlns="urn:schemas-microsoft-com:office:office"><Title>Hamgam Full Export</Title><Created>${nowISOTime()}</Created></DocumentProperties><Styles><Style ss:ID="Default"><Alignment ss:Vertical="Center"/><Font ss:FontName="Tahoma" ss:Size="11"/></Style></Styles>${sheets.join('')}</Workbook>`;downloadFile('hamgam-full-export-'+todayIso()+'.xml',xml,'application/xml;charset=utf-8');toast('خروجی کامل Excel XML آماده شد.','good')}
function saveTelegramBackupSettings(){const token=(document.getElementById('tgBotToken')?.value||'').trim(),chat=(document.getElementById('tgChatId')?.value||'').trim();db.settings.telegramBotToken=token;db.settings.telegramChatId=chat;saveDB(false);toast(token&&chat?'تنظیمات بکاپ تلگرام ذخیره شد.':'تنظیمات تلگرام خالی ذخیره شد؛ بکاپ ابری غیرفعال است.','good');render()}
async function sendBackupToTelegram(){
  const token=String(db.settings.telegramBotToken||'').trim(),chat=String(db.settings.telegramChatId||'').trim();
  if(!token||!chat)return toast('برای بکاپ تلگرام، اول توکن ربات و chat id را در تنظیمات وارد و ذخیره کنید.','bad');
  if(typeof navigator!=='undefined'&&navigator.onLine===false)return toast('اینترنت وصل نیست؛ بکاپ محلی همچنان راه اصلی است.','bad');
  try{
    db.settings.lastBackupDate=todayIso();
    const pkg=makeBackupPackage(),json=JSON.stringify(pkg,null,2),name='hamgam-backup-'+todayIso()+'.json';
    const fd=new FormData();fd.append('chat_id',chat);fd.append('caption','بکاپ هم‌گام - '+formatDate(todayIso()));fd.append('document',new Blob([json],{type:'application/json'}),name);
    const res=await fetch('https://api.telegram.org/bot'+token+'/sendDocument',{method:'POST',body:fd});
    if(!res.ok){let msg='ارسال بکاپ به تلگرام ناکام شد.';try{const j=await res.json();if(j.description)msg+=' '+j.description}catch(e){}throw new Error(msg)}
    saveDB(false);toast('بکاپ به تلگرام ارسال شد. یک نسخه محلی هم همیشه نگه دارید.','good');render()
  }catch(err){console.error(err);toast((err&&err.message?err.message:'ارسال بکاپ به تلگرام ناکام شد.')+' بکاپ محلی را فراموش نکنید.','bad')}
}
function renderSettings(){
  const last=db.settings.lastBackupDate?formatDate(db.settings.lastBackupDate):'هیچ وقت';
  return `<div class="settings-v2 settings-simple"><div class="settings-hero"><div><h3>تنظیمات</h3><p>اول بکاپ و اطلاعات فروشگاه؛ ابزارهای حساس پایین‌تر و جدا نگهداری شده‌اند.</p></div><div class="settings-pill">${storageMode==='IndexedDB'?'IndexedDB آفلاین':'LocalStorage آفلاین'}</div></div><section class="settings-card settings-priority"><div class="panel-title"><div><h3>کارهای مهم</h3><span class="daily-badge">برای استفاده روزانه</span></div></div><div class="settings-shortcuts"><button class="btn secondary" onclick="exportBackup()">دانلود بکاپ کامل</button><button class="btn secondary" onclick="createInternalBackup('manual').then(()=>render())">بکاپ داخلی اکنون</button><button class="btn secondary" onclick="sendBackupToTelegram()">ارسال به تلگرام</button><label class="btn ghost">وارد کردن بکاپ <input type="file" accept="application/json" style="display:none" onchange="importBackup(this)"></label><button class="btn secondary" onclick="exportExcelXml()">خروجی کامل Excel</button></div><div class="backup-external-guide" style="margin-top:12px"><b>یادآوری بکاپ:</b> بکاپ داخلی فقط داخل همین مرورگر است. پس از دانلود، فایل را در فایل‌منیجر یا فضای ابری نگهداری کنید. <br>آخرین بکاپ: <b>${last}</b></div>${dbStatsHtml()}</section><section class="settings-card"><div class="panel-title"><div><h3>اطلاعات فروشگاه</h3><span class="daily-badge">ظاهر فاکتور و نام فروشگاه</span></div></div><form onsubmit="saveSettings(event)" id="settingsMainForm"><div class="form-grid two"><div class="field"><label>نام فروشگاه</label><input id="setShop" value="${e(db.settings.shopName||'')}"></div><div class="field"><label>نام مسئول</label><input id="setOwner" value="${e(db.settings.ownerName||'')}"></div><div class="field"><label>تلفن</label><input id="setPhone" value="${e(db.settings.phone||'')}"></div><div class="field"><label>آدرس</label><input id="setAddress" value="${e(db.settings.address||'')}"></div><div class="field"><label>حالت ظاهری</label><select id="setTheme"><option value="light" ${(db.settings.theme||'light')==='light'?'selected':''}>روشن</option><option value="dark" ${(db.settings.theme||'light')==='dark'?'selected':''}>تیره</option></select></div><div class="field"><label>عرض فاکتور کوچک</label><select id="setReceiptWidth"><option value="80" ${(db.settings.receiptWidth||'80')==='80'?'selected':''}>80 میلی‌متر</option><option value="58" ${(db.settings.receiptWidth||'80')==='58'?'selected':''}>58 میلی‌متر</option></select></div><div class="field" style="grid-column:1/-1"><label>متن پایین فاکتور</label><input id="setFooter" value="${e(db.settings.receiptFooter||'')}"></div></div><details class="settings-fold compact"><summary>تنظیمات فاکتور، بدهی و پیام واتساپ</summary><div class="settings-fold-body"><div class="form-grid two"><div class="field"><label>شروع شماره فاکتور فروش</label><input id="setInvoiceStart" inputmode="numeric" value="${e(db.settings.invoiceStart||1)}"></div><div class="field"><label>شروع شماره رسید ورود کالا</label><input id="setReceiptStart" inputmode="numeric" value="${e(db.settings.receiptStart||1)}"></div><div class="field"><label>فروش با موجودی ناکافی</label><select id="setAllowNegativeStock"><option value="no" ${!db.settings.allowNegativeStock?'selected':''}>ممنوع</option><option value="yes" ${db.settings.allowNegativeStock?'selected':''}>با اجازه مدیر</option></select></div><div class="field"><label>هشدار پس از چند روز بدهی</label><input id="setDebtWarnDays" inputmode="numeric" value="${e(db.settings.debtWarnDays||30)}"></div><div class="field"><label>حد مبلغ هشدار بدهی</label><input id="setDebtWarnAmount" inputmode="decimal" value="${e(db.settings.debtWarnAmount||10000)}"></div><div></div><div class="field" style="grid-column:1/-1"><label>متن پیام یادآوری واتساپ</label><textarea id="setDebtReminderTemplate" rows="7">${e(db.settings.debtReminderTemplate||defaultDebtReminderTemplate())}</textarea><div class="muted small">متغیرها: {shop} نام فروشگاه، {customer} نام مشتری، {amount} مبلغ مانده</div></div></div></div></details><div class="toolbar" style="margin-top:12px"><button class="btn good" type="submit">ذخیره تنظیمات</button></div></form></section><details class="settings-fold"><summary>بکاپ ابری تلگرام (اختیاری)</summary><div class="settings-fold-body"><div class="advanced-note">این گزینه اختیاری است و فقط وقتی دکمه ارسال را بزنید از اینترنت استفاده می‌کند. بکاپ محلی دانلودی همچنان راه اصلی و قابل‌اعتماد است.</div><div class="form-grid two" style="margin-top:12px"><div class="field"><label>توکن ربات تلگرام</label><input id="tgBotToken" value="${e(db.settings.telegramBotToken||'')}" placeholder="مثلاً 123456:ABC..."></div><div class="field"><label>Chat ID</label><input id="tgChatId" value="${e(db.settings.telegramChatId||'')}" placeholder="مثلاً 123456789"></div></div><div class="toolbar" style="margin-top:12px"><button class="btn secondary" onclick="saveTelegramBackupSettings()">ذخیره تنظیمات تلگرام</button><button class="btn good" onclick="sendBackupToTelegram()">ارسال بکاپ به تلگرام</button></div></div></details><details class="settings-fold"><summary>بکاپ خودکار داخلی</summary><div class="settings-fold-body"><div class="advanced-note">برنامه روزانه یک بکاپ داخلی می‌سازد و پیش از عملیات حساس نیز بکاپ می‌گیرد. این بکاپ‌ها داخل همین مرورگر نگهداری می‌شوند.</div><div class="form-grid" style="margin-top:12px"><div class="field"><label>تعداد بکاپ‌های اخیر برای نگهداری</label><input id="setInternalBackupLimit" inputmode="numeric" value="${e(db.settings.internalBackupLimit||7)}"></div><div class="field"><label>&nbsp;</label><button class="btn secondary" onclick="createInternalBackup('manual')">ساخت بکاپ داخلی اکنون</button></div></div><div style="margin-top:12px">${renderInternalBackups()}</div><div class="toolbar" style="margin-top:12px"><button class="btn bad" onclick="clearInternalBackups()">پاک‌سازی بکاپ‌های داخلی</button></div></div></details><details class="settings-fold"><summary>رمز حذف و ریست</summary><div class="settings-fold-body"><div class="advanced-note">برای حذف فاکتور، حذف رسید، حذف حساب، حذف اصلاحات، پاک‌سازی سطل حذف و ریست کامل برنامه این رمز خواسته می‌شود. حالت فعلی: <b>${db.settings.deletePinHash?'فعال':'غیرفعال'}</b></div><div class="form-grid three" style="margin-top:12px"><div class="field"><label>رمز فعلی ${db.settings.deletePinHash?'':'(لازم نیست)'}</label><input id="setDeletePinCurrent" type="password" inputmode="numeric" maxlength="6"></div><div class="field"><label>رمز جدید 4 تا 6 رقم</label><input id="setDeletePinNew" type="password" inputmode="numeric" maxlength="6"></div><div class="field"><label>تکرار رمز جدید</label><input id="setDeletePinConfirm" type="password" inputmode="numeric" maxlength="6"></div></div><div class="toolbar" style="margin-top:12px"><button class="btn good" onclick="saveDeletePinSettings()">ذخیره رمز</button><button class="btn ghost" onclick="disableDeletePin()">غیرفعال کردن رمز</button></div></div></details><details class="settings-fold"><summary>سلامت و ترمیم پایگاه داده</summary><div class="settings-fold-body">${dbHealthHtml()}</div></details><details class="settings-fold"><summary>سطل حذف و بازیابی</summary><div class="settings-fold-body"><div class="advanced-note">فاکتورها و رسیدهای حذف‌شده تا 100 مورد آخر اینجا نگهداری می‌شوند و قابل بازیابی هستند.</div>${renderTrashBin()}</div></details><details class="settings-fold danger-zone"><summary>ریست برنامه</summary><div class="settings-fold-body"><div class="advanced-note">اگر می‌خواهید برنامه از صفر شروع شود، این دکمه همه اطلاعات را پاک می‌کند و پایگاه داده نو می‌سازد. پیش از ریست حتماً بکاپ بگیرید.</div><div class="toolbar" style="margin-top:12px"><button class="btn bad" onclick="resetDatabase()">ریست کامل و حذف همه اطلاعات</button></div></div></details><details class="settings-fold"><summary>راهنمای کوتاه استفاده</summary><div class="settings-fold-body"><div class="guide-list"><div class="guide-item">در «انبار و کالاها» کالای اصلی و نوع کالا را ثبت کنید.</div><div class="guide-item">هر وقت کالا وارد شد، از بخش «ورود کالا» ثبت کنید تا به انبار همان نوع اضافه شود.</div><div class="guide-item">برای فروش، وارد حساب مشتری شوید و از تب «بردگی» کالا را ثبت کنید.</div><div class="guide-item">برای دریافت وجه مشتری، داخل پروفایل مشتری از تب «آوردگی» استفاده کنید.</div><div class="guide-item">هر روز یا هر هفته از همین بخش بکاپ بگیرید.</div></div></div></details></div>`
}
function saveSettings(ev){ev.preventDefault();Object.assign(db.settings,{shopName:document.getElementById('setShop').value.trim(),ownerName:document.getElementById('setOwner').value.trim(),phone:document.getElementById('setPhone').value.trim(),address:document.getElementById('setAddress').value.trim(),receiptFooter:document.getElementById('setFooter').value.trim(),receiptWidth:document.getElementById('setReceiptWidth')?document.getElementById('setReceiptWidth').value:(db.settings.receiptWidth||'80'),theme:document.getElementById('setTheme')?document.getElementById('setTheme').value:(db.settings.theme||'light'),allowNegativeStock:(document.getElementById('setAllowNegativeStock')?.value==='yes'),invoiceStart:Math.max(1,Math.floor(toNum(document.getElementById('setInvoiceStart')?.value||db.settings.invoiceStart||1))),receiptStart:Math.max(1,Math.floor(toNum(document.getElementById('setReceiptStart')?.value||db.settings.receiptStart||1))),debtWarnDays:Math.max(1,Math.floor(toNum(document.getElementById('setDebtWarnDays')?.value||db.settings.debtWarnDays||30))),debtWarnAmount:Math.max(0,toNum(document.getElementById('setDebtWarnAmount')?.value||db.settings.debtWarnAmount||10000)),debtReminderTemplate:(document.getElementById('setDebtReminderTemplate')?.value||defaultDebtReminderTemplate()),internalBackupLimit:Math.max(1,Math.floor(toNum(document.getElementById('setInternalBackupLimit')?.value||db.settings.internalBackupLimit||7)))});renumberSales();renumberPurchases();saveDB(false);toast('تنظیمات ذخیره شد و شماره‌ها تنظیم شد.');render()}
function printHtml(html,mode='normal'){
  const style=`<style>
    :root{--ink:#111827;--muted:#667085;--line:#d7dce3;--soft:#f6f7f9;--brand:#0F4C5C;--accent:#B4532A;--danger:#B42318;--success:#2F7D4E}
    *{box-sizing:border-box} body{font-family:"Noto Sans Arabic","Vazirmatn",Tahoma,Arial,sans-serif;direction:rtl;margin:0;padding:16px;color:var(--ink);background:#f3f4f6;line-height:1.65} .receipt{max-width:880px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 10px 28px rgba(17,24,39,.08)}
    .receipt-header{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;border-bottom:3px solid var(--brand);padding-bottom:14px;margin-bottom:14px}.receipt-brand h2{margin:0;font-size:23px;font-weight:900;color:var(--brand)}.receipt-brand .sub{color:var(--muted);font-size:12.5px;margin-top:3px}.receipt-no{text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:160px}.receipt-no span{display:block;color:var(--muted);font-size:11px}.receipt-no b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
    .receipt-title{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 14px}.receipt-title h3{margin:0;font-size:18px;font-weight:900}.receipt-meta-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}.receipt-meta-card{border:1px solid var(--line);background:#fbfcfd;border-radius:12px;padding:9px 10px}.receipt-meta-card span{display:block;color:var(--muted);font-size:11px}.receipt-meta-card b{display:block;color:var(--ink);font-size:13px;margin-top:2px;word-break:break-word}

function downloadFile(name,content,type='application/json;charset=utf-8'){const blob=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportBackup(){db.settings.lastBackupDate=todayIso();const pkg=makeBackupPackage();saveDB(false);downloadFile('hamgam-backup-full-'+todayIso()+'.json',JSON.stringify(pkg,null,2));toast('بکاپ دانلود شد؛ لطفاً فایل را از Downloads به فایل‌منیجر یا فضای ابری منتقل کنید.','good');render()}
function importBackup(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);const rawData=parseBackupObject(parsed);const data=ensureDB(rawData);const st=dbStats(data);if(!confirm(`بکاپ وارد شود؟\nمشتری: ${st.customers} | جنس: ${st.products} | فاکتور: ${st.sales}\nاطلاعات فعلی با بکاپ جایگزین می‌شود.`))return;try{localStorage.setItem(DB_KEY+'_safety_before_import',JSON.stringify(makeBackupPackage()))}catch(e){}createInternalBackup('beforeImport');db=data;saveDB(false);state={...state,view:'dashboard',saleCart:[],purchaseCart:[],lastSaleId:null,editSaleId:null,returnSaleId:null,accountAddMode:false,accountActionId:null,accountFilter:'active',accountBalanceFilter:'all',accountSort:'name',accountProfileTab:'history',accountSaleCart:[],accountSale:null,unlocked:true};toast('بکاپ بررسی و وارد شد.','good');render()}catch(err){console.error(err);toast(err.message==='checksum'?'فایل بکاپ خراب است یا تغییر کرده است.':'فایل بکاپ صحیح نیست.','bad')}};reader.readAsText(file);input.value=''}
function resetDatabase(){if(!requireDeletePin('ریست کامل برنامه'))return;createInternalBackup('beforeReset');if(!confirm('ریست کامل انجام شود؟ تمام مشتریان، فاکتورها، انبار، گزارشات و بکاپ داخلی حذف می‌شود.'))return;if(!confirm('این کار برگشت ندارد مگر بکاپ دانلود کرده باشید. مطمئن هستید؟'))return;if(!confirm('تأیید نهایی: همه اطلاعات پاک شود؟'))return;try{localStorage.removeItem(DB_KEY);localStorage.removeItem(DB_KEY+'_migrated_to_indexeddb');localStorage.removeItem(DB_KEY+'_safety_before_import')}catch(e){}db=initDB();state={...state,view:'dashboard',saleCart:[],purchaseCart:[],sale:null,purchase:null,productEditId:null,productProfileId:null,customerEditId:null,statementCustomerId:null,lastSaleId:null,editSaleId:null,returnSaleId:null,accountAddMode:false,accountActionId:null,accountFilter:'active',accountBalanceFilter:'all',accountSort:'name',accountProfileTab:'history',accountSaleCart:[],accountSale:null,globalSearch:'',unlocked:true};saveDB(false);toast('برنامه ریست شد و پایگاه داده نو ساخته شد.','warn');render()}
function toCsv(rows){return rows.map(r=>r.map(v=>'"'+toEnglishDigitsText(v??'').replace(/"/g,'""')+'"').join(',')).join('\n')}
function exportStockCsv(){const rows=[['کالای اصلی','نوع/مدل','واحد','موجودی','حداقل','فعال']].concat(db.products.map(p=>[productCategory(p),p.name,p.unit,p.stock,p.minStock,p.active!==false?'بله':'نخیر']));downloadFile('stock-'+todayIso()+'.csv','\ufeff'+toCsv(rows),'text/csv;charset=utf-8')}
function exportCustomersCsv(){const rows=[['نام','نوع','تلفن','آدرس','حد اعتبار','مطالبات ما','بدهی ما','مصرف کل']].concat(db.customers.map(c=>[c.name,accountTypeLabel(c.type),c.phone,c.address,toNum(c.creditLimit||0),accountReceivable(c.id),accountPayable(c.id),expenseTotal(c.id)]));downloadFile('accounts-'+todayIso()+'.csv','\ufeff'+toCsv(rows),'text/csv;charset=utf-8')}
function exportSalesCsv(){const rows=[['تاریخ','بل','مشتری','مجموع','پرداخت','مانده','اقلام']].concat(db.sales.map(s=>[formatDate(s.date),s.invoiceNo,s.customerName,s.total,s.paid,Math.max(0,toNum(s.total)-toNum(s.paid)),s.items.map(i=>fullProductNameFrom(i.category,i.productName)+' '+i.qty+' '+i.unit).join(' | ')]));downloadFile('sales-'+todayIso()+'.csv','\ufeff'+toCsv(rows),'text/csv;charset=utf-8')}
function exportPurchasesCsv(){const rows=[['تاریخ','فروشنده','مجموع','پرداخت','مانده','اقلام']].concat(db.purchases.map(p=>[formatDate(p.date),p.supplier,p.total,p.paid,Math.max(0,toNum(p.total)-toNum(p.paid)),p.items.map(i=>fullProductNameFrom(i.category,i.productName)+' '+i.qty+' '+i.unit).join(' | ')]));downloadFile('purchases-'+todayIso()+'.csv','\ufeff'+toCsv(rows),'text/csv;charset=utf-8')}
function exportJournalCsv(){const r=reportRangeIso(),rows=[['تاریخ','نوع','شرح','مبلغ/مقدار','جزئیات']].concat(journalEntries(r.start,r.end).map(x=>[formatDate(x.date),x.title,x.desc,x.amount,x.extra]));downloadFile('journal-'+todayIso()+'.csv','\ufeff'+toCsv(rows),'text/csv;charset=utf-8')}

if(typeof document!=='undefined'&&document.addEventListener&&!window.__hamgamDigitNormalizer){window.__hamgamDigitNormalizer=true;document.addEventListener('input',function(ev){normalizeInputDigits(ev.target)},true)}
if(typeof document!=='undefined'&&document.addEventListener){document.addEventListener('click',function(ev){const btn=ev.target.closest?.('.dot-menu[data-edit-customer]');if(btn){openAccountEdit(ev,btn.dataset.editCustomer)}})}
async function initApp(){await loadDB();await refreshInternalBackups();await createInternalBackup('daily');const hv=(location.hash||'').replace('#','');if(navItems.some(n=>n[0]===hv))state.view=hv;render();setupBrowserUx()}
initApp();

<script>
(function(){
  var deferredInstallPrompt=null;
  function installBtn(){
    var btn=document.getElementById('pwaInstallBtn');
    if(!btn){
      btn=document.createElement('button');
      btn.id='pwaInstallBtn';
      btn.className='pwa-install-btn';
      btn.type='button';
      btn.textContent='نصب برنامه';
      btn.onclick=async function(){
        if(!deferredInstallPrompt){try{toast&&toast('از منوی مرورگر گزینه Install یا Add to Home Screen را بزنید.','warn')}catch(e){}return}
        deferredInstallPrompt.prompt();
        try{await deferredInstallPrompt.userChoice}catch(e){}
        deferredInstallPrompt=null;
        btn.classList.remove('show');
      };
      document.body.appendChild(btn);
    }
    return btn;
  }
  if('serviceWorker' in navigator && location.protocol!=='file:'){
    window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(err){console.warn('Service worker registration failed',err)})});
  }
  window.addEventListener('beforeinstallprompt',function(ev){ev.preventDefault();deferredInstallPrompt=ev;installBtn().classList.add('show')});
  window.addEventListener('appinstalled',function(){var btn=document.getElementById('pwaInstallBtn');if(btn)btn.remove();try{toast&&toast('برنامه نصب شد.','good')}catch(e){}});
})();
</script>
