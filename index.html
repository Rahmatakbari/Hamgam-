function downloadFile(name,content,type='application/json;charset=utf-8'){const blob=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportBackup(){db.settings.lastBackupDate=todayIso();const pkg=makeBackupPackage();saveDB(false);downloadFile('hamgam-backup-full-'+todayIso()+'.json',JSON.stringify(pkg,null,2));toast('بکاپ دانلود شد؛ لطفاً فایل را از Downloads به فایل‌منیجر یا فضای ابری منتقل کنید.','good');render()}
function importBackup(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);const rawData=parseBackupObject(parsed);const data=ensureDB(rawData);const st=dbStats(data);if(!confirm(`بکاپ وارد شود؟\nمشتری: ${st.customers} | جنس: ${st.products} | فاکتور: ${st.sales}\nاطلاعات فعلی با بکاپ جایگزین می‌شود.`))return;try{localStorage.setItem(DB_KEY+'_safety_before_import',JSON.stringify(makeBackupPackage()))}catch(e){}createInternalBackup('beforeImport');db=data;saveDB(false);state={...state,view:'dashboard',saleCart:[],purchaseCart:[],lastSaleId:null,editSaleId:null,returnSaleId:null,accountAddMode:false,accountActionId:null,accountFilter:'active',accountBalanceFilter:'all',accountSort:'name',accountProfileTab:'history',accountSaleCart:[],accountSale:null,unlocked:false};toast('بکاپ بررسی و وارد شد.','good');render()}catch(err){console.error(err);toast(err.message==='checksum'?'فایل بکاپ خراب است یا تغییر کرده است.':'فایل بکاپ صحیح نیست.','bad')}};reader.readAsText(file);input.value=''}
function resetDatabase(){if(!requireDeletePin('ریست کامل برنامه'))return;createInternalBackup('beforeReset');if(!confirm('ریست کامل انجام شود؟ تمام مشتریان، فاکتورها، انبار، گزارشات و بکاپ داخلی حذف می‌شود.'))return;if(!confirm('این کار برگشت ندارد مگر بکاپ دانلود کرده باشید. مطمئن هستید؟'))return;if(!confirm('تأیید نهایی: همه اطلاعات پاک شود؟'))return;try{localStorage.removeItem(DB_KEY);localStorage.removeItem(DB_KEY+'_migrated_to_indexeddb');localStorage.removeItem(DB_KEY+'_safety_before_import')}catch(e){}db=initDB();forgetAppUnlocked();state={...state,view:'dashboard',saleCart:[],purchaseCart:[],sale:null,purchase:null,productEditId:null,productProfileId:null,customerEditId:null,statementCustomerId:null,lastSaleId:null,editSaleId:null,returnSaleId:null,accountAddMode:false,accountActionId:null,accountFilter:'active',accountBalanceFilter:'all',accountSort:'name',accountProfileTab:'history',accountSaleCart:[],accountSale:null,globalSearch:'',unlocked:false};saveDB(false);toast('برنامه ریست شد و پایگاه داده نو ساخته شد.','warn');render()}
function toCsv(rows){return rows.map(r=>r.map(v=>'"'+toEnglishDigitsText(v??'').replace(/"/g,'""')+'"').join(',')).join('\n')}
function exportStockCsv(){const rows=[['کالای اصلی','نوع/مدل','واحد','موجودی','حداقل','فعال']].concat(db.products.map(p=>[productCategory(p),p.name,p.unit,p.stock,p.minStock,p.active!==false?'بله':'نخیر']));downloadFile('stock-'+todayIso()+'.csv','\ufeff'+toCsv(rows),'text/csv;charset=utf-8')}
function exportCustomersCsv(){const rows=[['نام','نوع','تلفن','آدرس','حد اعتبار','مطالبات ما','بدهی ما','مصرف کل']].concat(db.customers.map(c=>[c.name,accountTypeLabel(c.type),c.phone,c.address,toNum(c.creditLimit||0),accountReceivable(c.id),accountPayable(c.id),expenseTotal(c.id)]));downloadFile('accounts-'+todayIso()+'.csv','\ufeff'+toCsv(rows),'text/csv;charset=utf-8')}
function exportSalesCsv(){const rows=[['تاریخ','بل','مشتری','مجموع','پرداخت','باقی','اقلام']].concat(db.sales.map(s=>[formatDate(s.date),s.invoiceNo,s.customerName,s.total,s.paid,Math.max(0,toNum(s.total)-toNum(s.paid)),s.items.map(i=>fullProductNameFrom(i.category,i.productName)+' '+i.qty+' '+i.unit).join(' | ')]));downloadFile('sales-'+todayIso()+'.csv','\ufeff'+toCsv(rows),'text/csv;charset=utf-8')}
function exportPurchasesCsv(){const rows=[['تاریخ','فراهم کننده','خرید از فراهم کننده','هزینه اضافه','قیمت تمام‌شده کل','پرداخت فراهم کننده','باقی','اقلام']].concat(db.purchases.map(p=>[formatDate(p.date),p.supplier,purchaseSupplierTotal(p),toNum(p.extraCostTotal||0),p.total,purchaseSupplierPaid(p),purchaseSupplierDue(p),p.items.map(i=>fullProductNameFrom(i.category,i.productName)+' '+i.qty+' '+i.unit).join(' | ')]));downloadFile('purchases-'+todayIso()+'.csv','\ufeff'+toCsv(rows),'text/csv;charset=utf-8')}
function exportCashMovesCsv(){const rows=[['تاریخ','نوع','مبلغ','شخص/منبع','دلیل','مرجع','روش','یادداشت']].concat((db.cashMoves||[]).map(m=>[formatDate(m.date),m.direction==='out'?'خروج':'ورود',toNum(m.amount),m.partyName||'',m.reason||'',treasuryRefText(m),m.method||'',m.note||'']));downloadFile('cash-moves-'+todayIso()+'.csv','\ufeff'+toCsv(rows),'text/csv;charset=utf-8')}
function exportJournalCsv(){const r=reportRangeIso(),rows=[['تاریخ','نوع','شرح','مبلغ/مقدار','جزئیات']].concat(journalEntries(r.start,r.end).map(x=>[formatDate(x.date),x.title,x.desc,x.amount,x.extra]));downloadFile('journal-'+todayIso()+'.csv','\ufeff'+toCsv(rows),'text/csv;charset=utf-8')}
