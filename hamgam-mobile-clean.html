function renderStockMoves(productId=null,limit=30){const list=stockMoveRows(productId).slice(0,limit);if(!list.length)return '<div class="empty">هنوز حرکت انبار ثبت نشده است.</div>';return `<div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>جنس</th><th>نوع حرکت</th><th>داخل</th><th>بیرون</th><th>قبل</th><th>بعد</th><th>مرجع</th><th>کاربر</th><th>یادداشت</th></tr></thead><tbody>${list.map(m=>`<tr><td>${formatDate(m.date)}</td><td>${e(fullProductNameFrom(m.category,m.productName))}<br><span class="muted small">${e(m.unit||'')}</span></td><td>${stockMoveTypeLabel(m.type)}</td><td>${m.qtyIn?qty(m.qtyIn)+' '+e(m.unit||''):'-'}</td><td>${m.qtyOut?qty(m.qtyOut)+' '+e(m.unit||''):'-'}</td><td>${m.balanceBefore===null||m.balanceBefore===undefined?'-':qty(m.balanceBefore)}</td><td>${m.balanceAfter===null||m.balanceAfter===undefined?'-':qty(m.balanceAfter)}</td><td>${e(m.refNo||'-')}<br><span class="muted small">${e(m.party||'')}</span></td><td>${e(m.operator||'مدیر')}</td><td>${e(m.note||'')}</td></tr>`).join('')}</tbody></table></div>`}
function auditClone(v){try{return JSON.parse(JSON.stringify(v))}catch(err){return null}}
function addAuditLog(action,entity,{id='',title='',before=null,after=null,note=''}={}){db.auditLogs=db.auditLogs||[];db.auditLogs.push({id:uid(),date:todayIso(),createdAt:nowISOTime(),action,entity,entityId:id,title,note,before:auditClone(before),after:auditClone(after)});if(db.auditLogs.length>2000)db.auditLogs=db.auditLogs.slice(-2000)}
function auditActionLabel(a){return({create:'ایجاد',update:'ویرایش',delete:'حذف',void:'باطل',activate:'فعال‌سازی',deactivate:'غیرفعال‌سازی',payment:'پرداخت/دریافت'}[a]||a)}
function auditEntityLabel(e){return({sale:'فاکتور فروش',purchase:'رسید ورود کالا',customer:'حساب مشتری',product:'جنس',adjustment:'اصلاح انبار',payment:'پرداخت مشتری',supplierPayment:'پرداخت فروشنده',expense:'مصرف',return:'برگشت کالا'}[e]||e)}
function renderAuditLogs(start=null,end=null,limit=40){const list=[...(db.auditLogs||[])].filter(x=>(!start||x.date>=start)&&(!end||x.date<=end)).sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt)).slice(0,limit);if(!list.length)return '<div class="empty">هنوز تاریخچه تغییرات ثبت نشده است.</div>';return `<div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>عمل</th><th>بخش</th><th>شرح</th><th>یادداشت</th></tr></thead><tbody>${list.map(x=>`<tr><td>${formatDate(x.date)}</td><td><span class="badge ${x.action==='delete'?'bad':x.action==='update'?'warn':'info'}">${auditActionLabel(x.action)}</span></td><td>${auditEntityLabel(x.entity)}</td><td><b>${e(x.title||'-')}</b><br><span class="muted small">${e(x.entityId||'')}</span></td><td>${e(x.note||'-')}</td></tr>`).join('')}</tbody></table></div>`}
function hasUnsavedWork(){return !!((state.saleCart&&state.saleCart.length)||(state.purchaseCart&&state.purchaseCart.length)||(state.accountSaleCart&&state.accountSaleCart.length))}
function runSelfCheck(){const issues=[];try{if(!db)issues.push('db not loaded');(db.products||[]).forEach(p=>{if(!p.id)issues.push('product without id');if(toNum(p.stock)<0)issues.push('negative stock: '+(p.name||p.id))});(db.sales||[]).forEach(s=>{if(!s.id)issues.push('sale without id');if(!s.invoiceNo)issues.push('sale without invoice number');(s.items||[]).forEach(i=>{if(i.productId&&!productById(i.productId))issues.push('sale item missing product: '+s.invoiceNo)})});(db.purchases||[]).forEach(p=>{if(!p.id)issues.push('purchase without id');if(!p.receiptNo)issues.push('purchase without receipt number')});const dupSales=duplicateCount(db.sales||[],s=>s.invoiceNo);if(dupSales)issues.push('duplicate invoice numbers: '+dupSales);const dupPurch=duplicateCount(db.purchases||[],p=>p.receiptNo);if(dupPurch)issues.push('duplicate receipt numbers: '+dupPurch);return{ok:issues.length===0,issues}}catch(e){return{ok:false,issues:[String(e)]}}}
function setupRippleEffects(){/* حالت متوازن: افکت موج برای سرعت بهتر خاموش است؛ انیمیشن‌های سبک باقی می‌ماند */}
function setupBrowserUx(){try{if(window.__hamgamUxReady)return;window.__hamgamUxReady=true;setupRippleEffects();let __lastBtn=null,__lastBtnAt=0;document.addEventListener('click',ev=>{const btn=ev.target.closest?.('button');if(!btn)return;const now=Date.now();if(btn===__lastBtn&&now-__lastBtnAt<650){ev.preventDefault();ev.stopImmediatePropagation();return}__lastBtn=btn;__lastBtnAt=now},true);window.addEventListener('beforeunload',ev=>{if(hasUnsavedWork()){ev.preventDefault();ev.returnValue='';return''}});window.addEventListener('online',()=>toast('اتصال انترنت برقرار شد.','good'));window.addEventListener('offline',()=>toast('شما آفلاین هستید؛ برنامه همچنان کار می‌کند.','warn'));window.addEventListener('error',ev=>{console.error(ev.error||ev.message);try{toast('یک خطای برنامه ثبت شد.','bad')}catch(e){}});window.addEventListener('unhandledrejection',ev=>{console.error(ev.reason);try{toast('یک خطای ذخیره/پردازش ثبت شد.','bad')}catch(e){}});if(history&&history.replaceState)history.replaceState({view:state.view},'',location.hash||'#'+state.view);window.addEventListener('popstate',ev=>{if(ev.state&&ev.state.view){state.view=ev.state.view;render()}})}catch(e){}}
function setView(v){state.view=v;try{if(history&&history.pushState&&(!history.state||history.state.view!==v))history.pushState({view:v},'', '#'+v)}catch(e){}render();if(window.innerWidth&&window.innerWidth<=820)window.scrollTo({top:0,behavior:'smooth'})}
function productById(id){return db.products.find(p=>p.id===id)} function customerById(id){return db.customers.find(c=>c.id===id)} function accountById(id){return customerById(id)}
function activeProducts(){return db.products.filter(p=>p.active!==false&&p.hidden!==true)}
function productCategory(p){return (p&&p.category?String(p.category).trim():'')||(p&&p.name?String(p.name).trim():'عمومی')}
function fullProductNameFrom(category,name){category=String(category||'').trim();name=String(name||'').trim();if(category&&name&&category!==name)return category+' — '+name;return name||category||'-'}
function fullProductName(p){return fullProductNameFrom(productCategory(p),p?p.name:'')}
function categories(activeOnly=true){const list=[];DEFAULT_PRODUCTS.forEach(p=>list.push(p.category||p.name));(activeOnly?activeProducts():db.products.filter(p=>p.hidden!==true)).forEach(p=>list.push(productCategory(p)));return [...new Set(list.filter(Boolean))]}
function categoryOptions(sel='',activeOnly=true){const cs=categories(activeOnly);const selected=sel&&cs.includes(sel)?sel:(cs[0]||'');return cs.map(c=>`<option value="${e(c)}" ${c===selected?'selected':''}>${e(c)}</option>`).join('')}
function categoryDatalist(){return `<datalist id="categoryNames">${categories(false).map(c=>`<option value="${e(c)}">`).join('')}</datalist>`}
function productOptions(sel='',cat=''){const ps=activeProducts().filter(p=>!cat||productCategory(p)===cat);if(!ps.length)return '<option value="">برای این کالای اصلی نوعی ثبت نشده</option>';return ps.map(p=>{const label=cat?String(p.name||''):fullProductName(p);return `<option value="${e(p.id)}" ${p.id===sel?'selected':''}>${e(label)} — موجودی: ${qty(p.stock)} ${e(p.unit)}</option>`}).join('')}

function accountTypeLabel(t){return t==='supplier'?'فروشنده':t==='both'?'مشتری و فروشنده':t==='expense'?'مصرف / خرج':'مشتری'}
function isCustomerAccount(c){return ['customer','both'].includes(c?.type||'customer')}
function isSupplierAccount(c){return ['supplier','both'].includes(c?.type||'customer')}
function isExpenseAccount(c){return (c?.type||'customer')==='expense'}
function promoteAccountRole(c,role){if(!c)return;c.type=c.type||'customer';if(role==='customer'&&c.type==='supplier')c.type='both';else if(role==='supplier'&&c.type==='customer')c.type='both';else if(role==='supplier'&&c.type!=='both')c.type='supplier';else if(role==='customer'&&c.type!=='both')c.type='customer'}
function customerOptions(sel=''){const ps=db.customers.filter(isCustomerAccount);return ps.map(c=>`<option value="${e(c.id)}" ${c.id===sel?'selected':''}>${e(c.name)} — طلب: ${money(Math.max(0,customerBalance(c.id)))}</option>`).join('')}
function supplierOptions(sel=''){const ps=db.customers.filter(isSupplierAccount);return ps.map(c=>`<option value="${e(c.id)}" ${c.id===sel?'selected':''}>${e(c.name)} — بدهی ما: ${money(Math.max(0,supplierBalance(c.id)))}</option>`).join('')}
function expenseOptions(sel=''){const ps=db.customers.filter(isExpenseAccount);return ps.map(c=>`<option value="${e(c.id)}" ${c.id===sel?'selected':''}>${e(c.name)} — مصرف: ${money(expenseTotal(c.id))}</option>`).join('')}
function accountOptions(sel=''){return db.customers.map(c=>`<option value="${e(c.id)}" ${c.id===sel?'selected':''}>${e(c.name)} — ${accountTypeLabel(c.type)}</option>`).join('')}
function customerDatalist(){return `<datalist id="customerNames">${db.customers.filter(isCustomerAccount).map(c=>`<option value="${e(c.name)}">`).join('')}</datalist>`}
function supplierDatalist(){return `<datalist id="supplierNames">${db.customers.filter(isSupplierAccount).map(c=>`<option value="${e(c.name)}">`).join('')}</datalist>`}
function customerBalance(id){const debt=db.sales.filter(s=>s.customerId===id).reduce((a,s)=>a+(toNum(s.total)-toNum(s.paid)),0);const paid=db.payments.filter(p=>p.customerId===id).reduce((a,p)=>a+toNum(p.amount),0);return round2(debt-paid)}
function supplierBalance(id){const debt=db.purchases.filter(p=>p.supplierId===id).reduce((a,p)=>a+(toNum(p.total)-toNum(p.paid)),0);const paid=(db.supplierPayments||[]).filter(p=>p.supplierId===id).reduce((a,p)=>a+toNum(p.amount),0);return round2(debt-paid)}
function expenseTotal(id){return round2((db.expenses||[]).filter(x=>x.accountId===id).reduce((a,x)=>a+toNum(x.amount),0))}
function totalExpenses(){return round2((db.expenses||[]).reduce((a,x)=>a+toNum(x.amount),0))}
function accountReceivable(id){return round2(Math.max(0,customerBalance(id)))}
function accountPayable(id){return round2(Math.max(0,-customerBalance(id))+Math.max(0,supplierBalance(id)))}
function totalCustomerDebt(){return db.customers.reduce((a,c)=>a+Math.max(0,customerBalance(c.id)),0)}
function totalSupplierDebt(){return db.customers.reduce((a,c)=>a+Math.max(0,supplierBalance(c.id)),0)}
function totalReceivable(){return db.customers.reduce((a,c)=>a+accountReceivable(c.id),0)}
function totalPayable(){return db.customers.reduce((a,c)=>a+accountPayable(c.id),0)}
function saleTotal(cart=state.saleCart){return round2(cart.reduce((a,i)=>a+i.qty*i.price,0))}
function purchaseTotal(cart=state.purchaseCart){return round2(cart.reduce((a,i)=>a+i.qty*i.cost,0))}
function applyTheme(){try{document.documentElement.setAttribute('data-theme',db?.settings?.theme||'light')}catch(e){}}
function currentOperator(){return state?.currentUser?.name||state?.currentUserName||'مدیر'}
function productSearchText(p){return [productCategory(p),p?.name,p?.unit,fullProductName(p)].filter(Boolean).join(' ').toLowerCase()}
function findProductByText(text){const q=String(text||'').trim().toLowerCase();if(!q)return null;return activeProducts().find(p=>fullProductName(p).toLowerCase()===q||String(p.name||'').trim().toLowerCase()===q)||activeProducts().find(p=>productSearchText(p).includes(q))||null}
function renderError(err){const msg=err&&err.message?err.message:String(err);return `<div class="app-error"><h3>خطا در نمایش این بخش</h3><p>برنامه بسته نشده است. می‌توانید به داشبورد برگردید یا صفحه را دوباره باز کنید.</p><code>${e(msg)}</code><div class="toolbar"><button class="btn secondary" onclick="state.view='dashboard';render()">رفتن به داشبورد</button><button class="btn ghost" onclick="location.reload()">بارگذاری دوباره</button></div></div>`}
function render(){applyTheme();try{document.body.dataset.view=state.view;document.body.dataset.accountSubview=(state.view==='customers'&&!state.accountAddMode&&!state.customerEditId&&!state.statementCustomerId&&!state.accountActionId)?'list':''}catch(e){}const box=document.getElementById('view');try{document.getElementById('sideShopName').textContent=db.settings.shopName||'فروشگاه هم‌گام';document.getElementById('todayText').innerHTML='امروز: <b>'+formatDateLong(todayIso())+'</b> &nbsp; | &nbsp; ذخیره: '+(storageMode==='IndexedDB'?'IndexedDB آفلاین':'LocalStorage آفلاین');renderNav();const found=navItems.find(x=>x[0]===state.view);document.getElementById('pageTitle').textContent=found?found[2]:'داشبورد';const views={dashboard:renderDashboard,purchase:renderPurchase,products:renderProducts,customers:renderCustomers,reports:renderReports,search:renderSearch,settings:renderSettings};box.innerHTML=(views[state.view]||renderDashboard)();try{box.classList.remove('view-enter');void box.offsetWidth;box.classList.add('view-enter')}catch(e){}enhanceMobileTables();renderLock()}catch(err){console.error('Render error:',err);if(box)box.innerHTML=renderError(err);try{toast('در نمایش این بخش خطا رخ داد.','bad')}catch(e){}}}

function enhanceMobileTables(){document.querySelectorAll('#view table').forEach(table=>{const labels=[...table.querySelectorAll('thead th')].map(th=>th.textContent.trim());table.querySelectorAll('tbody tr').forEach(tr=>{[...tr.children].forEach((td,i)=>{if(labels[i])td.setAttribute('data-label',labels[i])})})})}

function simpleHash(str){let h=2166136261;str=String(str||'');for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
function pinHash(pin){return simpleHash('hamgam-pin-'+String(pin||''))}
function renderLock(){const el=document.getElementById('lockScreen');if(el){el.style.display='none';el.innerHTML=''}}
function unlockApp(){const v=document.getElementById('unlockPin')?.value||'';if(pinHash(v)===db.settings.pinHash){state.unlocked=true;renderLock();toast('خوش آمدید.','good')}else{toast('رمز صحیح نیست.','bad');const i=document.getElementById('unlockPin');if(i){i.value='';i.focus()}}}

function savePinSettings(){const cur=document.getElementById('setPinCurrent')?.value||'',pin=document.getElementById('setPinNew')?.value||'',conf=document.getElementById('setPinConfirm')?.value||'';if(!/^\d{4}$/.test(pin))return toast('رمز باید ۴ رقم باشد.','bad');if(pin!==conf)return toast('تکرار رمز برابر نیست.','bad');if(db.settings.pinHash&&pinHash(cur)!==db.settings.pinHash)return toast('رمز فعلی صحیح نیست.','bad');db.settings.pinHash=pinHash(pin);state.unlocked=true;saveDB(false);toast('رمز ورود فعال/تغییر شد.');render()}
function disablePin(){const cur=document.getElementById('setPinCurrent')?.value||'';if(!db.settings.pinHash)return toast('رمزی فعال نیست.','warn');if(pinHash(cur)!==db.settings.pinHash)return toast('برای حذف رمز، رمز فعلی را وارد کنید.','bad');if(!confirm('رمز ورود حذف شود؟'))return;db.settings.pinHash='';state.unlocked=true;saveDB(false);toast('رمز ورود حذف شد.','warn');render()}
function requireDeletePin(action='این عمل حساس'){
  if(!db.settings.deletePinHash){toast('اول رمز حذف و ریست را در تنظیمات بسازید.','bad');state.view='settings';render();return false}
  const now=Date.now(),lockedUntil=toNum(db.settings.deletePinLockedUntil||0);
  if(lockedUntil&&lockedUntil>now){const mins=Math.ceil((lockedUntil-now)/60000);toast('به دلیل تلاش ناموفق، رمز حذف و ریست تا '+fmt(mins)+' دقیقه قفل است.','bad');return false}
  const v=(window.prompt?window.prompt('رمز حذف و ریست را وارد کنید:\n'+action):prompt('رمز حذف و ریست را وارد کنید:'));
  if(v===null||v===undefined)return false;
  if(pinHash(v)===db.settings.deletePinHash){db.settings.deletePinFailCount=0;db.settings.deletePinLockedUntil=0;saveDB(false);return true}
  db.settings.deletePinFailCount=Math.max(0,toNum(db.settings.deletePinFailCount||0))+1;
  if(db.settings.deletePinFailCount>=5){db.settings.deletePinFailCount=0;db.settings.deletePinLockedUntil=now+5*60000;saveDB(false);toast('رمز چند بار اشتباه وارد شد؛ حذف و ریست برای ۵ دقیقه قفل شد.','bad');return false}
  saveDB(false);toast('رمز حذف و ریست صحیح نیست. تلاش باقی‌مانده: '+fmt(5-db.settings.deletePinFailCount),'bad');return false
}
function saveDeletePinSettings(){const cur=document.getElementById('setDeletePinCurrent')?.value||'',pin=document.getElementById('setDeletePinNew')?.value||'',conf=document.getElementById('setDeletePinConfirm')?.value||'';if(!/^\d{4,6}$/.test(pin))return toast('رمز باید ۴ تا ۶ رقم باشد.','bad');if(pin!==conf)return toast('تکرار رمز برابر نیست.','bad');if(db.settings.deletePinHash&&pinHash(cur)!==db.settings.deletePinHash)return toast('رمز فعلی صحیح نیست.','bad');db.settings.deletePinHash=pinHash(pin);db.settings.deletePinFailCount=0;db.settings.deletePinLockedUntil=0;saveDB(false);toast('رمز حذف و ریست ذخیره شد.','good');render()}

function journalEntries(startIso=null,endIso=null){function ok(d){return (!startIso||d>=startIso)&&(!endIso||d<=endIso)}let rows=[];db.sales.forEach(s=>{if(ok(s.date))rows.push({kind:'sale',date:s.date,createdAt:s.createdAt,title:'فروش',desc:`فاکتور ${s.invoiceNo||''} — ${s.customerName||'نقدی'}`,amount:s.total,extra:`پرداخت: ${money(s.paid)} | مانده: ${money(Math.max(0,toNum(s.total)-toNum(s.paid)))}`,id:s.id});(s.returns||[]).forEach(r=>{if(ok(r.date||s.date))rows.push({kind:'return',date:r.date||s.date,createdAt:r.createdAt||s.createdAt,title:'برگشت کالا',desc:`فاکتور ${s.invoiceNo||''} — ${s.customerName||''}`,amount:r.amount||r.grossAmount||0,extra:(r.items||[]).map(i=>fullProductNameFrom(i.category,i.productName)+' '+(i.qty?qty(i.qty)+' '+(i.unit||''):money(i.amount))).join(' | '),id:r.id||s.id})})});db.purchases.forEach(p=>{if(ok(p.date))rows.push({kind:'purchase',date:p.date,createdAt:p.createdAt,title:'ورود کالا',desc:`رسید ${p.receiptNo||''} — ${p.supplier||'بدون نام فروشنده'}`,amount:p.total,extra:`پرداخت: ${money(p.paid||0)} | مانده: ${money(Math.max(0,toNum(p.total)-toNum(p.paid)))}`,id:p.id})});db.payments.forEach(p=>{if(ok(p.date)){const c=customerById(p.customerId);rows.push({kind:'payment',date:p.date,createdAt:p.createdAt,title:'دریافت از مشتری',desc:c?c.name:'حساب حذف شده',amount:p.amount,extra:p.method||'',id:p.id})}});(db.supplierPayments||[]).forEach(p=>{if(ok(p.date)){const c=customerById(p.supplierId);rows.push({kind:'supplierPayment',date:p.date,createdAt:p.createdAt,title:'پرداخت به فروشنده',desc:c?c.name:'حساب حذف شده',amount:p.amount,extra:p.method||'',id:p.id})}});(db.expenses||[]).forEach(x=>{if(ok(x.date)){const c=customerById(x.accountId);rows.push({kind:'expense',date:x.date,createdAt:x.createdAt,title:'مصرف / خرج',desc:x.description||x.note||(c?c.name:'مصرف'),amount:x.amount,extra:x.method||'',id:x.id})}});db.adjustments.forEach(a=>{if(ok(a.date))rows.push({kind:'adjust',date:a.date,createdAt:a.createdAt,title:'اصلاح انبار',desc:`${fullProductNameFrom(a.category,a.productName)} — ${a.reason||''}`,amount:a.qtySigned,extra:a.unit||'',id:a.id})});return rows.sort((a,b)=>(b.date+(b.createdAt||'')).localeCompare(a.date+(a.createdAt||'')))}
function kindBadge(k){return k==='sale'?'<span class="badge good">فروش</span>':k==='purchase'?'<span class="badge info">ورود کالا</span>':k==='payment'?'<span class="badge warn">دریافت</span>':k==='supplierPayment'?'<span class="badge bad">پرداخت</span>':k==='expense'?'<span class="badge bad">مصرف</span>':'<span class="badge gray">انبار</span>'}
function renderJournalTable(rows,limit=null){const list=limit?rows.slice(0,limit):rows;if(!list.length)return '<div class="empty">هیچ معامله‌ای ثبت نشده است.</div>';function ji(k){return k==='sale'?'receipt':k==='return'?'boxIn':k==='purchase'?'boxIn':k==='payment'?'cash':k==='supplierPayment'?'wallet':k==='expense'?'expense':k==='adjust'?'warehouse':'report'}return `<div class="journal-list">${list.map(r=>`<div class="journal-card"><div class="journal-icon">${iconSvg(ji(r.kind))}</div><div class="journal-main"><b>${e(r.title)}</b><span>${e(r.desc)}</span><span class="journal-date">${formatDate(r.date)}</span></div><div class="journal-side">${r.kind==='adjust'?qty(r.amount)+' '+e(r.extra):money(r.amount)}<span class="journal-date">${e(r.extra||'')}</span></div></div>`).join('')}</div>`}

function ensureSaleState(){if(!state.sale)state.sale={date:solarToday(),category:categories()[0]||'',customerName:'نقدی',customerPhone:'',discount:'0',paid:'0',method:'نقد',note:''}}

  const saleCat=state.sale.category||categories()[0]||'',subtotal=saleTotal(),discount=toNum(state.sale.discount),final=Math.max(0,subtotal-discount),paid=toNum(state.sale.paid),due=round2(final-paid);
  return `<div class="panel"><div class="panel-title"><h3>ثبت فروش / فاکتور</h3><span class="badge info">از انبار همان نوع کم می‌شود</span></div>${customerDatalist()}<div class="form-grid"><div class="field"><label>تاریخ هجری شمسی</label><input id="saleDate" value="${e(state.sale.date)}" oninput="state.sale.date=this.value" placeholder="مثلاً ۱۴۰۵/۰۴/۲۱"></div><div class="field"><label>نام مشتری</label><input id="saleCustomer" list="customerNames" value="${e(state.sale.customerName)}" oninput="state.sale.customerName=this.value" placeholder="نقدی یا نام مشتری"></div><div class="field"><label>شماره مشتری</label><input id="salePhone" value="${e(state.sale.customerPhone)}" oninput="state.sale.customerPhone=this.value" placeholder="اختیاری"></div><div class="field"><label>نوع دریافت</label><select id="saleMethod" onchange="state.sale.method=this.value"><option ${state.sale.method==='نقد'?'selected':''}>نقد</option><option ${state.sale.method==='حواله'?'selected':''}>حواله</option><option ${state.sale.method==='کارت'?'selected':''}>کارت</option><option ${state.sale.method==='نسیه'?'selected':''}>نسیه</option></select></div></div><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><div class="form-grid"><div class="field"><label>کالای اصلی</label><select id="saleCategory" onchange="state.sale.category=this.value;refreshProductSelect('saleCategory','saleProduct','sale')">${categoryOptions(saleCat)}</select></div><div class="field"><label>نوع / مدل کالا</label><select id="saleProduct" onchange="fillSalePrice()">${productOptions('',saleCat)}</select></div><div class="field"><label>تعداد/مقدار</label><input id="saleQty" inputmode="decimal" placeholder="مثلاً 10"></div><div class="field"><label>قیمت فی واحد</label><input id="salePrice" inputmode="decimal" placeholder="خالی = قیمت فروش جنس"></div><div class="field"><label>&nbsp;</label><button class="btn" onclick="addSaleLine()">افزودن به فاکتور</button></div></div><p class="muted small">مثال: اول «گچ» را انتخاب function fillSalePrice(){const p=productById(document.getElementById('saleProduct').value);if(p){document.getElementById('salePrice').value=p.sellPrice||'';if(state.sale)state.sale.category=productCategory(p)}}
function fillPurchaseCost(){const p=productById(document.getElementById('purchaseProduct').value);if(p){document.getElementById('purchaseCost').value=p.buyPrice||'';if(state.purchase)state.purchase.category=productCategory(p)}}
function refreshProductSelect(categoryId,productId,mode=''){const cat=document.getElementById(categoryId)?.value||'';const sel=document.getElementById(productId);if(sel)sel.innerHTML=productOptions('',cat);if(mode==='sale')fillSalePrice();if(mode==='purchase')fillPurchaseCost()}

function updateSaleTotals(){const subtotal=saleTotal(),discount=toNum(document.getElementById('saleDiscount')?.value??state.sale?.discount),final=Math.max(0,round2(subtotal-discount)),paid=toNum(document.getElementById('salePaid')?.value??state.sale?.paid),due=Math.max(0,round2(final-paid));const f=document.getElementById('saleFinalAmount'),d=document.getElementById('saleDueAmount');if(f)f.textContent=money(final);if(d){d.textContent=money(due);d.className=due>0?'bad':''}}

function addSaleLine(){captureSale();const p=productById(document.getElementById('saleProduct').value),q=toNum(document.getElementById('saleQty').value);if(!p)return toast('کالا انتخاب نشده است.','bad');if(q<=0)return toast('مقدار فروش صحیح نیست.','bad');const priceInput=document.getElementById('salePrice').value;const price=priceInput.trim()?toNum(priceInput):toNum(p.sellPrice);if(price<=0)return toast('قیمت فروش را وارد کنید.','bad');const already=state.saleCart.filter(i=>i.productId===p.id).reduce((a,i)=>a+i.qty,0);if(q+already>toNum(p.stock))return toast('موجودی کافی نیست. موجودی فعلی: '+qty(p.stock)+' '+p.unit,'bad');state.saleCart.push({productId:p.id,category:productCategory(p),productName:p.name,unit:p.unit,qty:q,price:price,cost:toNum(p.buyPrice)});render()}

function clearSale(){state.saleCart=[];state.sale={date:solarToday(),category:categories()[0]||'',customerName:'نقدی',customerPhone:'',discount:'0',paid:'0',method:'نقد',note:''};render()}
function findOrCreateCustomer(name,phone=''){name=(name||'').trim();if(!name||name==='نقدی')return null;let c=db.customers.find(x=>String(x.name||'').trim().toLowerCase()===name.toLowerCase());if(c){if(phone&&!c.phone)c.phone=phone;promoteAccountRole(c,'customer');return c}c={id:uid(),name,type:'customer',phone,address:'',note:'',createdAt:nowISOTime()};db.customers.push(c);return c}
function findOrCreateSupplier(name,phone=''){name=(name||'').trim();if(!name)return null;let c=db.customers.find(x=>String(x.name||'').trim().toLowerCase()===name.toLowerCase());if(c){if(phone&&!c.phone)c.phone=phone;promoteAccountRole(c,'supplier');return c}c={id:uid(),name,type:'supplier',phone,address:'',note:'',createdAt:nowISOTime()};db.customers.push(c);return c}
function registerSale(){captureSale();const date=solarToIso(state.sale.date);if(!date)return toast('تاریخ فروش صحیح نیست. نمونه: ۱۴۰۵/۰۴/۲۱','bad');if(!state.saleCart.length)return toast('فاکتور خالی است.','bad');const subtotal=saleTotal(),discount=toNum(state.sale.discount);if(discount<0||discount>subtotal)return toast('تخفیف صحیح نیست.','bad');const total=round2(subtotal-discount),paid=toNum(state.sale.paid);if(paid<0||paid>total)return toast('مبلغ پرداخت شده باید بین صفر و مبلغ فاکتور باشد.','bad');const due=round2(total-paid);const cname=(state.sale.customerName||'').trim();if(due>0&&(!cname||cname==='نقدی'))return toast('برای فروش نسیه، نام مشتری را وارد کنید.','bad');let required={};state.saleCart.forEach(i=>required[i.productId]=(required[i.productId]||0)+i.qty);for(const id in required){const p=productById(id);if(!p)return toast('کالا یافت نشد.','bad');if(!db.settings.allowNegativeStock&&toNum(p.stock)<required[id])return toast('موجودی '+(p?p.name:'جنس')+' کافی نیست.','bad')}const c=findOrCreateCustomer(cname,state.sale.customerPhone);state.saleCart.forEach(i=>{const p=productById(i.productId);p.stock=round2(toNum(p.stock)-i.qty)});const sale={id:uid(),invoiceNo:nextInvoiceNo(),date,customerId:c?c.id:null,customerName:c?c.name:(cname||'نقدی'),items:state.saleCart.map(x=>({...x,total:round2(x.qty*x.price)})),subtotal,discount,total,paid,due,paymentMethod:state.sale.method,note:state.sale.note,costTotal:round2(state.saleCart.reduce((a,i)=>a+i.qty*i.cost,0)),operator:currentOperator(),createdAt:nowISOTime()};db.sales.push(sale);sale.items.filter(i=>i.productId).forEach(i=>{const p=productById(i.productId);addStockMove({...productSnapshot(i.productId,i),date:sale.date,type:'sale_out',qtyOut:i.qty,refType:'sale',refId:sale.id,refNo:sale.invoiceNo,party:sale.customerName,note:'فروش / بردگی',balanceAfter:p?toNum(p.stock):null})});addAuditLog('create','sale',{id:sale.id,title:'فاکتور '+sale.invoiceNo+' - '+sale.customerName,after:sale,note:'ثبت فروش'});state.lastSaleId=sale.id;saveDB(false);toast('فاکتور '+sale.invoiceNo+' ثبت شد؛ موجودی اقلام ثبت‌شده اصلاح گردید.');state.saleCart=[];state.sale={date:solarToday(),category:categories()[0]||'',customerName:'نقدی',customerPhone:'',discount:'0',paid:'0',method:'نقد',note:''};render()}

function addPurchaseLine(){capturePurchase();const p=productById(document.getElementById('purchaseProduct').value),q=toNum(document.getElementById('purchaseQty').value),cost=toNum(document.getElementById('purchaseCost').value);if(!p)return toast('کالا انتخاب نشده است.','bad');if(q<=0)return toast('مقدار صحیح نیست.','bad');if(cost<0)return toast('قیمت خرید صحیح نیست.','bad');state.purchaseCart.push({productId:p.id,category:productCategory(p),productName:p.name,unit:p.unit,qty:q,cost:cost,total:round2(q*cost)});render()}

function deletePurchase(id){if(!requireDeletePin('حذف رسید ورود کالا'))return;createInternalBackup('beforeDeletePurchase');const p=db.purchases.find(x=>x.id===id);if(!p)return;if(!confirm('این ورود کالا حذف شود؟ موجودی کالاها از انبار کم می‌شود.'))return;for(const i of p.items){const pr=productById(i.productId);if(pr&&toNum(pr.stock)-toNum(i.qty)<0&&!confirm('با حذف این رسید، موجودی '+pr.name+' منفی می‌شود. باز هم حذف شود؟'))return}p.items.forEach(i=>{const pr=productById(i.productId);if(pr){pr.stock=round2(toNum(pr.stock)-toNum(i.qty));addStockMove({...productSnapshot(i.productId,i),date:todayIso(),type:'purchase_delete_out',qtyOut:i.qty,refType:'purchase',refId:p.id,refNo:p.receiptNo||'',party:p.supplier||'',note:'حذف رسید ورود کالا',balanceAfter:pr.stock})}});pushTrash('purchases',p);addAuditLog('delete','purchase',{id:p.id,title:'رسید '+(p.receiptNo||'')+' - '+(p.supplier||''),before:p,note:'حذف ورود کالا و کم کردن از انبار'});db.purchases=db.purchases.filter(x=>x.id!==id);renumberPurchases();saveDB(false);toast('ورود کالا حذف شد، موجودی از انبار کم شد و شماره رسیدها تنظیم شد.','warn');render()}

function saveProductForm(ev){

  if(!category||!name||!unit)return toast('کالای اصلی، نوع کالا و واحد ضروری است.','bad');
  if(db.products.some(p=>p.id!==state.productEditId&&productCategory(p).trim()===category&&String(p.name||'').trim()===name))return toast('این نوع برای همین کالای اصلی قبلاً ثبت شده است.','bad');
  if(state.productEditId){
    const p=productById(state.productEditId),before=auditClone(p);Object.assign(p,{category,name,unit,minStock:toNum(document.getElementById('prodMin').value)});
    addAuditLog('update','product',{id:p.id,title:fullProductName(p),before,after:p,note:'ویرایش جنس'});state.productEditId=null
  }else{
    const p={id:uid(),category,name,unit,stock:0,buyPrice:0,sellPrice:0,minStock:toNum(document.getElementById('prodMin').value),active:true,createdAt:nowISOTime()};

  }

function saveAdjustment(){const date=solarToIso(document.getElementById('adjDate').value),p=productById(document.getElementById('adjProduct').value),type=document.getElementById('adjType').value,q=toNum(document.getElementById('adjQty').value),reason=document.getElementById('adjReason').value.trim();if(!date)return toast('تاریخ صحیح نیست.','bad');if(!p)return toast('نوع کالا انتخاب نشده است.','bad');if(q<=0)return toast('مقدار صحیح نیست.','bad');const signed=type==='add'?q:-q;if(toNum(p.stock)+signed<0)return toast('موجودی نمی‌تواند منفی شود.','bad');p.stock=round2(toNum(p.stock)+signed);const adj={id:uid(),date,productId:p.id,category:productCategory(p),productName:p.name,unit:p.unit,qtySigned:signed,reason,operator:currentOperator(),createdAt:nowISOTime()};db.adjustments.push(adj);addStockMove({...productSnapshot(p.id,p),date,type:signed>=0?'adjust_in':'adjust_out',qtyIn:signed>=0?signed:0,qtyOut:signed<0?Math.abs(signed):0,refType:'adjustment',refId:adj.id,refNo:'',party:'',note:reason||'اصلاح انبار',balanceAfter:p.stock});addAuditLog('create','adjustment',{id:adj.id,title:fullProductNameFrom(adj.category,adj.productName),after:adj,note:reason||'اصلاح انبار'});saveDB(false);toast('اصلاح انبار ثبت شد.');render()}
function renderAdjustments(){const list=[...db.adjustments].sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt)).slice(0,20);if(!list.length)return '<div class="empty">هنوز اصلاح موجودی ثبت نشده است.</div>';return `<div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>جنس</th><th>تغییر</th><th>دلیل</th><th>عملیات</th></tr></thead><tbody>${list.map(a=>`<tr><td>${formatDate(a.date)}</td><td>${e(fullProductNameFrom(a.category,a.productName))}</td><td><span class="badge ${a.qtySigned>=0?'good':'bad'}">${a.qtySigned>=0?'+':''}${qty(a.qtySigned)} ${e(a.unit)}</span></td><td>${e(a.reason||'-')}</td><td><button class="btn smallbtn bad" onclick="deleteAdjustment('${a.id}')">حذف</button></td></tr>`).join('')}</tbody></table></div>`}
function deleteAdjustment(id){if(!requireDeletePin('حذف اصلاح انبار'))return;createInternalBackup('beforeDeleteAdjustment');const a=db.adjustments.find(x=>x.id===id);if(!a)return;if(!confirm('این اصلاح حذف شود؟ اثر آن از موجودی برعکس می‌شود.'))return;const p=productById(a.productId);if(p){if(toNum(p.stock)-toNum(a.qtySigned)<0)return toast('با حذف این اصلاح، موجودی منفی می‌شود.','bad');p.stock=round2(toNum(p.stock)-toNum(a.qtySigned));const q=toNum(a.qtySigned);addStockMove({...productSnapshot(a.productId,a),date:todayIso(),type:q>=0?'adjust_delete_out':'adjust_delete_in',qtyIn:q<0?Math.abs(q):0,qtyOut:q>=0?q:0,refType:'adjustment',refId:a.id,refNo:'',party:'',note:'حذف اصلاح انبار',balanceAfter:p.stock});addAuditLog('delete','adjustment',{id:a.id,title:fullProductNameFrom(a.category,a.productName),before:a,note:'حذف اصلاح انبار'})}db.adjustments=db.adjustments.filter(x=>x.id!==id);saveDB(false);toast('اصلاح حذف شد.','warn');render()}
function daysBetweenIso(a,b){try{const d1=new Date(a+'T00:00:00'),d2=new Date(b+'T00:00:00');return Math.max(0,Math.floor((d2-d1)/86400000))}catch(e){return 0}}
function customerDebtInfo(id){const entries=[];(db.sales||[]).filter(s=>s.customerId===id).forEach(s=>entries.push({date:s.date,createdAt:s.createdAt||'',debit:toNum(s.total),credit:toNum(s.paid)}));(db.payments||[]).filter(p=>p.customerId===id).forEach(p=>entries.push({date:p.date,createdAt:p.createdAt||'',debit:0,credit:toNum(p.amount)}));entries.sort((a,b)=>(a.date+a.createdAt).localeCompare(b.date+b.createdAt));let bal=0,start=null;for(const r of entries){const prev=bal;bal=round2(bal+toNum(r.debit)-toNum(r.credit));if(prev<=0&&bal>0)start=r.date;if(bal<=0)start=null}return{balance:round2(bal),since:start,days:start?daysBetweenIso(start,todayIso()):0}}
function customerDebtAlert(id){const info=customerDebtInfo(id),daysLimit=toNum(db.settings.debtWarnDays||30),amountLimit=toNum(db.settings.debtWarnAmount||10000),messages=[];if(info.balance>0&&daysLimit>0&&info.days>=daysLimit)messages.push(`مشتری ${customerById(id)?.name||''} ${fmt(info.days)} روز است بدهکار است.`);if(info.balance>0&&amountLimit>0&&info.balance>=amountLimit)messages.push(`بدهی مشتری از حد تعیین‌شده (${money(amountLimit)}) بیشتر شده است.`);const c=customerById(id),limit=toNum(c?.creditLimit||0);if(info.balance>0&&limit>0&&info.balance>limit)messages.push(`بدهی مشتری از حد اعتبار (${money(limit)}) گذشته است.`);return{...info,creditLimit:limit,has:messages.length>0,messages}}

function savePayment(){const date=solarToIso(document.getElementById('payDate').value),cid=document.getElementById('payCustomer').value,amount=toNum(document.getElementById('payAmount').value);if(!date)return toast('تاریخ صحیح نیست.','bad');if(!cid)return toast('مشتری انتخاب نشده است.','bad');if(amount<=0)return toast('مبلغ دریافت صحیح نیست.','bad');const bal=Math.max(0,customerBalance(cid));if(amount>bal&&bal>0&&!confirm('مبلغ دریافت از بدهی فعلی بیشتر است و اضافه آن پیش‌پرداخت می‌شود. ادامه می‌دهید؟'))return;const pay={id:uid(),date,customerId:cid,amount,method:document.getElementById('payMethod').value,note:document.getElementById('payNote').value.trim(),operator:currentOperator(),createdAt:nowISOTime()};db.payments.push(pay);addAuditLog('create','payment',{id:pay.id,title:(customerById(cid)?.name||'')+' - '+money(amount),after:pay,note:'دریافت از مشتری'});saveDB(false);toast('دریافت مشتری ثبت شد.');render()}

function deletePayment(id){if(!requireDeletePin('حذف دریافت مشتری'))return;const pay=db.payments.find(p=>p.id===id);if(!pay)return toast('دریافت یافت نشد.','bad');createInternalBackup('beforeDeletePayment');if(!confirm('دریافت حذف شود؟ مانده حساب مشتری دوباره محاسبه می‌شود.'))return;addAuditLog('delete','payment',{id:pay.id,title:(customerById(pay.customerId)?.name||'')+' - '+money(pay.amount),before:pay,note:'حذف دریافت مشتری'});db.payments=db.payments.filter(p=>p.id!==id);saveDB(false);toast('دریافت حذف شد و مانده حساب اصلاح گردید.','warn');render()}
function saveSupplierPayment(){const date=solarToIso(document.getElementById('supPayDate').value),sid=document.getElementById('supPaySupplier').value,amount=toNum(document.getElementById('supPayAmount').value);if(!date)return toast('تاریخ صحیح نیست.','bad');if(!sid)return toast('فروشنده انتخاب نشده است.','bad');if(amount<=0)return toast('مبلغ پرداخت صحیح نیست.','bad');const pay={id:uid(),date,supplierId:sid,amount,method:document.getElementById('supPayMethod').value,note:document.getElementById('supPayNote').value.trim(),createdAt:nowISOTime()};db.supplierPayments.push(pay);addAuditLog('create','supplierPayment',{id:pay.id,title:(customerById(sid)?.name||'')+' - '+money(amount),after:pay,note:'پرداخت به فروشنده'});saveDB(false);toast('پرداخت به فروشنده ثبت شد.');render()}
function renderSupplierPaymentsHistory(){const list=[...(db.supplierPayments||[])].sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt)).slice(0,20);if(!list.length)return '<div class="empty">هنوز پرداخت فروشنده ثبت نشده است.</div>';return `<div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>فروشنده</th><th>مبلغ</th><th>روش</th><th>عملیات</th></tr></thead><tbody>${list.map(p=>{const c=customerById(p.supplierId);return `<tr><td>${formatDate(p.date)}</td><td>${e(c?c.name:'-')}</td><td>${money(p.amount)}</td><td>${e(p.method||'-')}</td><td><button class="btn smallbtn bad" onclick="deleteSupplierPayment('${p.id}')">حذف</button></td></tr>`}).join('')}</tbody></table></div>`}

function saveExpense(){const date=solarToIso(document.getElementById('expenseDate').value),aid=document.getElementById('expenseAccount').value,amount=toNum(document.getElementById('expenseAmount').value);if(!date)return toast('تاریخ مصرف صحیح نیست.','bad');if(!aid)return toast('نوع مصرف انتخاب نشده است. اول یک حساب از نوع مصرف / خرج بسازید.','bad');if(amount<=0)return toast('مبلغ مصرف صحیح نیست.','bad');db.expenses.push({id:uid(),date,accountId:aid,amount,method:document.getElementById('expenseMethod').value,note:document.getElementById('expenseNote').value.trim(),createdAt:nowISOTime()});saveDB(false);toast('مصرف ثبت شد.');render()}

function accountLedger(id){let rows=[];db.sales.filter(s=>s.customerId===id).forEach(s=>rows.push({date:s.date,createdAt:s.createdAt,desc:'فروش فاکتور '+s.invoiceNo,recIn:s.total,recOut:s.paid,payIn:0,payOut:0,note:'مانده فاکتور: '+money(Math.max(0,toNum(s.total)-toNum(s.paid)))}));db.payments.filter(p=>p.customerId===id).forEach(p=>rows.push({date:p.date,createdAt:p.createdAt,desc:'دریافت از مشتری',recIn:0,recOut:p.amount,payIn:0,payOut:0,note:p.method||''}));db.purchases.filter(p=>p.supplierId===id).forEach(p=>rows.push({date:p.date,createdAt:p.createdAt,desc:'ورود کالا / خرید رسید '+(p.receiptNo||''),recIn:0,recOut:0,payIn:p.total,payOut:p.paid,note:'مانده ما: '+money(Math.max(0,toNum(p.total)-toNum(p.paid)))}));(db.supplierPayments||[]).filter(p=>p.supplierId===id).forEach(p=>rows.push({date:p.date,createdAt:p.createdAt,desc:'پرداخت به فروشنده',recIn:0,recOut:0,payIn:0,payOut:p.amount,note:p.method||''}));(db.expenses||[]).filter(x=>x.accountId===id).forEach(x=>rows.push({date:x.date,createdAt:x.createdAt,desc:'مصرف / خرج',recIn:0,recOut:0,payIn:x.amount,payOut:0,note:x.note||x.method||''}));rows.sort((a,b)=>(a.date+a.createdAt).localeCompare(b.date+b.createdAt));let rec=0,pay=0;return rows.map(r=>{rec=round2(rec+toNum(r.recIn)-toNum(r.recOut));pay=round2(pay+toNum(r.payIn)-toNum(r.payOut));return{...r,recBalance:rec,payBalance:pay,net:round2(rec-pay)}})}

function customerStatementText(id){const c=customerById(id);if(!c)return'';const sales=[...db.sales.filter(s=>s.customerId===id)].sort((a,b)=>(a.date+a.createdAt).localeCompare(b.date+b.createdAt));const pays=[...db.payments.filter(p=>p.customerId===id)].sort((a,b)=>(a.date+a.createdAt).localeCompare(b.date+b.createdAt));const totalSales=sales.reduce((a,s)=>a+toNum(s.total),0),paidInBills=sales.reduce((a,s)=>a+toNum(s.paid),0),extraPaid=pays.reduce((a,p)=>a+toNum(p.amount),0),bal=customerBalance(id);let lines=[];lines.push(db.settings.shopName||'فروشگاه هم‌گام');lines.push('صورت حساب مشتری');lines.push('----------------');lines.push('نام: '+c.name);if(c.phone)lines.push('شماره: '+c.phone);if(c.address)lines.push('آدرس: '+c.address);lines.push('تاریخ: '+formatDate(todayIso()));lines.push('');lines.push('مجموع خرید: '+money(totalSales));lines.push('پرداخت داخل فاکتورها: '+money(paidInBills));lines.push('آوردگی/پرداخت جداگانه: '+money(extraPaid));lines.push(bal>0?'مانده مشتری: '+money(bal):bal<0?'مطالبات مشتری از ما: '+money(Math.abs(bal)):'حساب صاف است');if(sales.length){lines.push('');lines.push('فاکتورها:');sales.slice(-15).forEach(s=>{const due=Math.max(0,toNum(s.total)-toNum(s.paid));const items=(s.items||[]).map(i=>fullProductNameFrom(i.category,i.productName)+' '+qty(i.qty)+' '+(i.unit||'')).join('، ');lines.push(`${formatDate(s.date)} | فاکتور ${s.invoiceNo||''} | ${items} | مجموع ${money(s.total)} | رسید ${money(s.paid)} | مانده ${money(due)}`)});if(sales.length>15)lines.push(`... و ${fmt(sales.length-15)} فاکتور دیگر`)}if(pays.length){lines.push('');lines.push('آوردگی‌ها:');pays.slice(-10).forEach(p=>lines.push(`${formatDate(p.date)} | ${money(p.amount)} | ${p.method||''} ${p.note?'- '+p.note:''}`));if(pays.length>10)lines.push(`... و ${fmt(pays.length-10)} پرداخت دیگر`)}lines.push('----------------');lines.push('تشکر');return lines.join('\n')}

function whatsappBalance(id){const c=customerById(id);const text=customerStatementText(id);try{navigator.clipboard?.writeText(text)}catch(e){}const msg=encodeURIComponent(text);let phone=String(c?.phone||'').replace(/\D/g,'');if(phone&&phone.startsWith('0'))phone='93'+phone.slice(1);const url=phone?`https://wa.me/${phone}?text=${msg}`:`whatsapp://send?text=${msg}`;try{window.open(url,'_blank');toast('صورت‌حساب برای واتساپ آماده شد.','good')}catch(err){alert(text)}}

function activateAccount(id){const c=customerById(id);if(!c)return;const before=auditClone(c);c.active=true;addAuditLog('activate','customer',{id:c.id,title:c.name,before,after:c,note:'فعال کردن حساب'});state.accountActionId=null;saveDB(false);toast('حساب فعال شد.','good');render()}
function deleteAccountFull(id){
  if(!requireDeletePin('حذف حساب مشتری'))return;
  const c=customerById(id);if(!c)return;
  const supplierRefs=db.purchases.some(p=>p.supplierId===id)||(db.supplierPayments||[]).some(p=>p.supplierId===id)||(db.expenses||[]).some(x=>x.accountId===id);
  if(supplierRefs)return toast('این حساب خرید/فروشنده یا مصرف دارد؛ حذف کامل برای جلوگیری از خرابی گزارش‌ها بسته شد. اگر لازم است، حساب را غیرفعال کنید.','bad');
  const sales=db.sales.filter(s=>s.customerId===id),payments=db.payments.filter(p=>p.customerId===id);
  if(!confirm(`حساب ${c.name} حذف شود؟\nفاکتورهای مشتری: ${sales.length}\nدریافت‌ها: ${payments.length}`))return;
  if(!confirm('این کار حساب و معاملات مشتری را حذف می‌کند و موجودی فاکتورها به انبار برمی‌گردد. بکاپ داخلی ساخته می‌شود. مطمئن هستید؟'))return;
  createInternalBackup('beforeDeleteAccount');
  sales.forEach(s=>{(s.items||[]).filter(i=>i.productId).forEach(i=>{const p=productById(i.productId);if(p){p.stock=round2(toNum(p.stock)+toNum(i.qty));addStockMove({...productSnapshot(i.productId,i),date:todayIso(),type:'sale_delete_return',qtyIn:i.qty,refType:'sale',refId:s.id,refNo:s.invoiceNo||'',party:s.customerName||c.name,note:'حذف حساب و برگشت فاکتور به انبار',balanceAfter:p.stock})}});pushTrash('sales',s);addAuditLog('delete','sale',{id:s.id,title:'فاکتور '+(s.invoiceNo||'')+' - '+(s.customerName||''),before:s,note:'حذف همراه حساب مشتری'})});
  payments.forEach(p=>addAuditLog('delete','payment',{id:p.id,title:c.name+' - '+money(p.amount),before:p,note:'حذف دریافت همراه حساب مشتری'}));
  addAuditLog('delete','customer',{id:c.id,title:c.name,before:c,note:`حذف حساب و ${sales.length} فاکتور / ${payments.length} دریافت`});
  db.sales=db.sales.filter(s=>s.customerId!==id);renumberSales();db.payments=db.payments.filter(p=>p.customerId!==id);db.customers=db.customers.filter(c=>c.id!==id);state.accountActionId=null;state.statementCustomerId=null;saveDB(false);toast('حساب حذف شد؛ فاکتورها به سطل حذف رفت و موجودی اصلاح شد.','warn');render()
}

function ensureAccountSaleState(customerId){if(!state.accountSale||state.accountSale.customerId!==customerId){state.accountSale={customerId,date:solarToday(),category:categories()[0]||'',discount:'0',paid:'0',method:'نقد',note:''};state.accountSaleCart=[]}}

function fillAccountSaleProductInfo(){
  const item=document.getElementById('accSaleItem'),unit=document.getElementById('accSaleUnit'),price=document.getElementById('accSalePrice');
  const p=findProductByText(item?.value||'');
  if(p){
    if(unit&&!unit.value)unit.value=p.unit||'';
    if(price&&!price.value&&toNum(p.sellPrice)>0)price.value=p.sellPrice;
  }
  updateAccSaleTotalFromUnit(false)
}
function updateAccSaleTotalFromUnit(force=true){
  const q=toNum(document.getElementById('accSaleQty')?.value||0),pr=toNum(document.getElementById('accSalePrice')?.value||0),tot=document.getElementById('accSaleTotal');
  if(tot&&q>0&&pr>0&&(force||!tot.value))tot.value=round2(q*pr)
}
function buildAccountSaleLineFromInputs(){
  const itemText=(document.getElementById('accSaleItem')?.value||'').trim();
  let q=toNum(document.getElementById('accSaleQty')?.value||0),unitText=(document.getElementById('accSaleUnit')?.value||'').trim(),price=toNum(document.getElementById('accSalePrice')?.value||0),lineTotal=toNum(document.getElementById('accSaleTotal')?.value||0);
  if(!itemText&&!q&&!price&&!lineTotal)return null;
  if(!itemText){toast('نام کالا یا شرح فروش را وارد کنید.','bad');return false}
  if(q<=0)q=1;
  if(lineTotal<=0&&price>0)lineTotal=round2(q*price);
  if(lineTotal>0&&price<=0)price=round2(lineTotal/q);
  if(lineTotal<=0){toast('مجموع فروش یا قیمت فی واحد را وارد کنید.','bad');return false}
  if(price<0||q<=0){toast('مقدار یا قیمت صحیح نیست.','bad');return false}
  const match=findProductByText(itemText);
  if(match){
    if(!unitText)unitText=match.unit||'';
    if(!db.settings.allowNegativeStock&&toNum(match.stock)<q){toast('موجودی '+match.name+' کافی نیست.','bad');return false}
    return {productId:match.id,category:productCategory(match),productName:match.name,unit:unitText,qty:q,price:price,cost:toNum(match.buyPrice),total:lineTotal,custom:false}
  }
  return {productId:null,category:'',productName:itemText,unit:unitText,qty:q,price:price,cost:0,total:lineTotal,custom:true}
}

nceAfter:p?toNum(p.stock):null})});addAuditLog('create','sale',{id:sale.id,title:'فاکتور '+sale.invoiceNo+' - '+sale.customerName,after:sale,note:'ثبت فروش'});state.lastSaleId=sale.id;state.accountSaleCart=[];state.accountSale={customerId,date:solarToday(),category:categories()[0]||'',discount:'0',paid:'0',method:'نقد',note:''};saveDB(false);toast('فاکتور '+sale.invoiceNo+' ثبت شد؛ '+fmt(sale.items.length)+' قلم ثبت و مانده '+money(Math.max(0,sale.due))+' شد.');render()}

function invoiceItemsText(items){return (items||[]).map(i=>{const title=e(fullProductNameFrom(i.category,i.productName));const retQty=toNum(i.returnedQty||0),retAmount=toNum(i.returnedAmount||0);const ret=retQty||retAmount?` <span class="muted small">(برگشت: ${retQty?qty(retQty)+' '+e(i.unit||''):''}${retQty&&retAmount?' / ':''}${retAmount?money(retAmount):''})</span>`:'';const line=`${qty(i.qty||1)} ${e(i.unit||'')} × ${money(i.price||0)} = ${money(i.total??(toNum(i.qty)*toNum(i.price)))}`;return `${i.custom?e(i.productName):title} — ${line}${ret}`}).join('<br>')||'-'}
function saleHasReturns(s){return !!((s?.returns||[]).length||toNum(s?.returnTotal||0)>0||(s?.items||[]).some(i=>toNum(i.returnedQty||0)||toNum(i.returnedAmount||0)))}
function saleLineReturnedQty(s,idx){const item=(s.items||[])[idx]||{};const fromItem=toNum(item.returnedQty||0);if(fromItem)return fromItem;return (s.returns||[]).reduce((a,r)=>a+(r.items||[]).filter(x=>toNum(x.lineIndex)===idx).reduce((b,x)=>b+toNum(x.qty),0),0)}
function saleLineReturnedAmount(s,idx){const item=(s.items||[])[idx]||{};const fromItem=toNum(item.returnedAmount||0);if(fromItem)return fromItem;return (s.returns||[]).reduce((a,r)=>a+(r.items||[]).filter(x=>toNum(x.lineIndex)===idx).reduce((b,x)=>b+toNum(x.amount),0),0)}
function saleLineOriginalQty(s,idx){const item=(s.items||[])[idx]||{};const rq=saleLineReturnedQty(s,idx);return round2(item.originalQty!==undefined?toNum(item.originalQty):toNum(item.qty)+rq)}
function saleLineOriginalAmount(s,idx){const item=(s.items||[])[idx]||{};const ra=saleLineReturnedAmount(s,idx);return round2(item.originalTotal!==undefined?toNum(item.originalTotal):toNum(item.total)+ra)}
function saleReturnSummaryHtml(s){if(!saleHasReturns(s))return '';const list=(s.returns||[]).slice().sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt));return `<div class="sale-return-summary"><div class="sale-return-summary-head"><b>برگشت ثبت‌شده</b><span>${money(toNum(s.returnTotal||list.reduce((a,r)=>a+toNum(r.amount),0)))}</span></div>${list.length?`<div class="sale-return-mini-list">${list.map(r=>`<div><span>${formatDate(r.date)}</span><b>${money(r.amount||r.grossAmount||0)}</b>${r.note?`<small>${e(r.note)}</small>`:''}</div>`).join('')}</div>`:''}</div>`}

function registerSaleReturn(id){

function renderSearch(){const q=state.globalSearch||'';const results=buildSearchResults(q);return `<div class="search-page"><div class="search-hero"><div class="search-hero-main"><div class="search-hero-icon">${iconSvg('search')}</div><div><h3>جستجوی همه پایگاه داده</h3><p>مشتری، فاکتور، جنس، ورود کالا، مصرف و حرکت انبار را یکجا پیدا کنید.</p></div></div><span class="badge info" id="searchResultCount">${fmt(results.length)} نتیجه</span></div><div class="search-box-main"><div class="global-search-input">${iconSvg('search')}<input id="globalSearchInput" placeholder="نام مشتری، شماره، شماره فاکتور، جنس، تاریخ، مبلغ..." value="${e(q)}" oninput="updateSearchResults()" onkeydown="if(event.key==='Enter')updateSearchResults()"></div></div><div id="searchResultsWrap">${renderSearchResults(q)}</div></div>`}

function duplicateCount(arr,keyFn){const seen=new Set(),dups=new Set();arr.forEach(x=>{const k=keyFn(x);if(!k)return;if(seen.has(k))dups.add(k);seen.add(k)});return dups.size}
function expectedStockByDocs(){const map={};(db.products||[]).forEach(p=>map[p.id]=0);(db.purchases||[]).forEach(p=>(p.items||[]).forEach(i=>{if(i.productId)map[i.productId]=(map[i.productId]||0)+toNum(i.qty)}));(db.sales||[]).forEach(s=>(s.items||[]).forEach((i,idx)=>{if(!i.productId)return;const returned=saleLineReturnedQty?saleLineReturnedQty(s,idx):toNum(i.returnedQty||0);const sold=i.originalQty!==undefined?toNum(i.originalQty):toNum(i.qty)+returned;map[i.productId]=(map[i.productId]||0)-Math.max(0,round2(sold-returned))}));(db.adjustments||[]).forEach(a=>{map[a.productId]=(map[a.productId]||0)+toNum(a.qtySigned)});return map}
function dbHealthReport(){const issues=[];const prodIds=new Set((db.products||[]).map(p=>p.id)),custIds=new Set((db.customers||[]).map(c=>c.id));const missingSaleProducts=(db.sales||[]).reduce((n,s)=>n+(s.items||[]).filter(i=>i.productId&&!prodIds.has(i.productId)).length,0);if(missingSaleProducts)issues.push({type:'bad',title:'فروش با جنس حذف‌شده',desc:'بعضی اقلام فروش به جنس موجود وصل نیست.',count:missingSaleProducts});const missingPurchaseProducts=(db.purchases||[]).reduce((n,p)=>n+(p.items||[]).filter(i=>i.productId&&!prodIds.has(i.productId)).length,0);if(missingPurchaseProducts)issues.push({type:'bad',title:'ورود کالا با جنس حذف‌شده',desc:'بعضی اقلام ورود کالا به جنس موجود وصل نیست.',count:missingPurchaseProducts});const missingCustomers=(db.sales||[]).filter(s=>s.customerId&&!custIds.has(s.customerId)).length+(db.payments||[]).filter(p=>p.customerId&&!custIds.has(p.customerId)).length;if(missingCustomers)issues.push({type:'warn',title:'معامله با مشتری حذف‌شده',desc:'بعضی فاکتورها یا پرداخت‌ها مشتری ندارند.',count:missingCustomers});const dupInv=duplicateCount(db.sales||[],s=>s.invoiceNo);if(dupInv)issues.push({type:'warn',title:'شماره فاکتور تکراری',desc:'شماره فاکتورهای تکراری پیدا شد.',count:dupInv});const dupRec=duplicateCount(db.purchases||[],p=>p.receiptNo);if(dupRec)issues.push({type:'warn',title:'شماره رسید تکراری',desc:'شماره رسیدهای ورود کالا تکراری است.',count:dupRec});const negStock=(db.products||[]).filter(p=>toNum(p.stock)<0).length;if(negStock)issues.push({type:'bad',title:'موجودی منفی',desc:'بعضی کالاها موجودی منفی دارند.',count:negStock});const expected=expectedStockByDocs();const stockMismatch=(db.products||[]).filter(p=>Math.abs(round2(toNum(p.stock)-toNum(expected[p.id]||0)))>0.0001).length;if(stockMismatch)issues.push({type:'warn',title:'اختلاف موجودی با اسناد',desc:'موجودی بعضی کالاها با فروش/ورود/اصلاحات برابر نیست.',count:stockMismatch});if(!(db.stockMoves||[]).length&&(db.sales.length||db.purchases.length||db.adjustments.length))issues.push({type:'warn',title:'حرکت انبار ساخته نشده',desc:'تاریخچه حرکت انبار خالی است.',count:1});return issues}
function dbHealthHtml(){const issues=dbHealthReport();const status=issues.some(x=>x.type==='bad')?'bad':issues.length?'warn':'good';const text=status==='good'?'سالم':status==='warn'?'نیاز به بررسی':'مشکل جدی';return `<div class="db-health"><div class="db-health-head"><h3>سلامت پایگاه داده</h3><span class="db-health-status ${status}">${text}</span></div><p class="muted small">این بخش شماره‌ها، موجودی، ارتباط فاکتورها با مشتری/جنس، حرکت انبار و ساختار پایگاه داده را بررسی می‌کند.</p>${issues.length?`<div class="db-issue-list">${issues.map(x=>`<div class="db-issue"><div><b>${e(x.title)}</b><br><span>${e(x.desc)}</span></div><div class="count">${fmt(x.count)}</div></div>`).join('')}</div>`:'<div class="empty">مشکل مهمی یافت نشد.</div>'}<div class="db-health-actions"><button class="btn secondary" onclick="repairLightDatabase()">ترمیم سبک</button><button class="btn warn" onclick="rebuildStockMovementOnly()">بازسازی حرکت انبار</button><button class="btn bad" onclick="syncStockFromDocuments()">همسان‌سازی موجودی</button></div></div>`}
function repairLightDatabase(){renumberSales();renumberPurchases();db.products.forEach(p=>{if(!p.category)p.category=p.name||'عمومی';if(p.active===undefined)p.active=true});db.customers.forEach(c=>{if(!c.type)c.type='customer';if(c.active===undefined)c.active=true});addAuditLog('update','system',{title:'ترمیم سبک پایگاه داده',note:'تنظیم شماره‌ها و ساختار پایه'});saveDB(false);toast('ترمیم سبک انجام شد.','good');render()}
function rebuildStockMovementOnly(){if(!confirm('حرکت انبار از روی اسناد فعلی بازسازی شود؟'))return;db.stockMoves=rebuildStockMoves(db);db.meta.stockMovesBuilt=true;addAuditLog('update','system',{title:'بازسازی حرکت انبار',note:'حرکت‌ها از روی فروش، ورود کالا و اصلاحات ساخته شد'});saveDB(false);toast('حرکت انبار بازسازی شد.','good');render()}
function syncStockFromDocuments(){if(!requireDeletePin('همسان‌سازی موجودی انبار'))return;createInternalBackup('beforeSyncStock');if(!confirm('موجودی کالاها از روی اسناد فروش/ورود/اصلاحات دوباره محاسبه شود؟'))return;if(!confirm('این کار موجودی فعلی انبار را تغییر می‌دهد. مطمئن هستید؟'))return;const before=auditClone(db.products);const expected=expectedStockByDocs();db.products.forEach(p=>p.stock=round2(expected[p.id]||0));db.stockMoves=rebuildStockMoves(db);db.meta.stockMovesBuilt=true;addAuditLog('update','system',{title:'همسان‌سازی موجودی',before,after:db.products,note:'موجودی از روی اسناد محاسبه شد'});saveDB(false);toast('موجودی با اسناد همسان‌سازی شد.','warn');render()}
function pushTrash(kind,record){db.trash=db.trash||{};db.trash[kind]=db.trash[kind]||[];db.trash[kind].unshift({id:uid(),deletedAt:nowISOTime(),date:todayIso(),record:auditClone(record)});if(db.trash[kind].length>100)db.trash[kind]=db.trash[kind].slice(0,100)}
function renderTrashBin(){const sales=(db.trash?.sales||[]),purchases=(db.trash?.purchases||[]);if(!sales.length&&!purchases.length)return '<div class="empty">سطل حذف خالی است.</div>';return `<div class="table-wrap"><table><thead><tr><th>نوع</th><th>شرح</th><th>تاریخ حذف</th><th>عملیات</th></tr></thead><tbody>${sales.map(t=>{const r=t.record||{};return `<tr><td>فاکتور فروش</td><td><b>${e(r.invoiceNo||'')}</b> — ${e(r.customerName||'')}<br><span class="muted small">${money(r.total||0)}</span></td><td>${formatDate(t.date)}</td><td><button class="btn smallbtn good" onclick="restoreDeletedSale('${t.id}')">بازیابی</button></td></tr>`}).join('')}${purchases.map(t=>{const r=t.record||{};return `<tr><td>ورود کالا</td><td><b>${e(r.receiptNo||'')}</b> — ${e(r.supplier||'')}<br><span class="muted small">${money(r.total||0)}</span></td><td>${formatDate(t.date)}</td><td><button class="btn smallbtn good" onclick="restoreDeletedPurchase('${t.id}')">بازیابی</button></td></tr>`}).join('')}</tbody></table></div><div class="toolbar" style="margin-top:10px"><button class="btn bad" onclick="clearTrashBin()">پاک‌سازی سطل حذف</button></div>`}
function restoreDeletedSale(tid){const t=(db.trash?.sales||[]).find(x=>x.id===tid);if(!t)return;const sale=auditClone(t.record);if(!sale)return;for(const i of (sale.items||[]).filter(x=>x.productId)){const p=productById(i.productId);if(!p)return toast('برای بازیابی فاکتور، کالا یافت نشد.','bad');if(!db.settings.allowNegativeStock&&toNum(p.stock)<toNum(i.qty))return toast('برای بازیابی فاکتور، موجودی '+(p?p.name:'جنس')+' کافی نیست.','bad')}if(!confirm('این فاکتور بازیابی شود؟ موجودی کالاها دوباره از انبار کم می‌شود.'))return;(sale.items||[]).filter(x=>x.productId).forEach(i=>{const p=productById(i.productId);if(p){p.stock=round2(toNum(p.stock)-toNum(i.qty));addStockMove({...productSnapshot(i.productId,i),date:todayIso(),type:'sale_out',qtyOut:i.qty,refType:'sale',refId:sale.id,refNo:sale.invoiceNo||'',party:sale.customerName||'',note:'بازیابی فاکتور حذف‌شده',balanceAfter:p.stock})}});if(db.sales.some(s=>s.id===sale.id))sale.id=uid();db.sales.push(sale);renumberSales();db.trash.sales=db.trash.sales.filter(x=>x.id!==tid);addAuditLog('create','sale',{id:sale.id,title:'بازیابی فاکتور '+(sale.invoiceNo||''),after:sale,note:'بازیابی از سطل حذف'});saveDB(false);toast('فاکتور بازیابی شد.','good');render()}
function restoreDeletedPurchase(tid){const t=(db.trash?.purchases||[]).find(x=>x.id===tid);if(!t)return;const pur=auditClone(t.record);if(!pur)return;if(!confirm('این رسید ورود کالا بازیابی شود؟ موجودی کالاها دوباره به انبار اضافه می‌شود.'))return;(pur.items||[]).forEach(i=>{const p=productById(i.productId);if(p){p.stock=round2(toNum(p.stock)+toNum(i.qty));addStockMove({...productSnapshot(i.productId,i),date:todayIso(),type:'purchase_in',qtyIn:i.qty,refType:'purchase',refId:pur.id,refNo:pur.receiptNo||'',party:pur.supplier||'',note:'بازیابی ورود کالا حذف‌شده',balanceAfter:p.stock})}});if(db.purchases.some(p=>p.id===pur.id))pur.id=uid();db.purchases.push(pur);renumberPurchases();db.trash.purchases=db.trash.purchases.filter(x=>x.id!==tid);addAuditLog('create','purchase',{id:pur.id,title:'بازیابی رسید '+(pur.receiptNo||''),after:pur,note:'بازیابی از سطل حذف'});saveDB(false);toast('رسید ورود کالا بازیابی شد.','good');render()}
function clearTrashBin(){if(!requireDeletePin('پاک‌سازی سطل حذف'))return;createInternalBackup('beforeClearTrash');if(!confirm('سطل حذف کاملاً خالی شود؟ بعداً بازیابی ممکن نیست.'))return;db.trash={sales:[],purchases:[],customers:[]};addAuditLog('delete','system',{title:'پاک‌سازی سطل حذف',note:'تمام موارد حذف‌شده پاک شد'});saveDB(false);toast('سطل حذف خالی شد.','warn');render()}
function xmlEscape(v){return String(v??'').replace(/[<>&"']/g,ch=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[ch]))}
function excelCell(v){const isNum=typeof v==='number'&&isFinite(v);return `<Cell><Data ss:Type="${isNum?'Number':'String'}">${xmlEscape(isNum?round2(v):v)}</Data></Cell>`}
function excelSheet(name,rows){return `<Worksheet ss:Name="${xmlEscape(String(name).slice(0,31))}"><Table>${rows.map(r=>`<Row>${r.map(excelCell).join('')}</Row>`).join('')}</Table></Worksheet>`}
function exportExcelXml(){const sheets=[];sheets.push(excelSheet('Customers', [['نام','تلفن','آدرس','حد اعتبار','مانده مشتری','فعال','یادداشت'],...(db.customers||[]).map(c=>[c.name,c.phone,c.address,toNum(c.creditLimit||0),customerBalance(c.id),c.active===false?'نه':'بله',c.note])]));sheets.push(excelSheet('Products', [['کالای اصلی','نوع','واحد','موجودی','حداقل هشدار','فعال'],...(db.products||[]).map(p=>[productCategory(p),p.name,p.unit,toNum(p.stock),toNum(p.minStock),p.active===false?'نه':'بله'])]));sheets.push(excelSheet('Sales', [['شماره فاکتور','تاریخ','مشتری','مجموع','پرداخت','مانده','روش','یادداشت'],...(db.sales||[]).map(s=>[s.invoiceNo,formatDate(s.date),s.customerName,toNum(s.total),toNum(s.paid),Math.max(0,toNum(s.total)-toNum(s.paid)),s.paymentMethod,s.note])]));sheets.push(excelSheet('Sale Items', [['شماره فاکتور','تاریخ','مشتری','جنس','مقدار','واحد','قیمت','جمع'],...(db.sales||[]).flatMap(s=>(s.items||[]).map(i=>[s.invoiceNo,formatDate(s.date),s.customerName,fullProductNameFrom(i.category,i.productName),toNum(i.qty),i.unit,toNum(i.price),toNum(i.total)]))]));sheets.push(excelSheet('Purchases', [['شماره رسید','تاریخ','فروشنده','مجموع','پرداخت','مانده','روش','یادداشت'],...(db.purchases||[]).map(p=>[p.receiptNo,formatDate(p.date),p.supplier,toNum(p.total),toNum(p.paid),Math.max(0,toNum(p.total)-toNum(p.paid)),p.method,p.note])]));sheets.push(excelSheet('Purchase Items', [['شماره رسید','تاریخ','فروشنده','جنس','مقدار','واحد','قیمت خرید','جمع'],...(db.purchases||[]).flatMap(p=>(p.items||[]).map(i=>[p.receiptNo,formatDate(p.date),p.supplier,fullProductNameFrom(i.category,i.productName),toNum(i.qty),i.unit,toNum(i.cost),toNum(i.total)]))]));sheets.push(excelSheet('Customer Payments', [['تاریخ','مشتری','مبلغ','روش','یادداشت'],...(db.payments||[]).map(p=>{const c=customerById(p.customerId);return[formatDate(p.date),c?c.name:'',toNum(p.amount),p.method,p.note]})]));sheets.push(excelSheet('Supplier Payments', [['تاریخ','فروشنده','مبلغ','روش','یادداشت'],...(db.supplierPayments||[]).map(p=>{const c=customerById(p.supplierId);return[formatDate(p.date),c?c.name:'',toNum(p.amount),p.method,p.note]})]));sheets.push(excelSheet('Expenses', [['تاریخ','دسته','شرح','مبلغ','روش','یادداشت'],...(db.expenses||[]).map(x=>[formatDate(x.date),x.category||'عمومی',x.description||x.note,toNum(x.amount),x.method,x.note])]));sheets.push(excelSheet('Sale Returns', [['شماره فاکتور','تاریخ','مشتری','جنس','مقدار','واحد','مبلغ','یادداشت'],...(db.sales||[]).flatMap(s=>(s.returns||[]).flatMap(r=>(r.items||[]).map(i=>[s.invoiceNo,formatDate(r.date),s.customerName,fullProductNameFrom(i.category,i.productName),toNum(i.qty),i.unit,toNum(i.amount),r.note])))]));sheets.push(excelSheet('Stock Moves', [['تاریخ','جنس','نوع حرکت','داخل','بیرون','قبل','بعد','واحد','مرجع','حساب','کاربر','یادداشت'],...(db.stockMoves||[]).map(m=>[formatDate(m.date),fullProductNameFrom(m.category,m.productName),stockMoveTypeLabel(m.type),toNum(m.qtyIn),toNum(m.qtyOut),m.balanceBefore??'',m.balanceAfter??'',m.unit,m.refNo,m.party,m.operator||'',m.note])]));sheets.push(excelSheet('Audit Logs', [['تاریخ','عمل','بخش','شرح','یادداشت'],...(db.auditLogs||[]).map(a=>[formatDate(a.date),auditActionLabel(a.action),auditEntityLabel(a.entity),a.title,a.note])]));const xml=`<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><DocumentProperties xmlns="urn:schemas-microsoft-com:office:office"><Title>Hamgam Full Export</Title><Created>${nowISOTime()}</Created></DocumentProperties><Styles><Style ss:ID="Default"><Alignment ss:Vertical="Center"/><Font ss:FontName="Tahoma" ss:Size="11"/></Style></Styles>${sheets.join('')}</Workbook>`;downloadFile('hamgam-full-export-'+todayIso()+'.xml',xml,'application/xml;charset=utf-8');toast('خروجی کامل Excel XML آماده شد.','good')}
function renderSettings(){
  const last=db.settings.lastBackupDate?formatDate(db.settings.lastBackupDate):'هیچ وقت';
  return `<div class="settings-v2 hybrid-section"><div class="settings-hero"><div><h3>مدیریت برنامه</h3><p>کارهای روزانه ساده بماند؛ ابزارهای پیشرفته در اینجا جمع شده‌اند.</p></div><div class="settings-pill">${storageMode==='IndexedDB'?'IndexedDB آفلاین':'LocalStorage آفلاین'}</div></div><div class="settings-card full"><div class="panel-title"><div><h3>تنظیمات عمومی</h3><span class="daily-badge">مورد نیاز روزانه نیست</span></div></div><form onsubmit="saveSettings(event)"><div class="form-grid two"><div class="field"><label>نام فروشگاه</label><input id="setShop" value="${e(db.settings.shopName||'')}"></div><div class="field"><label>نام مسئول</label><input id="setOwner" value="${e(db.settings.ownerName||'')}"></div><div class="field"><label>تلفن</label><input id="setPhone" value="${e(db.settings.phone||'')}"></div><div class="field"><label>آدرس</label><input id="setAddress" value="${e(db.settings.address||'')}"></div><div class="field"><label>عرض فاکتور کوچک</label><select id="setReceiptWidth"><option value="80" ${(db.settings.receiptWidth||'80')==='80'?'selected':''}>۸۰ میلی‌متر</option><option value="58" ${(db.settings.receiptWidth||'80')==='58'?'selected':''}>۵۸ میلی‌متر</option></select></div><div class="field"><label>حالت ظاهری</label><select id="setTheme"><option value="light" ${(db.settings.theme||'light')==='light'?'selected':''}>روشن</option><option value="dark" ${(db.settings.theme||'light')==='dark'?'selected':''}>تیره</option></select></div><div class="field"><label>فروش با موجودی ناکافی</label><select id="setAllowNegativeStock"><option value="no" ${!db.settings.allowNegativeStock?'selected':''}>ممنوع</option><option value="yes" ${db.settings.allowNegativeStock?'selected':''}>با اجازه مدیر</option></select></div><div class="field"><label>شروع شماره فاکتور فروش</label><input id="setInvoiceStart" inputmode="numeric" value="${e(db.settings.invoiceStart||1)}"></div><div class="field"><label>شروع شماره رسید ورود کالا</label><input id="setReceiptStart" inputmode="numeric" value="${e(db.settings.receiptStart||1)}"></div><div class="field"><label>هشدار پس از چند روز بدهی</label><input id="setDebtWarnDays" inputmode="numeric" value="${e(db.settings.debtWarnDays||30)}"></div><div class="field"><label>حد مبلغ هشدار بدهی</label><input id="setDebtWarnAmount" inputmode="decimal" value="${e(db.settings.debtWarnAmount||10000)}"></div><div class="field" style="grid-column:1/-1"><label>متن پایین فاکتور</label><input id="setFooter" value="${e(db.settings.receiptFooter||'')}"></div></div><div class="toolbar" style="margin-top:12px"><button class="btn good" type="submit">ذخیره تنظیمات</button></div></form></div><details class="settings-fold" open><summary>بکاپ و خروجی</summary><div class="settings-fold-body"><div class="advanced-note">آخرین بکاپ: <b>${last}</b><br>بکاپ کامل شامل همه اطلاعات، آمار و امضای صحت است.</div>${dbStatsHtml()}<div class="settings-quick-grid" style="margin-top:12px"><button class="btn secondary" onclick="exportBackup()">دانلود بکاپ کامل</button><button class="btn secondary" onclick="exportExcelXml()">خروجی کامل Excel</button><label class="btn ghost">وارد کردن بکاپ <input type="file" accept="application/json" style="display:none" onchange="importBackup(this)"></label><button class="btn secondary" onclick="exportStockCsv()">CSV موجودی</button><button class="btn secondary" onclick="exportCustomersCsv()">CSV مشتریان</button></div></div></details><details class="settings-fold"><summary>بکاپ خودکار داخلی</summary><div class="settings-fold-body"><div class="advanced-note">برنامه روزانه یک بکاپ داخلی می‌سازد و پیش از عملیات حساس نیز بکاپ می‌گیرد. این بکاپ‌ها داخل همین مرورگر نگهداری می‌شوند.</div><div class="form-grid" style="margin-top:12px"><div class="field"><label>تعداد بکاپ‌های اخیر برای نگهداری</label><input id="setInternalBackupLimit" inputmode="numeric" value="${e(db.settings.internalBackupLimit||7)}"></div><div class="field"><label>&nbsp;</label><button class="btn secondary" onclick="createInternalBackup('manual')">ساخت بکاپ داخلی اکنون</button></div></div><div style="margin-top:12px">${renderInternalBackups()}</div><div class="toolbar" style="margin-top:12px"><button class="btn bad" onclick="clearInternalBackups()">پاک‌سازی بکاپ‌های داخلی</button></div></div></details><details class="settings-fold"><summary>رمز حذف و ریست</summary><div class="settings-fold-body"><div class="advanced-note">برای حذف فاکتور، حذف رسید، حذف حساب، حذف اصلاحات، پاک‌سازی سطل حذف و ریست کامل برنامه این رمز خواسته می‌شود. حالت فعلی: <b>${db.settings.deletePinHash?'فعال':'غیرفعال'}</b></div><div class="form-grid three" style="margin-top:12px"><div class="field"><label>رمز فعلی ${db.settings.deletePinHash?'':'(لازم نیست)'}</label><input id="setDeletePinCurrent" type="password" inputmode="numeric" maxlength="6"></div><div class="field"><label>رمز جدید ۴ تا ۶ رقم</label><input id="setDeletePinNew" type="password" inputmode="numeric" maxlength="6"></div><div class="field"><label>تکرار رمز جدید</label><input id="setDeletePinConfirm" type="password" inputmode="numeric" maxlength="6"></div></div><div class="toolbar" style="margin-top:12px"><button class="btn good" onclick="saveDeletePinSettings()">ذخیره رمز</button><button class="btn ghost" onclick="disableDeletePin()">غیرفعال کردن رمز</button></div></div></details><details class="settings-fold"><summary>سلامت و ترمیم پایگاه داده</summary><div class="settings-fold-body">${dbHealthHtml()}</div></details><details class="settings-fold"><summary>سطل حذف و بازیابی</summary><div class="settings-fold-body"><div class="advanced-note">فاکتورها و رسیدهای حذف‌شده تا ۱۰۰ مورد آخر اینجا نگهداری می‌شوند و قابل بازیابی هستند.</div>${renderTrashBin()}</div></details><details class="settings-fold"><summary>ریست برنامه</summary><div class="settings-fold-body"><div class="advanced-note">اگر می‌خواهید برنامه از صفر شروع شود، این دکمه همه اطلاعات را پاک می‌کند و پایگاه داده نو می‌سازد. پیش از ریست حتماً بکاپ بگیرید.</div><div class="toolbar" style="margin-top:12px"><button class="btn bad" onclick="resetDatabase()">ریست کامل و حذف همه اطلاعات</button></div></div></details><details class="settings-fold"><summary>راهنمای کوتاه استفاده</summary><div class="settings-fold-body"><div class="guide-list"><div class="guide-item">در «انبار و کالاها» کالای اصلی و نوع/مدل هر کالا را ثبت کنید.</div><div class="guide-item">هر وقت کالا وارد شد، از بخش «ورود کالا» ثبت کنید تا به انبار همان نوع اضافه شود.</div><div class="guide-item">برای فروش، وارد حساب مشتری شوید و از تب «بردگی» کالا را ثبت کنید.</div><div class="guide-item">برای دریافت وجه مشتری، داخل پروفایل مشتری از تب «آوردگی» استفاده کنید.</div><div class="guide-item">هر روز یا هر هفته از همین بخش بکاپ بگیرید.</div></div></div></details></div>`
}
function saveSettings(ev){ev.preventDefault();Object.assign(db.settings,{shopName:document.getElementById('setShop').value.trim(),ownerName:document.getElementById('setOwner').value.trim(),phone:document.getElementById('setPhone').value.trim(),address:document.getElementById('setAddress').value.trim(),receiptFooter:document.getElementById('setFooter').value.trim(),receiptWidth:document.getElementById('setReceiptWidth')?document.getElementById('setReceiptWidth').value:(db.settings.receiptWidth||'80'),theme:document.getElementById('setTheme')?document.getElementById('setTheme').value:(db.settings.theme||'light'),allowNegativeStock:(document.getElementById('setAllowNegativeStock')?.value==='yes'),invoiceStart:Math.max(1,Math.floor(toNum(document.getElementById('setInvoiceStart')?.value||db.settings.invoiceStart||1))),receiptStart:Math.max(1,Math.floor(toNum(document.getElementById('setReceiptStart')?.value||db.settings.receiptStart||1))),debtWarnDays:Math.max(1,Math.floor(toNum(document.getElementById('setDebtWarnDays')?.value||db.settings.debtWarnDays||30))),debtWarnAmount:Math.max(0,toNum(document.getElementById('setDebtWarnAmount')?.value||db.settings.debtWarnAmount||10000)),internalBackupLimit:Math.max(1,Math.floor(toNum(document.getElementById('setInternalBackupLimit')?.value||db.settings.internalBackupLimit||7)))});renumberSales();renumberPurchases();saveDB(false);toast('تنظیمات ذخیره شد و شماره‌ها تنظیم شد.');render()}
function printHtml(html,mode='normal'){const style=`<style>body{font-family:Tahoma,Arial,sans-serif;direction:rtl;padding:12px;color:#111}.receipt{max-width:900px;margin:auto}.receipt h2,.receipt h3{text-align:center;margin:6px 0}.receipt-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:6px;text-align:right}.totals{margin-top:10px;border:1px solid #ddd;border-radius:10px;padding:10px}.row{display:flex;justify-content:space-between;margin:4px 0}.grand{font-weight:900}@media print{button{display:none}}</style>`;try{const w=window.open('','_blank');if(w&&w.document){w.document.open();w.document.write(`<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>چاپ</title>${style}</head><body>${html}<script>setTimeout(()=>{window.print()},250)<\/script></body></html>`);w.document.close();return}}catch(err){}const p=document.getElementById('printArea');p.className='print-area '+(mode==='thermal'?'thermal':'');p.innerHTML=html;setTimeout(()=>{try{window.print()}catch(e){alert('چاپ در این مرورگر پشتیبانی نشد. از منوی مرورگر گزینه Print را بزنید.')}setTimeout(()=>{p.className='print-area'},500)},120)}
function downloadFile(name,content,type='application/json;charset=utf-8'){const blob=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportBackup(){db.settings.lastBackupDate=todayIso();const pkg=makeBackupPackage();saveDB(false);downloadFile('hamgam-backup-full-'+todayIso()+'.json',JSON.stringify(pkg,null,2));toast('بکاپ کامل با امضای صحت آماده دانلود شد.','good');render()}
function importBackup(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);const rawData=parseBackupObject(parsed);const data=ensureDB(rawData);const st=dbStats(data);if(!confirm(`بکاپ وارد شود؟\nمشتری: ${st.customers} | جنس: ${st.products} | فاکتور: ${st.sales}\nاطلاعات فعلی با بکاپ جایگزین می‌شود.`))return;try{localStorage.setItem(DB_KEY+'_safety_before_import',JSON.stringify(makeBackupPackage()))}catch(e){}createInternalBackup('beforeImport');db=data;saveDB(false);state={...state,view:'dashboard',saleCart:[],purchaseCart:[],lastSaleId:null,editSaleId:null,returnSaleId:null,accountAddMode:false,accountActionId:null,accountFilter:'active',accountBalanceFilter:'all',accountSort:'name',accountProfileTab:'history',accountSaleCart:[],accountSale:null,unlocked:true};toast('بکاپ بررسی و وارد شد.','good');render()}catch(err){console.error(err);toast(err.message==='checksum'?'فایل بکاپ خراب است یا تغییر کرده است.':'فایل بکاپ صحیح نیست.','bad')}};reader.readAsText(file);input.value=''}
function resetDatabase(){if(!requireDeletePin('ریست کامل برنامه'))return;createInternalBackup('beforeReset');if(!confirm('ریست کامل انجام شود؟ تمام مشتریان، فاکتورها، انبار، گزارشات و بکاپ داخلی حذف می‌شود.'))return;if(!confirm('این کار برگشت ندارد مگر بکاپ دانلود کرده باشید. مطمئن هستید؟'))return;if(!confirm('تأیید نهایی: همه اطلاعات پاک شود؟'))return;try{localStorage.removeItem(DB_KEY);localStorage.removeItem(DB_KEY+'_migrated_to_indexeddb');localStorage.removeItem(DB_KEY+'_safety_before_import')}catch(e){}db=initDB();state={...state,view:'dashboard',saleCart:[],purchaseCart:[],sale:null,purchase:null,productEditId:null,productProfileId:null,customerEditId:null,statementCustomerId:null,lastSaleId:null,editSaleId:null,returnSaleId:null,accountAddMode:false,accountActionId:null,accountFilter:'active',accountBalanceFilter:'all',accountSort:'name',accountProfileTab:'history',accountSaleCart:[],accountSale:null,globalSearch:'',unlocked:true};saveDB(false);toast('برنامه ریست شد و پایگاه داده نو ساخته شد.','warn');render()}
function toCsv(rows){return rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n')}
function exportStockCsv(){const rows=[['کالای اصلی','نوع/مدل','واحد','موجودی','حداقل','فعال']].concat(db.products.map(p=>[productCategory(p),p.name,p.unit,p.stock,p.minStock,p.active!==false?'بله':'نخیر']));downloadFile('stock-'+todayIso()+'.csv','\ufeff'+toCsv(rows),'text/csv;charset=utf-8')}
function exportCustomersCsv(){const rows=[['نام','نوع','تلفن','آدرس','حد اعتبار','مطالبات ما','بدهی ما','مصرف کل']].concat(db.customers.map(c=>[c.name,accountTypeLabel(c.type),c.phone,c.address,toNum(c.creditLimit||0),accountReceivable(c.id),accountPayable(c.id),expenseTotal(c.id)]));downloadFile('accounts-'+todayIso()+'.csv','\ufeff'+toCsv(rows),'text/csv;charset=utf-8')}
function exportSalesCsv(){const rows=[['تاریخ','بل','مشتری','مجموع','پرداخت','مانده','اقلام']].concat(db.sales.map(s=>[formatDate(s.date),s.invoiceNo,s.customerName,s.total,s.paid,Math.max(0,toNum(s.total)-toNum(s.paid)),s.items.map(i=>fullProductNameFrom(i.category,i.productName)+' '+i.qty+' '+i.unit).join(' | ')]));downloadFile('sales-'+todayIso()+'.csv','\ufeff'+toCsv(rows),'text/csv;charset=utf-8')}
function exportPurchasesCsv(){const rows=[['تاریخ','فروشنده','مجموع','پرداخت','مانده','اقلام']].concat(db.purchases.map(p=>[formatDate(p.date),p.supplier,p.total,p.paid,Math.max(0,toNum(p.total)-toNum(p.paid)),p.items.map(i=>fullProductNameFrom(i.category,i.productName)+' '+i.qty+' '+i.unit).join(' | ')]));downloadFile('purchases-'+todayIso()+'.csv','\ufeff'+toCsv(rows),'text/csv;charset=utf-8')}
function exportJournalCsv(){const r=reportRangeIso(),rows=[['تاریخ','نوع','شرح','مبلغ/مقدار','جزئیات']].concat(journalEntries(r.start,r.end).map(x=>[formatDate(x.date),x.title,x.desc,x.amount,x.extra]));downloadFile('journal-'+todayIso()+'.csv','\ufeff'+toCsv(rows),'text/csv;charset=utf-8')}

if(typeof document!=='undefined'&&document.addEventListener){document.addEventListener('click',function(ev){const btn=ev.target.closest?.('.dot-menu[data-edit-customer]');if(btn){openAccountEdit(ev,btn.dataset.editCustomer)}})}
async function initApp(){await loadDB();await refreshInternalBackups();await createInternalBackup('daily');const hv=(location.hash||'').replace('#','');if(navItems.some(n=>n[0]===hv))state.view=hv;render();setupBrowserUx()}
initApp();

</script>
